   Contrat : les NOMS de variables sont figés (cf. docs/00-cahier-des-charges.md §8).
   Le DA peut ajuster les valeurs et ajouter des tokens, sans rien renommer ni supprimer.

   Contrastes vérifiés par script (WCAG 2.1 AA, 4,5:1) dans les deux thèmes :
   --color-text, --color-text-muted, --accent, --success, --warning, --danger
   sur --color-bg (dégradé compris), sur chaque verre posé sur le fond,
   et sur tous les fonds *-soft. Les *-ink sont lisibles sur leur *-soft.
   Détail : docs/02-charte-graphique.md.
   ========================================================================== */

:root {
  color-scheme: light;

  /* --- Palette de base ---------------------------------------------------- */
  --white: #FFFFFF;

  --blue-50: #F2F6FF;
  --blue-100: #E3ECFF;
  --blue-200: #CADBFF;
  --blue-300: #A9C3FF;
  --blue-400: #85A7F7;
  --blue-500: #5F86E8;
  --blue-600: #4569D4;            /* ajout : bleu soutenu (dégradés, graphiques) */

  --violet-50: #F6F2FF;
  --violet-100: #ECE4FF;
  --violet-200: #DCCEFF;
  --violet-300: #C3AEFB;
  --violet-400: #A68BF0;
  --violet-500: #8668E0;
  --violet-600: #6A4BD0;          /* ajout : violet soutenu (dégradés, graphiques) */

  /* Accent bleu-violet foncé */
  --accent: #3B2F9E;
  --accent-hover: #2F2483;
  --accent-soft: #EAE7FD;
  --accent-contrast: #FFFFFF;
  /* ajouts : volume de l'accent (bouton primaire) et halo coloré */
  --accent-gradient: linear-gradient(135deg, #4D43C6 0%, #3B2F9E 55%, #35288F 100%);
  --accent-gradient-hover: linear-gradient(135deg, #4239B4 0%, #2F2483 55%, #2A1F78 100%);
  --accent-shadow: 0 1px 2px rgba(47, 36, 131, 0.20), 0 8px 20px -6px rgba(59, 47, 158, 0.55);

  /* ajout : dégradé signature bleu → violet (progression, anneaux, curseurs) */
  --gradient-progress: linear-gradient(90deg, #6D93F2 0%, #7F78EC 50%, #8A5FE2 100%);
  --gradient-progress-start: #6D93F2;
  --gradient-progress-end: #8A5FE2;

  /* --- Surfaces & texte --------------------------------------------------- */
  --color-bg: #F5F6FD;
  --color-bg-gradient:
    radial-gradient(55% 60% at 6% 0%, rgba(183, 205, 255, 0.90) 0%, rgba(183, 205, 255, 0) 72%),
    radial-gradient(50% 55% at 98% 4%, rgba(212, 194, 255, 0.90) 0%, rgba(212, 194, 255, 0) 72%),
    radial-gradient(40% 45% at 70% 60%, rgba(226, 216, 255, 0.75) 0%, rgba(226, 216, 255, 0) 70%),
    radial-gradient(60% 55% at 20% 100%, rgba(203, 221, 255, 0.90) 0%, rgba(203, 221, 255, 0) 72%),
    linear-gradient(180deg, #F7F8FF 0%, #F2F1FD 100%);
  --color-surface: #FFFFFF;
  --color-surface-muted: #F2F3FB;
  --color-text: #1F1B3D;
  --color-text-muted: #57537A;
  --color-text-subtle: #66638B;   /* placeholders, métadonnées : ≥ 4,5:1 sur verre standard et champs */
  --color-border: rgba(59, 47, 158, 0.12);
  --color-border-strong: rgba(59, 47, 158, 0.22);
  --color-overlay: rgba(31, 27, 61, 0.28);

  /* ajouts : états et pistes */
  --color-hover: rgba(59, 47, 158, 0.06);
  --color-pressed: rgba(59, 47, 158, 0.10);
  --color-track: #E5E8F6;           /* piste des barres, anneaux, curseurs */
  --color-inverse-bg: #1F1B3D;      /* infobulles */
  --color-inverse-text: #FFFFFF;
  --color-selection: rgba(134, 104, 224, 0.24);
  --color-raised: #FFFFFF;          /* élément actif posé sur une piste (segmenté, nav) */
  --control-border: #8783AB;        /* bord des cases / interrupteurs : ≥ 3:1 sur le verre */
  --gradient-soft: linear-gradient(135deg, #E1EAFF 0%, #ECE3FF 100%);   /* avatars, illustrations */

  /* ajouts : champs de saisie (légèrement creusés dans le verre) */
  --input-bg: rgba(255, 255, 255, 0.86);
  --input-bg-hover: rgba(255, 255, 255, 0.96);
  --input-shadow: inset 0 1px 2px rgba(59, 47, 158, 0.07);

  /* --- Liquid glass OPAQUE -------------------------------------------------- */
  --glass-bg: rgba(255, 255, 255, 0.76);
  --glass-bg-strong: rgba(255, 255, 255, 0.90);
  --glass-bg-tint-blue: rgba(234, 241, 255, 0.84);
  --glass-bg-tint-violet: rgba(242, 236, 255, 0.84);
  --glass-border: rgba(255, 255, 255, 0.85);
  --glass-blur: 24px;
  --glass-saturate: 170%;
  --glass-highlight:
    radial-gradient(90% 70% at 0% 0%, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.45) 28%, rgba(255, 255, 255, 0) 62%),
    linear-gradient(180deg, rgba(255, 255, 255, 0.40) 0%, rgba(255, 255, 255, 0) 32%);
  --glass-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 1),
    inset 0 -1px 0 rgba(59, 47, 158, 0.05),
    0 1px 2px rgba(59, 47, 158, 0.05),
    0 8px 24px -6px rgba(59, 47, 158, 0.12),
    0 24px 48px -16px rgba(59, 47, 158, 0.14);
  --glass-shadow-hover:
    inset 0 1px 0 rgba(255, 255, 255, 1),
    inset 0 -1px 0 rgba(59, 47, 158, 0.05),
    0 2px 4px rgba(59, 47, 158, 0.06),
    0 14px 32px -8px rgba(59, 47, 158, 0.18),
    0 32px 64px -20px rgba(59, 47, 158, 0.20);
  /* ajouts : bord lumineux (dégradé masqué sur 1 px) et verre au survol */
  --glass-edge: linear-gradient(140deg, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0.55) 30%, rgba(255, 255, 255, 0.25) 60%, rgba(166, 139, 240, 0.35) 100%);
  --glass-bg-hover: rgba(255, 255, 255, 0.84);
  --glass-blur-overlay: 6px;

  /* --- Catégories ----------------------------------------------------------- */
  --cat-flowline: #7FA3FA;
  --cat-flowline-soft: #E3ECFF;
  --cat-flowline-ink: #2A4BA8;
  --cat-carnet: #B097F7;
  --cat-carnet-soft: #EEE6FF;
  --cat-carnet-ink: #5B3BB8;
  --cat-auto: #7CCADF;
  --cat-auto-soft: #DFF3F8;
  --cat-auto-ink: #1D6679;

  /* --- Statuts -------------------------------------------------------------- */
  --status-todo: #A7A4C4;
  --status-todo-soft: #EFEEF7;
  --status-todo-ink: #4C4970;       /* ajout */
  --status-doing: #6F96F6;
  --status-doing-soft: #E3ECFF;
  --status-doing-ink: #2A4BA8;      /* ajout */
  --status-review: #A88BF0;
  --status-review-soft: #EEE6FF;
  --status-review-ink: #5B3BB8;     /* ajout */
  --status-done: #5FC197;
  --status-done-soft: #E2F5EC;
  --status-done-ink: #1B6B4B;       /* ajout */

  /* --- Sémantique ----------------------------------------------------------- */
  --success: #17603F;
  --success-soft: #E2F5EC;
  --warning: #824A08;
  --warning-soft: #FDF0DD;
  --danger: #9E2645;
  --danger-soft: #FCE6EB;
  --danger-contrast: #FFFFFF;       /* ajout : texte sur fond --danger */
  --info: var(--accent);
  --info-soft: var(--accent-soft);

  /* --- Priorités ------------------------------------------------------------ */
  --prio-low: #A3A0C0;
  --prio-normal: #6F92EE;
  --prio-high: #E0922E;
  --prio-urgent: #D9536F;

  /* --- Humeur (1 = au plus bas, 5 = au top) -------------------------------- */
  --mood-1: #9F9BBF;
  --mood-2: #7FA8F2;
  --mood-3: #8E95F4;
  --mood-4: #AE8CF5;
  --mood-5: #7C55EC;

  /* --- Typographie ---------------------------------------------------------- */
  --font-display: "General Sans", "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Poppins", "General Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-pixel: "Pixelify Sans", "Poppins", ui-monospace, monospace;

  --fs-xs: 12px;
  --fs-sm: 13px;
  --fs-md: 15px;
  --fs-lg: 18px;
  --fs-xl: 22px;
  --fs-2xl: 28px;
  --fs-3xl: 36px;
  --fs-display: 44px;

  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 600;
  --fw-bold: 700;

  --lh-tight: 1.2;
  --lh-snug: 1.35;
  --lh-normal: 1.55;

  --ls-tight: -0.02em;
  --ls-normal: 0;
  --ls-wide: 0.04em;
  --ls-caps: 0.08em;               /* ajout : surtitres en capitales */

  /* --- Espacements (base 4) ------------------------------------------------- */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* ajouts : hauteurs de contrôles et tailles d'icônes */
  --control-sm: 32px;
  --control-md: 40px;
  --control-lg: 48px;
  --icon-sm: 16px;
  --icon-md: 20px;
  --icon-lg: 24px;

  /* --- Rayons --------------------------------------------------------------- */
  --radius-xs: 8px;
  --radius-sm: 12px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-xl: 32px;
  --radius-pill: 999px;

  /* --- Ombres simples ------------------------------------------------------- */
  --shadow-sm: 0 1px 2px rgba(31, 27, 61, 0.06), 0 1px 3px rgba(59, 47, 158, 0.06);
  --shadow-md: 0 2px 4px rgba(59, 47, 158, 0.04), 0 8px 20px -4px rgba(59, 47, 158, 0.12);
  --shadow-lg: 0 4px 8px rgba(59, 47, 158, 0.05), 0 24px 56px -12px rgba(59, 47, 158, 0.24);

  /* --- Focus ---------------------------------------------------------------- */
  --focus-ring: 0 0 0 3px rgba(59, 47, 158, 0.35);
  --focus-color: #3B2F9E;           /* ajout : couleur du contour :focus-visible */

  /* --- Mouvement ------------------------------------------------------------ */
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);   /* ajout : petit rebond (coches, interrupteurs) */
  --dur-fast: 140ms;
  --dur-base: 220ms;
  --dur-slow: 400ms;

  /* --- Mise en page --------------------------------------------------------- */
  --sidebar-width: 248px;
  --content-max: 1360px;
  --gutter-mobile: 16px;

  /* --- Plans (z-index) ------------------------------------------------------ */
  --z-nav: 10;
  --z-sticky: 20;
  --z-drawer: 40;
  --z-modal: 50;
  --z-toast: 60;
  --z-tooltip: 70;                  /* ajout */
}

/* ==========================================================================
   Mode sombre — mêmes noms, autres valeurs
   (les deux blocs ci-dessous doivent rester strictement identiques)
   ========================================================================== */

/* ==========================================================================
   2. VERRE — liquid glass opaque
   Couches (de bas en haut) :
   1. flou + saturation de ce qui est derrière (backdrop-filter)
   2. voile laiteux --glass-bg (76 % de blanc en clair)
   3. reflet spéculaire --glass-highlight (::before, en haut à gauche)
   4. contenu
   5. bord lumineux --glass-edge (::after, 1 px masqué)
   + ombres --glass-shadow (liseré intérieur clair + ombre portée colorée)

.glass,
.modal,
.drawer,
.toast {
  position: relative;
  isolation: isolate;
  background-color: var(--glass-bg);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--glass-shadow);

.glass::before,
.modal::before,
.drawer::before,
.toast::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  border-radius: inherit;
  background: var(--glass-highlight);
  pointer-events: none;
}

/* Bord lumineux : dégradé sur 1 px (masque) — clair en haut à gauche, lilas en bas à droite */
.glass::after,
.modal::after,
.drawer::after,
.toast::after {
  content: "";
  position: absolute;
  inset: -1px;
  padding: 1px;
  border-radius: inherit;
  background: var(--glass-edge);
  -webkit-mask: linear-gradient(var(--white) 0 0) content-box, linear-gradient(var(--white) 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(var(--white) 0 0) content-box, linear-gradient(var(--white) 0 0);
  mask-composite: exclude;
  pointer-events: none;
}

  cursor: pointer;
  transition:
    transform var(--dur-base) var(--ease-out),
    box-shadow var(--dur-base) var(--ease-out),

}

.glass--interactive:hover {
  transform: translateY(-2px);
  box-shadow: var(--glass-shadow-hover);
}

.glass--interactive:not(.glass--tint-blue):not(.glass--tint-violet):hover {

}

.glass--interactive:active {
  transform: translateY(0);
  transition-duration: var(--dur-fast);

}

  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-xs);
  background-color: var(--glass-bg-strong);
  color: var(--color-text-muted);
  font-size: var(--fs-xs);
  font-weight: var(--fw-medium);
  line-height: 1;
  white-space: nowrap;
  vertical-align: middle;
}

.tag::before {
  content: "#";
  color: var(--color-text-subtle);
  font-weight: var(--fw-semibold);
}

.tag__remove {
  display: inline-grid;
  place-items: center;
  width: 16px;
  height: 16px;
  margin-right: -4px;
  margin-left: 2px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--color-text-subtle);
  cursor: pointer;
}

.tag__remove:hover {
  background-color: var(--color-pressed);
  color: var(--color-text);
}

.tag__remove .icon {
  width: 12px;
  height: 12px;
}

/* Priorité : point + libellé */
.prio {
  --prio-color: var(--prio-normal);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: var(--fs-sm);
  font-weight: var(--fw-medium);
  line-height: 1.2;
  color: var(--color-text-muted);
  white-space: nowrap;
}

.prio::before {
  content: "";
  width: 8px;
  height: 8px;
  flex: none;
  border-radius: 50%;
  background-color: var(--prio-color);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--prio-color) 22%, transparent);
}

.prio--low    { --prio-color: var(--prio-low); }
.prio--normal { --prio-color: var(--prio-normal); }
.prio--high   { --prio-color: var(--prio-high); color: var(--warning); }
.prio--urgent { --prio-color: var(--prio-urgent); color: var(--danger); font-weight: var(--fw-semibold); }

/* Basse = anneau creux : la forme double la couleur */
.prio--low::before {
  background-color: transparent;
  box-shadow: inset 0 0 0 2px var(--prio-color);
}

/* Urgente = halo double */
.prio--urgent::before {
  box-shadow:
    0 0 0 3px color-mix(in srgb, var(--prio-color) 25%, transparent),
    0 0 0 6px color-mix(in srgb, var(--prio-color) 10%, transparent);
}


/* ==========================================================================
   5. FORMULAIRES
   ========================================================================== */

.field {
  display: grid;
  gap: 6px;
  min-width: 0;
}

.label {
  font-size: var(--fs-sm);
  font-weight: var(--fw-medium);
  line-height: var(--lh-snug);
  color: var(--color-text);
}

.label__optional {
  margin-left: 4px;
  font-weight: var(--fw-regular);
  color: var(--color-text-subtle);
}

.hint {
  font-size: var(--fs-xs);
  line-height: var(--lh-snug);
  color: var(--color-text-muted);
}

.field--error .hint {
  color: var(--danger);
  font-weight: var(--fw-medium);
}

.input,
.select,
.textarea {
  display: block;
  width: 100%;
  height: var(--control-md);
  margin: 0;
  padding: 0 14px;
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-sm);
  background-color: var(--input-bg);
  box-shadow: var(--input-shadow);
  color: var(--color-text);
  font-family: var(--font-body);
  font-size: var(--fs-md);
  line-height: var(--lh-normal);
  transition:
    border-color var(--dur-base) var(--ease-out),
    box-shadow var(--dur-base) var(--ease-out),
    background-color var(--dur-base) var(--ease-out);
}

.input::placeholder,
.textarea::placeholder {
  color: var(--color-text-subtle);
  opacity: 1;
}

.input:hover,
.select:hover,
.textarea:hover {
  background-color: var(--input-bg-hover);
  border-color: color-mix(in srgb, var(--accent) 35%, transparent);
}

.input:focus,
.select:focus,
.textarea:focus {
  outline: none;
  background-color: var(--input-bg-hover);
  border-color: var(--accent);
  box-shadow: var(--input-shadow), var(--focus-ring);
}

.input:disabled,
.select:disabled,
.textarea:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.field--error .input,
.field--error .select,
.field--error .textarea {
  border-color: var(--danger);
}

.field--error .input:focus,
.field--error .textarea:focus {
  box-shadow: var(--input-shadow), 0 0 0 3px color-mix(in srgb, var(--danger) 30%, transparent);
}

.textarea {
  height: auto;
  min-height: 104px;
  padding: 10px 14px;
  resize: vertical;
}

/* Sélecteur natif + chevron dessiné en dégradés (couleur issue des tokens) */
.select {
  -webkit-appearance: none;
  appearance: none;
  padding-right: 40px;
  cursor: pointer;
  background-image:
    linear-gradient(45deg, transparent 50%, var(--color-text-muted) 50%),
    linear-gradient(135deg, var(--color-text-muted) 50%, transparent 50%);
  background-position:
    calc(100% - 21px) 52%,
    calc(100% - 16px) 52%;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
}

.select option {
  background-color: var(--color-surface);
  color: var(--color-text);
}

/* Champ avec icône (recherche) */
.input-wrap {
  position: relative;
  display: flex;
  align-items: center;
  min-width: 0;
}

.input-wrap > .icon {
  position: absolute;
  left: 13px;
  width: 18px;
  height: 18px;
  color: var(--color-text-subtle);
  pointer-events: none;
}

.input-wrap > .input {
  padding-left: 40px;
}

.input-wrap > .kbd {
  position: absolute;
  right: 10px;
  pointer-events: none;
}

.input-wrap > .kbd ~ .input,
.input-wrap > .input:has(~ .kbd) {
  padding-right: 64px;
}

/* --- Case à cocher (checklist) ------------------------------------------- */
.checkbox {
  position: relative;
  display: inline-flex;
  align-items: flex-start;
  gap: 12px;
  min-height: 24px;
  color: var(--color-text);
  font-size: var(--fs-md);
  line-height: 24px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.checkbox__input {
  position: absolute;
  top: 2px;
  left: 0;
  width: 20px;
  height: 20px;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}

.checkbox__box {
  position: relative;
  flex: none;
  width: 20px;
  height: 20px;
  margin-top: 2px;
  border: 1.5px solid var(--control-border);
  border-radius: 7px;
  background-color: var(--input-bg-hover);
  box-shadow: var(--input-shadow);
  transition:
    background-color var(--dur-base) var(--ease-out),
    border-color var(--dur-base) var(--ease-out),
    box-shadow var(--dur-base) var(--ease-out),
    transform var(--dur-fast) var(--ease-out);
}

/* Coche dessinée (L pivoté) */
.checkbox__box::after {
  content: "";
  position: absolute;
  left: 5.5px;
  top: 1.5px;
  width: 6px;
  height: 11px;
  border: solid var(--accent-contrast);
  border-width: 0 2.25px 2.25px 0;
  border-radius: 1px;
  transform: rotate(45deg) scale(0);
  transform-origin: 60% 60%;
  transition: transform var(--dur-base) var(--ease-spring);
}

.checkbox:hover .checkbox__box {
  border-color: var(--accent);
}

.checkbox__input:active + .checkbox__box {
  transform: scale(0.92);
}

.checkbox__input:checked + .checkbox__box {
  border-color: transparent;
  background-color: var(--accent);
  background-image: var(--accent-gradient);
  box-shadow: inset 0 1px 0 color-mix(in srgb, var(--white) 25%, transparent), 0 4px 10px -4px color-mix(in srgb, var(--accent) 70%, transparent);
}

.checkbox__input:checked + .checkbox__box::after {
  transform: rotate(45deg) scale(1);
}

.checkbox__input:focus-visible + .checkbox__box {
  outline: 2px solid var(--focus-color);
  outline-offset: 2px;
}

.checkbox__input:disabled + .checkbox__box,
.checkbox__input:disabled ~ .checkbox__label {
  opacity: 0.5;
  cursor: not-allowed;
}

.checkbox__label {
  min-width: 0;
  transition: color var(--dur-base) var(--ease-out);
}

/* Variante checklist : le libellé coché est barré et s'estompe */
.checkbox--strike .checkbox__label {
  text-decoration-line: line-through;
  text-decoration-thickness: 1.5px;
  text-decoration-color: transparent;
  transition:
    color var(--dur-base) var(--ease-out),
    text-decoration-color var(--dur-base) var(--ease-out);
}

.checkbox--strike .checkbox__input:checked ~ .checkbox__label {
  color: var(--color-text-muted);
  text-decoration-color: color-mix(in srgb, var(--accent) 55%, transparent);
}

/* --- Interrupteur ---------------------------------------------------------- */
.switch {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 12px;
  min-height: 24px;
  color: var(--color-text);
  font-size: var(--fs-md);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.switch__input {
  position: absolute;
  top: 0;
  left: 0;
  width: 42px;
  height: 24px;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}

.switch__track {
  position: relative;
  flex: none;
  width: 42px;
  height: 24px;
  border-radius: var(--radius-pill);
  background-color: var(--control-border);
  box-shadow: var(--input-shadow);
  transition: background-color var(--dur-base) var(--ease-out);
}

.switch__track::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background-color: var(--white);
  box-shadow: var(--shadow-sm);
  transition: transform var(--dur-base) var(--ease-spring);
}

.switch__input:checked + .switch__track {
  background-color: var(--accent);
  background-image: var(--accent-gradient);
}

.switch__input:checked + .switch__track::after {
  transform: translateX(18px);
}

.switch__input:focus-visible + .switch__track {
  outline: 2px solid var(--focus-color);
  outline-offset: 2px;
}

.switch__input:disabled + .switch__track,
.switch__input:disabled ~ .switch__label {
  opacity: 0.5;
  cursor: not-allowed;
}

/* --- Curseur d'avancement (%) --------------------------------------------- */
.range {
  --value: 50;
  --thumb: 24px;
  --track-h: 10px;
  --fill: calc((100% - var(--thumb)) * var(--value) / 100 + var(--thumb) / 2);
  -webkit-appearance: none;
  appearance: none;
  display: block;
  width: 100%;
  height: var(--thumb);
  margin: 0;
  background: transparent;
  cursor: pointer;
}

.range:focus-visible {
  outline: none;
}

/* Chromium / Electron */
.range::-webkit-slider-runnable-track {
  height: var(--track-h);
  border-radius: var(--radius-pill);
  background:
    var(--gradient-progress) 0 0 / var(--fill) 100% no-repeat,
    var(--color-track);
  box-shadow: var(--input-shadow);
}

.range::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: var(--thumb);
  height: var(--thumb);
  margin-top: calc((var(--track-h) - var(--thumb)) / 2);
  border: 0;
  border-radius: 50%;
  background:
    radial-gradient(circle closest-side, var(--accent) 0 32%, transparent 36%),
    var(--white);
  box-shadow:
    0 0 0 1px color-mix(in srgb, var(--accent) 18%, transparent),
    var(--shadow-md);
  transition:
    transform var(--dur-fast) var(--ease-out),
    box-shadow var(--dur-base) var(--ease-out);
}

.range:hover::-webkit-slider-thumb {
  transform: scale(1.08);
}

.range:active::-webkit-slider-thumb {
  transform: scale(1.14);
}

.range:focus-visible::-webkit-slider-thumb {
  box-shadow:
    0 0 0 1px color-mix(in srgb, var(--accent) 18%, transparent),
    var(--shadow-md),
    var(--focus-ring);
}

/* Firefox */
.range::-moz-range-track {
  height: var(--track-h);
  border-radius: var(--radius-pill);
  background-color: var(--color-track);
  box-shadow: var(--input-shadow);
}

.range::-moz-range-progress {
  height: var(--track-h);
  border-radius: var(--radius-pill);
  background: var(--gradient-progress);
}

.range::-moz-range-thumb {
  width: var(--thumb);
  height: var(--thumb);
  border: 0;
  border-radius: 50%;
  background:
    radial-gradient(circle closest-side, var(--accent) 0 32%, transparent 36%),
    var(--white);
  box-shadow: var(--shadow-md);
}

.range:focus-visible::-moz-range-thumb {
  box-shadow: var(--shadow-md), var(--focus-ring);
}

.range:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* Bloc curseur complet : libellé, valeur, graduations */
.range-field {
  display: grid;
  gap: 10px;
  min-width: 0;
}

.range-field__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-3);
}

.range-field__value {
  font-family: var(--font-display);
  font-size: var(--fs-xl);
  font-weight: var(--fw-semibold);
  font-variant-numeric: tabular-nums;
  letter-spacing: var(--ls-tight);
  line-height: 1;
  color: var(--accent);
}

.range-field__scale {
  display: flex;
  justify-content: space-between;
  padding: 0 calc(var(--space-3) - 2px);
  font-size: var(--fs-xs);
  font-variant-numeric: tabular-nums;
  color: var(--color-text-muted);
}

.range-field__scale > span {
  position: relative;
  width: 0;
  display: flex;
  justify-content: center;
  white-space: nowrap;
}


/* ==========================================================================
   6. NAVIGATION LOCALE — segmented, tabs
   ========================================================================== */

.segmented {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: var(--radius-pill);
  background-color: var(--color-track);
  box-shadow: var(--input-shadow);
  max-width: 100%;
}

.segmented__item {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  flex: 1 1 auto;
  height: 32px;
  padding: 0 16px;
  border: 0;
  border-radius: var(--radius-pill);
  background: transparent;
  color: var(--color-text-muted);
  font-size: var(--fs-sm);
  font-weight: var(--fw-medium);
  line-height: 1;
  white-space: nowrap;
  cursor: pointer;
  transition:
    background-color var(--dur-base) var(--ease-out),
    color var(--dur-base) var(--ease-out),
    box-shadow var(--dur-base) var(--ease-out);
}

.segmented__item:hover {
  color: var(--color-text);
}

.segmented__item[aria-pressed="true"],
.segmented__item[aria-selected="true"],
.segmented__item.is-active {
  background-color: var(--color-raised);
  color: var(--color-text);
  font-weight: var(--fw-semibold);
  box-shadow: var(--shadow-sm), inset 0 1px 0 var(--glass-border);
}

.segmented__item .icon {
  width: var(--icon-sm);
  height: var(--icon-sm);
}

.tabs {
  display: flex;
  align-items: stretch;
  gap: var(--space-6);
  border-bottom: 1px solid var(--color-border);
  overflow-x: auto;
  scrollbar-width: none;
}

.tabs::-webkit-scrollbar {
  display: none;
}

.tabs__item {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 44px;
  padding: 0 2px;
  border: 0;
  background: transparent;
  color: var(--color-text-muted);
  font-size: var(--fs-md);
  font-weight: var(--fw-medium);
  white-space: nowrap;
  cursor: pointer;
  transition: color var(--dur-base) var(--ease-out);
}

.tabs__item::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 3px;
  border-radius: 3px 3px 0 0;
  background: var(--gradient-progress);
  transform: scaleX(0);
  transition: transform var(--dur-base) var(--ease-out);
}

.tabs__item:hover {
  color: var(--color-text);
}

.tabs__item[aria-selected="true"],
.tabs__item.is-active {
  color: var(--accent);
  font-weight: var(--fw-semibold);
}

.tabs__item[aria-selected="true"]::after,
.tabs__item.is-active::after {
  transform: scaleX(1);
}

.tabs__item:focus-visible {
  outline-offset: -2px;
  border-radius: var(--radius-xs);
}

.tabs__item .icon {
  width: 18px;
  height: 18px;
}


/* ==========================================================================
   7. DONNÉES — progress, ring, stat
   ========================================================================== */

.progress {
  --value: 0;
  --progress-fill: var(--gradient-progress);
  position: relative;
  display: block;
  width: 100%;
  height: 8px;
  border-radius: var(--radius-pill);
  background-color: var(--color-track);
  box-shadow: var(--input-shadow);
  overflow: hidden;
}

.progress::after {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: calc(min(var(--value), 100) * 1%);
  border-radius: inherit;
  background: var(--progress-fill);
  transition: width var(--dur-slow) var(--ease-out);
}

.progress--sm { height: 4px; }
.progress--lg { height: 12px; }

.progress--flowline { --progress-fill: var(--cat-flowline); }
.progress--carnet   { --progress-fill: var(--cat-carnet); }
.progress--auto     { --progress-fill: var(--cat-auto); }
.progress--success  { --progress-fill: var(--status-done); }
.progress--warning  { --progress-fill: var(--prio-high); }
.progress--danger   { --progress-fill: var(--prio-urgent); }

/* Anneau : conic-gradient masqué + embouts arrondis */
.ring {
  --value: 0;
  --ring-size: 104px;
  --ring-thickness: 10px;
  --ring-start: var(--gradient-progress-start);
  --ring-end: var(--gradient-progress-end);
  position: relative;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: none;
  width: var(--ring-size);
  height: var(--ring-size);
  text-align: center;
}

.ring::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background:
    radial-gradient(circle calc(var(--ring-thickness) / 2) at 50% calc(var(--ring-thickness) / 2), var(--ring-start) 92%, transparent 100%),
    conic-gradient(var(--ring-start) 0%, var(--ring-end) calc(var(--value) * 1%), var(--color-track) 0);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - var(--ring-thickness) - 0.5px), var(--white) calc(100% - var(--ring-thickness)));
  mask: radial-gradient(farthest-side, transparent calc(100% - var(--ring-thickness) - 0.5px), var(--white) calc(100% - var(--ring-thickness)));
}

/* Embout de fin, tourné selon la valeur */
.ring::after {
  content: "";
  position: absolute;
  top: 0;
  left: calc(50% - var(--ring-thickness) / 2);
  width: var(--ring-thickness);
  height: var(--ring-thickness);
  border-radius: 50%;
  background-color: var(--ring-end);
  transform-origin: 50% calc(var(--ring-size) / 2);
  transform: rotate(calc(min(var(--value), 100) * 3.6deg));
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--ring-end) 30%, transparent);
}

.ring__value {
  position: relative;
  font-family: var(--font-display);
  font-size: calc(var(--ring-size) * 0.24);
  font-weight: var(--fw-semibold);
  font-variant-numeric: tabular-nums;
  letter-spacing: var(--ls-tight);
  line-height: 1;
  color: var(--color-text);
}

.ring__value small {
  margin-left: 1px;
  font-size: 0.55em;
  font-weight: var(--fw-medium);
  color: var(--color-text-muted);
}

.ring__label {
  position: relative;
  margin-top: 4px;
  font-size: var(--fs-xs);
  line-height: 1.2;
  color: var(--color-text-muted);
}

.ring--sm { --ring-size: 56px; --ring-thickness: 6px; }
.ring--sm .ring__label { display: none; }
.ring--lg { --ring-size: 148px; --ring-thickness: 13px; }

.ring--flowline { --ring-start: var(--cat-flowline); --ring-end: color-mix(in srgb, var(--cat-flowline) 65%, var(--cat-flowline-ink)); }
.ring--carnet   { --ring-start: var(--cat-carnet);   --ring-end: color-mix(in srgb, var(--cat-carnet) 65%, var(--cat-carnet-ink)); }
.ring--auto     { --ring-start: var(--cat-auto);     --ring-end: color-mix(in srgb, var(--cat-auto) 65%, var(--cat-auto-ink)); }

/* Tuile KPI */
.stat {
  --stat-icon-bg: var(--accent-soft);
  --stat-icon-ink: var(--accent);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  padding: var(--space-5);
  min-width: 0;
}

.stat__head {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.stat__icon {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  flex: none;
  border-radius: var(--radius-sm);
  background-color: var(--stat-icon-bg);
  color: var(--stat-icon-ink);
  box-shadow: inset 0 1px 0 var(--glass-border);
}

.stat__icon .icon {
  width: var(--icon-md);
  height: var(--icon-md);
}

.stat__label {
  min-width: 0;
  font-size: var(--fs-sm);
  font-weight: var(--fw-medium);
  line-height: var(--lh-snug);
  color: var(--color-text-muted);
}

.stat__value {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 2px 6px;
  font-family: var(--font-display);
  font-size: var(--fs-3xl);
  font-weight: var(--fw-semibold);
  font-variant-numeric: tabular-nums;
  letter-spacing: var(--ls-tight);
  line-height: 1.05;
  color: var(--color-text);
}

.mood-now__level { font-family: var(--font-display); font-size: var(--fs-lg); font-weight: var(--fw-semibold); }
.mood-now__note { font-size: var(--fs-sm); color: var(--color-text-muted); }
.mood-ask { font-size: var(--fs-sm); color: var(--color-text-muted); }
.mood-week-wrap { display: grid; gap: var(--space-2); margin-top: auto; padding-top: var(--space-3); border-top: 1px solid var(--color-border); }
.mood-week__caption { font-size: var(--fs-xs); font-weight: var(--fw-semibold); color: var(--color-text-muted); }
.mood-week {
  display: flex;

  gap: var(--space-2);
  margin: 0;
  padding: 0;
  list-style: none;
}

.mood-week__art { display: grid; place-items: center; width: 32px; height: 32px; }

.mood-week__day.is-today .mood-week__label { color: var(--accent); font-weight: var(--fw-bold); }

/* Sélecteur d'humeur (modale et carte) */
.mood-picker { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--space-2); }
.mood-option {
  display: grid;
  justify-items: center;
  align-content: start;
  gap: var(--space-2);
  min-width: 0;
  padding: 14px 4px 12px;
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-md);
  background-color: var(--input-bg-hover);
  box-shadow: var(--shadow-sm);
  text-align: center;
  transition: transform var(--dur-fast) var(--ease-out), border-color var(--dur-base) var(--ease-out), background-color var(--dur-base) var(--ease-out);
}
.mood-option:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }

  border-color: var(--accent);
  background-color: var(--accent-soft);
  box-shadow: inset 0 0 0 1px var(--accent);
}
.mood-option__art { display: grid; place-items: center; min-height: 48px; }
.mood-option__label { font-size: var(--fs-xs); font-weight: var(--fw-semibold); line-height: var(--lh-snug); color: var(--color-text); }
.mood-picker--inline .mood-option { padding: 10px 2px 8px; }
.mood-status { min-height: 1.35em; font-size: var(--fs-sm); color: var(--success); }

/* Tâches en cours */
.doing-card, .due-card, .recap-card, .hours-card, .mood-card { height: 100%; }
.subsection-title {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin: var(--space-2) 0 0;
  padding-top: var(--space-4);
  border-top: 1px solid var(--color-border);
  font-family: var(--font-body);
  font-size: var(--fs-sm);
  font-weight: var(--fw-semibold);
  letter-spacing: 0;
  color: var(--color-text-muted);
}
.subsection-title .icon { width: 16px; height: 16px; }
.task-rows { display: grid; gap: var(--space-1); margin: 0 calc(var(--space-3) * -1); padding: 0; list-style: none; }
.task-row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) 112px 118px;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-md);
  transition: background-color var(--dur-base) var(--ease-out);
}
.task-row:hover { background-color: var(--color-hover); }
.task-row.is-timing { background-color: var(--glass-bg-tint-blue); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 22%, transparent); }
.task-row__play.is-running { box-shadow: var(--accent-shadow); }
.task-row__main { display: grid; gap: 2px; min-width: 0; }
.task-row__title { overflow: hidden; font-size: var(--fs-md); font-weight: var(--fw-semibold); white-space: nowrap; text-overflow: ellipsis; }
.task-row__main:hover .task-row__title { color: var(--accent); }
.task-row__meta { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; font-size: var(--fs-xs); color: var(--color-text-muted); white-space: nowrap; text-overflow: ellipsis; }
.task-row__meta-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.task-row__progress { display: grid; gap: 5px; }
.task-row__pct { justify-self: end; font-size: var(--fs-xs); font-weight: var(--fw-semibold); color: var(--color-text-muted); }
.task-row__clock { font-size: var(--fs-md); font-weight: var(--fw-semibold); color: var(--accent); text-align: right; }
.task-row__due { justify-self: end; }

/* Échéances et « à replanifier » */
.replan {
  display: grid;
  gap: var(--space-2);
  padding: var(--space-4);
  border-radius: var(--radius-md);
  background-color: var(--color-hover);
}
.replan__title { display: flex; align-items: center; gap: var(--space-2); margin: 0; font-family: var(--font-body); font-size: var(--fs-sm); font-weight: var(--fw-semibold); letter-spacing: 0; }
.replan__title .icon { width: 16px; height: 16px; color: var(--warning); }
.replan__hint { font-size: var(--fs-xs); color: var(--color-text-muted); }
.replan__list { display: grid; margin: 0; padding: 0; list-style: none; }
.replan-row { display: grid; gap: var(--space-2); padding: var(--space-3) 0; border-top: 1px solid var(--color-border); }
.replan-row:first-child { border-top: 0; padding-top: var(--space-1); }
.replan-row:last-child { padding-bottom: 0; }
.replan-row__main { display: grid; gap: 2px; min-width: 0; }
.replan-row__title { font-size: var(--fs-sm); font-weight: var(--fw-semibold); }
.replan-row__main:hover .replan-row__title { color: var(--accent); }
.replan-row__meta { display: flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--color-text-muted); }
.replan-row__actions { display: flex; flex-wrap: wrap; gap: 6px; }

.due-list { display: grid; gap: 2px; margin: 0 calc(var(--space-2) * -1); padding: 0; list-style: none; }
.due-row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--space-3);
  width: 100%;
  padding: var(--space-2);
  border-radius: var(--radius-md);
  transition: background-color var(--dur-base) var(--ease-out);
}
.due-row:hover { background-color: var(--color-hover); }
.due-row__text { display: grid; gap: 2px; min-width: 0; }
.due-row__title { overflow: hidden; font-size: var(--fs-sm); font-weight: var(--fw-semibold); white-space: nowrap; text-overflow: ellipsis; }
.due-row__meta { display: flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--color-text-muted); }
.prio--dot-only { gap: 0; padding: 0 6px; }

.date-tile {
  display: grid;
  place-items: center;
  align-content: center;
  width: 44px;
  height: 46px;

  line-height: 1.05;
}
.date-tile__dow { font-size: var(--fs-xs); font-weight: var(--fw-semibold); text-transform: uppercase; letter-spacing: var(--ls-wide); color: var(--color-text-muted); }
.date-tile__day { font-size: var(--fs-lg); font-weight: var(--fw-semibold); color: var(--color-text); }
.date-tile--soon { background-color: var(--accent-soft); }
.date-tile--soon .date-tile__dow, .date-tile--soon .date-tile__day { color: var(--accent); }

/* Récap express */
.mini-stats { display: grid; margin: 0; padding: 0; list-style: none; }
.mini-stat {
  --stat-icon-bg: var(--accent-soft);
  --stat-icon-ink: var(--accent);
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-3) 0;
  border-top: 1px solid var(--color-border);
}
.mini-stat:first-child { border-top: 0; padding-top: var(--space-1); }
.mini-stat:last-child { padding-bottom: 0; }
.mini-stat .stat__icon { display: grid; place-items: center; width: 32px; height: 32px; border-radius: var(--radius-xs); background-color: var(--stat-icon-bg); color: var(--stat-icon-ink); box-shadow: inset 0 1px 0 var(--glass-border); }
.mini-stat .stat__icon .icon { width: 17px; height: 17px; }
.mini-stat__text { display: grid; min-width: 0; }
.mini-stat__label { font-size: var(--fs-sm); font-weight: var(--fw-semibold); }
.mini-stat__sub { font-size: var(--fs-xs); color: var(--color-text-muted); }
.mini-stat__value { font-size: var(--fs-2xl); font-weight: var(--fw-semibold); line-height: 1; }
.recap-card .segmented { margin-top: calc(var(--space-1) * -1); }
.stat__sub { font-size: var(--fs-xs); line-height: var(--lh-snug); color: var(--color-text-muted); }
.stat--done, .mini-stat.stat--done { --stat-icon-bg: var(--success-soft); --stat-icon-ink: var(--success); }
.stat--replan, .mini-stat.stat--replan { --stat-icon-bg: var(--warning-soft); --stat-icon-ink: var(--warning); }

/* ==========================================================================
   4. SUIVI DES TÂCHES
   ========================================================================== */

.filters { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-3); padding: var(--space-4); border-radius: var(--radius-lg); }
.filters__row > * { min-width: 0; }
.filters__row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
.filters__search { flex: 1 1 320px; }
.filters__search .input { height: var(--control-md); }
.filters__cats { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.filters__cats .chip { height: 32px; padding: 0 14px 0 12px; font-size: var(--fs-sm); }
.filters__cats .chip[aria-pressed="false"],
.chip-picker .chip[aria-pressed="false"] { --chip-bg: var(--color-track); --chip-ink: var(--color-text-muted); }
.filters__row--selects { gap: var(--space-2) var(--space-4); }
.filters__select { display: inline-flex; align-items: center; gap: var(--space-2); }
.filters__select .select { width: auto; min-width: 128px; }
.filters__label { font-size: var(--fs-xs); font-weight: var(--fw-semibold); color: var(--color-text-muted); white-space: nowrap; }
.filters__select--sort { display: none; }
.filters__clear { margin-left: auto; }
.filters__count { margin: calc(var(--space-3) * -1) 0 0 var(--space-1); font-size: var(--fs-xs); color: var(--color-text-muted); }

/* Kanban */
.kanban {
  display: grid;
  grid-template-columns: repeat(4, minmax(232px, 1fr));
  align-items: start;
  gap: var(--space-4);
}
.kanban__col {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: var(--space-3);
  border-radius: var(--radius-lg);
}
.kanban__head { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-1) var(--space-1) var(--space-3) var(--space-2); }
.kanban__title { margin: 0; font-size: inherit; line-height: 1; }
.kanban__count { font-size: var(--fs-sm); font-weight: var(--fw-semibold); color: var(--color-text-muted); }
.kanban__add { margin-left: auto; }
.kanban__list { display: grid; align-content: start; gap: var(--space-3); min-height: 140px; padding: 2px; border-radius: var(--radius-md); transition: background-color var(--dur-base) var(--ease-out); }
.kanban__col.is-drop-target .kanban__list { background-color: var(--color-hover); }
.kanban__empty {
  display: grid;
  place-items: center;
  min-height: 120px;
  margin: 0;
  padding: var(--space-4);
  border: 1.5px dashed var(--color-border-strong);
  border-radius: var(--radius-md);
  font-size: var(--fs-xs);
  color: var(--color-text-muted);
  text-align: center;
}

.task-card {
  display: grid;
  gap: var(--space-3);
  padding: var(--space-4);
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
}
.task-card:active { cursor: grabbing; }
.task-card__top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px var(--space-2); min-width: 0; padding-right: 28px; }
.task-card__top .chip { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.task-card__top .prio { font-size: var(--fs-xs); }
.task-card__grip {
  position: absolute;
  top: 0;
  left: 50%;
  z-index: 1;
  display: grid;
  place-items: center;
  width: 44px;
  height: 15px;
  margin-left: -22px;
  border-radius: 0 0 var(--radius-xs) var(--radius-xs);
  color: var(--color-text-subtle);
  opacity: 0;
  touch-action: none;
  cursor: grab;
  transition: opacity var(--dur-base) var(--ease-out);
}
.task-card__grip .icon { width: 16px; height: 16px; transform: rotate(90deg); }
.task-card:hover .task-card__grip, .task-card:focus-within .task-card__grip { opacity: 1; }
.task-card__menu { position: absolute; top: 10px; right: 10px; z-index: 1; }
.task-card__title {
  margin: 0;
  font-family: var(--font-display);
  font-size: var(--fs-md);
  font-weight: var(--fw-semibold);
  line-height: var(--lh-snug);
  letter-spacing: -0.01em;
  color: var(--color-text);
  overflow-wrap: anywhere;
}
.task-card__client { display: flex; align-items: center; gap: 6px; margin-top: -6px; font-size: var(--fs-xs); color: var(--color-text-muted); }
.task-card__client .icon { width: 14px; height: 14px; }
.task-card__tags { display: flex; flex-wrap: wrap; gap: 6px; }
.task-card__progress { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--space-3); }
.task-card__progress .progress { order: -1; }
.task-card__pct { font-size: var(--fs-xs); font-weight: var(--fw-semibold); color: var(--color-text-muted); }
.task-card__foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2) var(--space-3);
  padding-top: var(--space-3);
  border-top: 1px solid var(--color-border);
  font-size: var(--fs-xs);
  color: var(--color-text-muted);
}
.task-card__meta { display: inline-flex; align-items: center; gap: 4px; font-weight: var(--fw-medium); }
.task-card__meta .icon { width: 14px; height: 14px; }
.task-card__live { display: inline-flex; align-items: center; gap: 6px; font-weight: var(--fw-semibold); color: var(--accent); }
.task-card__due { margin-left: auto; }
.task-card--done .task-card__title { color: var(--color-text-muted); }
.task-card__done { display: inline-flex; align-items: center; gap: 4px; font-weight: var(--fw-semibold); color: var(--success); }
.task-card__done .icon { width: 14px; height: 14px; }
.task-card.is-timing { box-shadow: var(--shadow-sm), inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 40%, transparent); }
.task-card.is-dragging { opacity: 0.35; }
.is-dragging-card, .is-dragging-card * { cursor: grabbing !important; }
.tag--more::before { content: none; }

.drop-marker {
  height: 4px;
  margin: -2px 6px;
  border-radius: var(--radius-pill);
  background: var(--gradient-progress);
  box-shadow: 0 0 0 4px var(--accent-soft);
}
.drag-ghost {
  position: fixed;
  top: 0;
  left: 0;
  z-index: var(--z-toast);
  pointer-events: none;
  box-shadow: var(--shadow-lg);
  opacity: 0.95;
}

.kbd-help { font-size: var(--fs-xs); line-height: 2; color: var(--color-text-muted); }
.kbd-help--touch { display: none; }
@media (hover: none) { .kbd-help--touch { display: block; } .kbd-help--desk { display: none; } .task-card__grip { opacity: 1; } }
.kbd-help .kbd { margin: 0 1px; }

/* Vue liste */
.list-card { padding: 0; overflow: visible; }
.table-scroll { overflow-x: auto; border-radius: inherit; }
.task-table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
.task-table thead th {
  padding: var(--space-4) var(--space-3) var(--space-3);
  border-bottom: 1px solid var(--color-border-strong);
  font-size: var(--fs-xs);
  font-weight: var(--fw-semibold);
  color: var(--color-text-muted);
  text-align: left;
  white-space: nowrap;
}
.task-table thead th:first-child, .task-table td:first-child { padding-left: var(--space-6); }
.task-table thead th:last-child, .task-table td:last-child { padding-right: var(--space-6); }
.task-table td { padding: var(--space-3); border-bottom: 1px solid var(--color-border); vertical-align: middle; }
.task-table tbody tr:last-child td { border-bottom: 0; }
.task-table tbody tr { cursor: pointer; transition: background-color var(--dur-base) var(--ease-out); }
.task-table tbody tr:hover { background-color: var(--color-hover); }
.task-table tr.is-done .row-title { color: var(--color-text-muted); }
.th-sort { display: inline-flex; align-items: center; gap: 6px; margin: -4px -6px; padding: 4px 6px; border-radius: var(--radius-xs); }
.th-sort:hover { background-color: var(--color-hover); color: var(--color-text); }
.th-sort.is-sorted { color: var(--accent); }
.th-sort__icon { display: inline-flex; }
.th-sort__icon .icon { width: 14px; height: 14px; }
.th-sort:not(.is-sorted) .th-sort__icon { opacity: 0.55; }
.col-title { min-width: 260px; }
.row-title { font-size: var(--fs-sm); font-weight: var(--fw-semibold); line-height: var(--lh-snug); color: var(--color-text); }
.row-title:hover { color: var(--accent); }
.row-sub { display: block; margin-top: 2px; font-size: var(--fs-xs); color: var(--color-text-muted); }
.cell-progress { display: grid; grid-template-columns: 40px minmax(64px, 1fr); align-items: center; gap: var(--space-2); font-size: var(--fs-xs); font-weight: var(--fw-semibold); color: var(--color-text-muted); }
.col-progress { min-width: 150px; }
.col-num { text-align: right; white-space: nowrap; }
.task-table thead .col-num { text-align: right; }

/* ==========================================================================
   5. TIROIR ET MODALES
   ========================================================================== */

.task-drawer { width: min(540px, calc(100vw - 2 * var(--space-3))); }
.drawer__heading { display: grid; flex: 1; gap: 6px; min-width: 0; }
.drawer__chips { display: flex; flex-wrap: wrap; gap: 6px; }
.title-input {
  display: block;
  width: 100%;
  min-height: 0;
  margin: 2px 0 0 -8px;
  padding: 4px 8px;
  border: 1px solid transparent;
  border-radius: var(--radius-xs);
  background: transparent;
  color: var(--color-text);
  font-family: var(--font-display);
  font-size: var(--fs-xl);
  font-weight: var(--fw-semibold);
  line-height: var(--lh-snug);
  letter-spacing: var(--ls-tight);
  resize: none;
  overflow: hidden;
  transition: border-color var(--dur-base) var(--ease-out), background-color var(--dur-base) var(--ease-out);
}
.title-input:hover { border-color: var(--color-border-strong); }
.title-input:focus { outline: none; border-color: var(--accent); background-color: var(--input-bg-hover); box-shadow: var(--focus-ring); }
.task-drawer .drawer__header { align-items: flex-start; }
.task-drawer:focus { outline: none; }
.task-drawer .drawer__body { gap: var(--space-5); padding-bottom: var(--space-8); }

.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); }
.form-grid__full { grid-column: 1 / -1; margin-top: calc(var(--space-2) * -1); }
.form-grid.field--error .hint { color: var(--danger); font-weight: var(--fw-medium); }

.drawer-section { display: grid; gap: var(--space-3); padding-top: var(--space-5); border-top: 1px solid var(--color-border); }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }
.section-title {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin: 0;
  font-family: var(--font-display);
  font-size: var(--fs-md);
  font-weight: var(--fw-semibold);
  letter-spacing: var(--ls-tight);
}
.section-title .icon { width: 18px; height: 18px; color: var(--accent); }
.section-meta { font-size: var(--fs-xs); font-weight: var(--fw-semibold); color: var(--color-text-muted); }

.tag-editor { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tag-editor__add .input { width: 140px; height: 28px; font-size: var(--fs-xs); border-radius: var(--radius-xs); }

.reminder { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3); }
.reminder .select { width: auto; }
[data-dr-reminder] { display: grid; gap: 6px; }

.checklist { display: grid; gap: 2px; margin: 0 calc(var(--space-2) * -1); padding: 0; list-style: none; }
.checklist__item { display: flex; align-items: center; gap: var(--space-2); padding: 4px var(--space-2); border-radius: var(--radius-sm); }
.checklist__item:hover { background-color: var(--color-hover); }
.checklist__item .checkbox { flex: 1; min-width: 0; font-size: var(--fs-sm); }
.checklist__tools { display: flex; gap: 2px; opacity: 0; transition: opacity var(--dur-fast) var(--ease-out); }
.checklist__item:hover .checklist__tools, .checklist__item:focus-within .checklist__tools { opacity: 1; }
.inline-add { display: flex; gap: var(--space-2); }

.hours-hero { display: grid; gap: var(--space-3); padding: var(--space-4); background-color: var(--glass-bg-tint-blue); }

/* Plateforme de suivi - Lamia — Maquette · thème appliqué avant le premier rendu

 *     memeowAnimation: 'idle'|'sleep'|'lick'|'hungry'|'meow',

 *   LamiaVoice.phrases   -> données brutes (réutilisées telles quelles en phase 2)
 *

 * Fichier en UTF-8 : la page qui le charge doit déclarer <meta charset="utf-8">.
 * Mémoire locale (facultative, try/catch partout) : « lamiaVoice.last » (dernières répliques,

 *

 *   {n}            le nombre du contexte (échéances, retards, tâches terminées, jours d'absence)
 *   {s}            « s » si n > 1, rien sinon
 *   {sing|plur}    forme du singulier si n <= 1, du pluriel sinon (ex. « {a|ont} »)

  /* ------------------------------------------------------------------ */
  /* Répliques de Memeow : uniquement des « meew » + icône + animation     */
  /* ------------------------------------------------------------------ */
  function m(text, icon, animation) {
    return { text: text, icon: icon, animation: animation };
  }

  var memeow = {
    general: [
      m("Meew !", "heart", "idle"),

    dimanche: [

    ],
    echeances: [

    ],
    humeurHaute: [

  /* Animations de Lamia par catégorie (tirage au sort dans la liste) */
  var lamiaAnimations = {
    general: ["idle", "typing", "wave", "idle"],
    matin: ["wave", "typing"],
    midi: ["idle", "wave"],
    apresMidi: ["typing", "idle"],
    soir: ["idle", "wave"],
    nuit: ["idle"],
    lundi: ["typing", "wave"],
    vendredi: ["cheer", "wave"],
    samedi: ["typing", "cheer"],
    dimanche: ["idle"],
    echeances: ["typing"],
    retards: ["idle", "typing"],
    humeurBasse: ["idle"],
    humeurHaute: ["cheer", "wave"],
    termine: ["cheer"],
    objectif: ["cheer"],
    premiereConnexion: ["wave"],
    retour: ["wave"]
  };

  /* ------------------------------------------------------------------ */
  /* Stockage : toute lecture/écriture est protégée (stockage indisponible) */
  /* ------------------------------------------------------------------ */
  var memory = {};

  function readStore(key) {
    var value = null;
    try {
      var store = root.localStorage;
      if (store) value = store.getItem(key);
    } catch (e) {
      value = null;
    }
    if (value == null && Object.prototype.hasOwnProperty.call(memory, key)) value = memory[key];
    return value;
  }

  function writeStore(key, value) {
    memory[key] = value;
    try {
      var store = root.localStorage;
      if (store) store.setItem(key, value);
    } catch (e) {
      /* stockage plein, désactivé ou interdit : la mémoire de session suffit */
    }
  }

  function readJSON(key) {
    try {
      var raw = readStore(key);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  /* ------------------------------------------------------------------ */
  /* Outils                                                               */
  /* ------------------------------------------------------------------ */
  function rand() {
    return Math.random();
  }

  function sample(list) {
    return list[Math.floor(rand() * list.length)];
  }

  function count(v) {
    v = Number(v);
    return isFinite(v) && v > 0 ? Math.floor(v) : 0;
  }

  function hours(v) {
    v = Number(v);
    return isFinite(v) && v > 0 ? v : 0;
  }

  function moodLevel(v) {
    if (v === null || v === undefined || v === '') return null;
    v = Number(v);
    return isFinite(v) && v >= 1 && v <= 5 ? Math.round(v) : null;
  }

  function toDate(d) {
    if (d && typeof d.getTime === 'function') d = new Date(d.getTime());
    else if (typeof d === 'string' || typeof d === 'number') d = new Date(d);
    else d = new Date();
    return isNaN(d.getTime()) ? new Date() : d;
  }

  function pad(x) {
    return (x < 10 ? '0' : '') + x;
  }

  function isoDay(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function dayNumber(iso) {
    var match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''));
    if (!match) return null;
    return Math.round(Date.UTC(+match[1], +match[2] - 1, +match[3]) / 86400000);
  }

  function slotOf(d) {
    var minutes = d.getHours() * 60 + d.getMinutes();
    if (minutes < 5 * 60 || minutes >= 22 * 60) return 'nuit';
    if (minutes < 11 * 60 + 30) return 'matin';
    if (minutes < 14 * 60) return 'midi';
    if (minutes < 18 * 60) return 'apresMidi';
    return 'soir';
  }

  // Remplace {n}, {s} et {singulier|pluriel}
  function fill(template, n) {
    var plural = n > 1;
    return template
      .replace(/\{n\}/g, String(n))
      .replace(/\{s\}/g, plural ? 's' : '')
      .replace(/\{([^{}|]*)\|([^{}|]*)\}/g, function (all, singular, pluralForm) {
        return plural ? pluralForm : singular;
      });
  }

  // Typographie française : apostrophe courbe et espaces insécables
  function typo(text) {
    return text
      .replace(/'/g, '’')
      .replace(/\.\.\./g, '…')
      .replace(/ ([!?:;»%])/g, ' $1')
      .replace(/« /g, '« ')
      .replace(/(\d) (h|heures|jours)(?![a-zà-ÿ])/g, '$1 $2');
  }

  /* ------------------------------------------------------------------ */
  /* Contexte et règles                                                   */
  /* ------------------------------------------------------------------ */
  function normalize(context) {
    var ctx = context || {};
    var date = toDate(ctx.date);
    var today = dayNumber(isoDay(date));
    var away = 0;

    if (ctx.daysAway !== undefined && ctx.daysAway !== null && isFinite(Number(ctx.daysAway))) {
      away = count(ctx.daysAway);
    } else {
      var last = dayNumber(readStore(KEY_VISIT));
      if (last !== null && today > last) away = today - last;
    }

    return {
      date: date,
      iso: isoDay(date),
      today: today,
      day: date.getDay(), // 0 = dimanche … 6 = samedi
      slot: slotOf(date),
      dueThisWeek: count(ctx.dueThisWeek),
      overdue: count(ctx.overdue),
      doneToday: count(ctx.doneToday),
      doneThisWeek: count(ctx.doneThisWeek),
      hoursFlowlineWeek: hours(ctx.hoursFlowlineWeek),
      moodYesterday: moodLevel(ctx.moodYesterday),
      moodToday: moodLevel(ctx.moodToday),
      firstLoginToday: ctx.firstLoginToday === true,
      daysAway: away
    };
  }

  // Règles éligibles, avec un poids. Une règle « exclusive » passe avant tout le reste.
  function rules(c) {
    var list = [];
    var sunday = c.day === 0;
    var saturday = c.day === 6;
    var late = c.slot === 'soir' || c.slot === 'nuit';

    function add(category, weight, n, sources) {
      list.push({ category: category, weight: weight, n: n || 0, sources: sources || [category] });
    }

    // 1. Exclusif : humeur basse (aujourd'hui si notée, sinon hier) -> douceur avant tout
    var lowToday = c.moodToday !== null && c.moodToday <= 2;
    var lowYesterday = c.moodToday === null && c.moodYesterday !== null && c.moodYesterday <= 2;
    if (lowToday || lowYesterday) {
      add('humeurBasse', 1, 0, lowYesterday ? ['humeurBasse', 'humeurBasseHier'] : ['humeurBasse']);
      return list;
    }

    // 2. Exclusif : retour après plusieurs jours d'absence
    if (c.daysAway >= AWAY_THRESHOLD) {
      add('retour', 1, c.daysAway);
      return list;
    }

    // 3. Règles pondérées (les contextuelles pèsent plus que le fond général)
    if (c.hoursFlowlineWeek >= 35) add('objectif', 6);
    if (c.doneToday > 0) add('termine', 5, c.doneToday);

    var highToday = c.moodToday !== null && c.moodToday >= 4;
    var highYesterday = c.moodToday === null && c.moodYesterday !== null && c.moodYesterday >= 4;
    if (highToday) add('humeurHaute', 4);
    else if (highYesterday) add('humeurHaute', 2);

    if (sunday) add('dimanche', 8);
    if (saturday) add('samedi', 5);
    if (c.day === 1 && !late) add('lundi', 4);
    if (c.day === 5) add('vendredi', 4, c.doneThisWeek);

    // Le soir, la nuit et le dimanche, on ne parle pas de charge de travail.
    if (c.overdue > 0 && !sunday && !late) add('retards', saturday ? 2 : 4, c.overdue);
    if (c.dueThisWeek > 0 && !sunday && !late) add('echeances', saturday ? 1 : 3, c.dueThisWeek);

    if (c.firstLoginToday && c.slot !== 'nuit') add('premiereConnexion', 3);

    if (c.slot === 'nuit') add('nuit', 5);
    else if (c.slot === 'soir') add('soir', 3);
    else if (c.slot === 'midi') add('midi', 4);
    else if (!sunday && c.slot === 'matin') add('matin', 2);
    else if (!sunday && c.slot === 'apresMidi') add('apresMidi', 1);

    add('general', sunday ? 1 : 2);
    return list;
  }

  function weightedPick(list) {
    var total = 0;
    var i;
    for (i = 0; i < list.length; i++) total += list[i].weight;
    var r = rand() * total;
    for (i = 0; i < list.length; i++) {
      r -= list[i].weight;
      if (r < 0) return list[i];
    }
    return list[list.length - 1];
  }

  // Tire un élément en évitant la dernière valeur affichée quand c'est possible
  function pickAvoiding(pool, lastKey, keyOf) {
    var fresh = pool.filter(function (item) {
      return keyOf(item) !== lastKey;
    });
    return sample(fresh.length ? fresh : pool);
  }

  function lamiaPool(rule) {
    var pool = [];
    rule.sources.forEach(function (name) {
      (lamia[name] || []).forEach(function (template) {
        if (rule.n > 0 || template.indexOf('{n}') === -1) pool.push(template);
      });
    });
    return pool;
  }

  function memeowCategory(rule, c) {
    if (c.slot === 'nuit') return 'nuit';
    if (rule.category === 'humeurBasse' || rule.category === 'retour' || rule.category === 'objectif') {
      return rule.category;
    }
    if (c.day === 0 && rand() < 0.7) return 'dimanche';
    if (c.slot === 'midi' && rand() < 0.6) return 'midi';
    if (c.slot === 'soir' && rand() < 0.4) return 'soir';
    return memeow[rule.category] ? rule.category : 'general';
  }

  /* ------------------------------------------------------------------ */
  /* API publique                                                         */
  /* ------------------------------------------------------------------ */
  function pick(context) {
    var c = normalize(context);
    var last = readJSON(KEY_LAST) || {};

    var rule = weightedPick(rules(c));
    var pool = lamiaPool(rule);
    if (!pool.length) {
      rule = { category: 'general', weight: 1, n: 0, sources: ['general'] };
      pool = lamia.general.slice();
    }
    var template = pickAvoiding(pool, last.lamia, function (t) { return t; });

    var cat = memeowCategory(rule, c);
    var cat2 = memeow[cat] ? cat : 'general';
    var reply = pickAvoiding(memeow[cat2], last.memeow, function (r) { return r.text; });

    var anims = c.slot === 'nuit' ? ['idle'] : (lamiaAnimations[rule.category] || lamiaAnimations.general);

    writeStore(KEY_LAST, JSON.stringify({ lamia: template, memeow: reply.text }));
    var lastVisit = dayNumber(readStore(KEY_VISIT));
    if (lastVisit === null || c.today > lastVisit) writeStore(KEY_VISIT, c.iso);

    return {
      lamia: typo(fill(template, rule.n)),
      memeow: { text: typo(reply.text), icon: reply.icon },
      memeowAnimation: reply.animation,
      lamiaAnimation: sample(anims)
    };
  }

  root.LamiaVoice = {
    version: '1.0.0',
    pick: pick,
    phrases: {
      lamia: lamia,
      memeow: memeow,
      lamiaAnimations: lamiaAnimations,
      maxLength: MAX_LENGTH,
      icons: ['heart', 'fish', 'zzz', 'kibble', 'star', 'note'],
      memeowAnimations: ['idle', 'sleep', 'lick', 'hungry', 'meow']
    },
    // Hors contrat, pour la recette : règles retenues pour un contexte (sans effet de bord)
    eligible: function (context) {
      return rules(normalize(context)).map(function (r) {
        return { category: r.category, weight: r.weight, n: r.n };
      });
    }
  };
})(typeof window !== 'undefined' ? window : this);

  var TRANSPARENT = '.';
  var ERASE = '_';
  var VERSION = '1.0.0';

  function fail(msg) { throw new Error('PixelCast : ' + msg); }

  function parseColor(hex, where) {
    var m = /^#([0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/i.exec(String(hex).trim());
    if (!m) fail('couleur invalide « ' + hex + ' » (' + where + ')');
    var h = m[1];
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    return [
      parseInt(h.slice(0, 2), 16),
      parseInt(h.slice(2, 4), 16),
      parseInt(h.slice(4, 6), 16),
      h.length === 8 ? parseInt(h.slice(6, 8), 16) : 255
    ];
  }

  function compilePalette(pal, where) {
    var out = {};
    for (var ch in pal) {
      if (!Object.prototype.hasOwnProperty.call(pal, ch)) continue;
      if (ch.length !== 1 || ch === TRANSPARENT || ch === ERASE) {
        fail('clé de palette invalide « ' + ch + ' » (' + where + ') : un seul caractère, ni « . » ni « _ »');
      }
      out[ch] = parseColor(pal[ch], where + ', « ' + ch + ' »');
    }
    return out;
  }

  // Peint une grille dans un tampon RGBA (alpha « source-over »).
  function paint(buf, w, h, rows, pal, x0, y0, where) {
    for (var r = 0; r < rows.length; r++) {
      var row = rows[r];
      var y = y0 + r;
      if (y < 0 || y >= h) continue;
      for (var c = 0; c < row.length; c++) {
        var ch = row.charAt(c);
        if (ch === TRANSPARENT) continue;
        var x = x0 + c;
        if (x < 0 || x >= w) continue;
        var i = (y * w + x) * 4;
        if (ch === ERASE) { buf[i] = buf[i + 1] = buf[i + 2] = buf[i + 3] = 0; continue; }
        var col = pal[ch];
        if (!col) fail('caractère « ' + ch + ' » absent de la palette (' + where + ', ligne ' + r + ', colonne ' + c + ')');
        var sa = col[3] / 255;
        if (sa >= 1) { buf[i] = col[0]; buf[i + 1] = col[1]; buf[i + 2] = col[2]; buf[i + 3] = 255; continue; }
        var da = buf[i + 3] / 255;
        var oa = sa + da * (1 - sa);
        if (oa <= 0) continue;
        buf[i] = Math.round((col[0] * sa + buf[i] * da * (1 - sa)) / oa);
        buf[i + 1] = Math.round((col[1] * sa + buf[i + 1] * da * (1 - sa)) / oa);
        buf[i + 2] = Math.round((col[2] * sa + buf[i + 2] * da * (1 - sa)) / oa);
        buf[i + 3] = Math.round(oa * 255);
      }
    }
  }

  // 'hairBack@0,1' -> { name: 'hairBack', dx: 0, dy: 1 }
  function parseLayers(spec) {
    return String(spec).trim().split(/\s+/).map(function (tok) {
      var m = /^([A-Za-z0-9_-]+)(?:@(-?\d+),(-?\d+))?$/.exec(tok);
      if (!m) fail('calque mal écrit « ' + tok + ' » (attendu : nom ou nom@dx,dy)');
      return { name: m[1], dx: m[2] ? +m[2] : 0, dy: m[3] ? +m[3] : 0 };
    });
  }

  var compiled = {};

  function compileCharacter(id) {
    if (compiled[id]) return compiled[id];
    var def = CAST[id];
    if (!def) fail('personnage inconnu « ' + id + ' » (attendus : ' + Object.keys(CAST).join(', ') + ')');
    var pal = compilePalette(def.palette, id);
    var anims = {};
    Object.keys(def.animations).forEach(function (name) {
      var a = def.animations[name];
      if (!a.frames || !a.frames.length) fail(id + '.' + name + ' : aucune image');
      var frames = a.frames.map(function (f, n) {
        var where = id + '.' + name + '[' + n + ']';
        var ms = Math.max(16, Math.round(+f[0] || 0));
        var buf = new Uint8ClampedArray(def.width * def.height * 4);
        parseLayers(f[1]).forEach(function (l) {
          var part = def.parts[l.name];
          if (!part) fail('calque inconnu « ' + l.name + ' » (' + where + ')');
          paint(buf, def.width, def.height, part.rows, pal, (part.x || 0) + l.dx, (part.y || 0) + l.dy, id + '.' + l.name);
        });
        return { duration: ms, data: buf };
      });
      var clamp = function (v) { v = v | 0; return v >= 0 && v < frames.length ? v : -1; };
      anims[name] = {
        name: name,
        loop: !!a.loop,
        next: a.next || 'idle',
        repeat: Math.max(1, a.repeat | 0),
        still: Math.max(0, clamp(a.still)),
        blink: a.blink == null ? -1 : clamp(a.blink),
        frames: frames
      };
    });
    compiled[id] = { id: id, width: def.width, height: def.height, animations: anims, canvases: {} };
    return compiled[id];
  }

  var compiledIcons = {};
  function compileIcon(name) {
    if (compiledIcons[name]) return compiledIcons[name];
    var def = ICONS.sprites[name];
    if (!def) fail('icône inconnue « ' + name + ' » (attendues : ' + Object.keys(ICONS.sprites).join(', ') + ')');
    var palDef = {}, k;
    for (k in ICONS.palette) palDef[k] = ICONS.palette[k];
    if (def.palette) for (k in def.palette) palDef[k] = def.palette[k];
    var n = ICONS.size;
    var buf = new Uint8ClampedArray(n * n * 4);
    paint(buf, n, n, def.rows, compilePalette(palDef, 'icône ' + name), 0, 0, 'icône ' + name);
    compiledIcons[name] = { width: n, height: n, data: buf };
    return compiledIcons[name];
  }

  /* ---------- Rendu canvas ---------- */

  function hasDOM() { return typeof document !== 'undefined' && document.createElement; }

  function bufferToCanvas(w, h, data) {
    var cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    var ctx = cv.getContext('2d');
    var img = ctx.createImageData(w, h);
    img.data.set(data);
    ctx.putImageData(img, 0, 0);
    return cv;
  }

  function frameCanvas(ch, anim, index) {
    var key = anim + '#' + index;
    if (!ch.canvases[key]) {
      ch.canvases[key] = bufferToCanvas(ch.width, ch.height, ch.animations[anim].frames[index].data);
    }
    return ch.canvases[key];
  }

  /* ---------- Liseré (mode sombre) ----------
     Si la variable CSS --pixel-cast-rim vaut une couleur sur le canvas (ou un parent),
     un contour d'un pixel « art » de cette couleur entoure la silhouette : les cheveux
     noirs de Lamia et le pelage noir de Memeow restent lisibles sur un fond sombre.
     pixel-bubble.css l'active en mode sombre ; transparent = pas de liseré. */
  var cssColors = {};
  function cssColor(str) {
    if (cssColors[str]) return cssColors[str];
    var cv = document.createElement('canvas');
    cv.width = cv.height = 1;
    var c = cv.getContext('2d');
    c.fillStyle = 'rgba(0, 0, 0, 0)';
    c.fillStyle = str;
    c.fillRect(0, 0, 1, 1);
    var d = c.getImageData(0, 0, 1, 1).data;
    cssColors[str] = [d[0], d[1], d[2], d[3]];
    return cssColors[str];
  }
  function readRim(el) {
    if (!root.getComputedStyle) return null;
    var v = root.getComputedStyle(el).getPropertyValue('--pixel-cast-rim').trim();
    if (!v || v === 'transparent' || v === 'none') return null;
    var c = cssColor(v);
    return c[3] ? c : null;
  }
  function rimCanvas(ch, anim, index, rgba) {
    var key = anim + '#' + index + '#rim' + rgba.join(',');
    if (ch.canvases[key]) return ch.canvases[key];
    var w = ch.width, h = ch.height, src = ch.animations[anim].frames[index].data;
    var out = new Uint8ClampedArray(src.length);
    var solid = function (x, y) { return x >= 0 && y >= 0 && x < w && y < h && src[(y * w + x) * 4 + 3] >= 160; };
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
      var i = (y * w + x) * 4;
      if (src[i + 3] < 160 && (solid(x - 1, y) || solid(x + 1, y) || solid(x, y - 1) || solid(x, y + 1))) {
        out[i] = rgba[0]; out[i + 1] = rgba[1]; out[i + 2] = rgba[2]; out[i + 3] = rgba[3];
      }
      var sa = src[i + 3] / 255;
      if (sa > 0) {
        var da = out[i + 3] / 255, oa = sa + da * (1 - sa);
        for (var k = 0; k < 3; k++) out[i + k] = Math.round((src[i + k] * sa + out[i + k] * da * (1 - sa)) / oa);
        out[i + 3] = Math.round(oa * 255);
      }
    }
    ch.canvases[key] = bufferToCanvas(w, h, out);
    return ch.canvases[key];
  }

  // Redessine toutes les instances quand le thème change (data-theme ou thème système).
  var live = [];
  var themeWatch = null;
  function watchTheme(redraw) {
    live.push(redraw);
    if (themeWatch) return;
    var all = function () { live.slice().forEach(function (fn) { fn(); }); };
    var mo = typeof MutationObserver === 'function' ? new MutationObserver(all) : null;
    if (mo) mo.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class', 'style'] });
    var off = listen(mediaQuery('(prefers-color-scheme: dark)'), all);
    themeWatch = function () { if (mo) mo.disconnect(); off(); };
  }
  function unwatchTheme(redraw) {
    var i = live.indexOf(redraw);
    if (i >= 0) live.splice(i, 1);
    if (!live.length && themeWatch) { themeWatch(); themeWatch = null; }
  }

  function toScale(v, def) {
    var n = Math.round(+v);
    return isFinite(n) && n >= 1 ? Math.min(n, 64) : def;
  }

  function setPixelated(el) {
    el.style.imageRendering = 'pixelated';
    if (el.style.imageRendering !== 'pixelated') el.style.imageRendering = 'crisp-edges';
  }

  function mediaQuery(q) {

    // Répartit des minutes entre 1 à 3 tâches actives, par blocs de 15 min
    var pool = tasks.slice().sort(function () { return rand() - 0.5; }).slice(0, Math.min(tasks.length, 1 + Math.floor(rand() * 3)));
    var weights = pool.map(function (t) { return { urgent: 4, high: 3, normal: 2, low: 1 }[t.priority] + rand(); });

  function buildMoods() {

  L.seed = function () {
    var tasks = buildTasks();

    return {
      version: 1,
      categories: CATEGORIES.map(function (c) { return Object.assign({}, c); }),
      tasks: tasks,
      moods: buildMoods(),

        theme: 'system',
        schedules: {
          flowline: { days: [1, 2, 3, 4, 5], weeklyHours: 35 },

      timer: { taskId: 't03', startedAt: Date.now() - (72 * 60 + 18) * 1000, accumulatedMs: 0, pausedAt: null },
      lastTimerTaskId: 't03',
