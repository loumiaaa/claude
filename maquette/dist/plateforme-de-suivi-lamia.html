  <script  data-source="js/store.js">
/* ==========================================================================
   Plateforme de suivi - Lamia — Maquette · état et requêtes
   - L.store : état en mémoire + persistance FACULTATIVE dans localStorage
     (toute lecture / écriture est protégée par try/catch).
   - L.q     : requêtes en lecture seule (heures, échéances, récap…).
   En phase 2, l'état vit dans Donnees-Lamia/data.json (cf. docs/04) ;
   les actions et requêtes ci-dessous se transposent en stores Svelte.
   ========================================================================== */
(function (L) {
  'use strict';

  var D = L.dates;
  var KEY = 'lamia.maquette.v1';
  var state = null;
  var listeners = [];
  var saveTimer = null;

  /* --- Persistance ------------------------------------------------------- */
  function readSaved() {
    try {
      var raw = window.localStorage && window.localStorage.getItem(KEY);
      if (!raw) return null;
      var s = JSON.parse(raw);
      return s && s.version === 1 && Array.isArray(s.tasks) ? s : null;
    } catch (e) { return null; }
  }

  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      saveTimer = null;
      try { if (window.localStorage) window.localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* stockage indisponible : la démo reste en mémoire */ }
    }, 150);
  }

  // Écriture immédiate à la fermeture de la page (le délai de 150 ms ne doit rien perdre)
  function flush() {
    if (!saveTimer || !state) return;
    clearTimeout(saveTimer);
    saveTimer = null;
    try { if (window.localStorage) window.localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* rien */ }
  }
  window.addEventListener('pagehide', flush);

  function clearSaved() {
    try { if (window.localStorage) window.localStorage.removeItem(KEY); } catch (e) { /* rien */ }
  }

  function emit(type, detail) {
    save();
    listeners.slice().forEach(function (fn) {
      try { fn(type, detail || {}); } catch (e) { if (window.console) console.error(e); }
    });
  }

  function uid(prefix) {
    return (prefix || 'id') + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function task(id) {
    for (var i = 0; i < state.tasks.length; i++) if (state.tasks[i].id === id) return state.tasks[i];
    return null;
  }

  function cat(id) {
    for (var i = 0; i < state.categories.length; i++) if (state.categories[i].id === id) return state.categories[i];
    return state.categories[0];
  }

  function touch(t) { t.updatedAt = D.today(); }

  function column(status) {
    return state.tasks.filter(function (t) { return t.status === status; }).sort(function (a, b) { return a.order - b.order; });
  }

  function renumber(status) {
    column(status).forEach(function (t, i) { t.order = i; });
  }

  function timerElapsed(tm) {
    tm = tm || state.timer;
    if (!tm) return 0;
    return tm.accumulatedMs + (tm.pausedAt ? 0 : Date.now() - tm.startedAt);
  }

  /* --- Actions ----------------------------------------------------------- */
  var store = {
    KEY: KEY,
    init: function () {
      state = readSaved() || L.seed();
      // Champs ajoutés au fil des versions de la maquette
      state.flags = state.flags || {};
      state.settings.ui = Object.assign(L.seed().settings.ui, state.settings.ui || {});
      return state;
    },
    get: function () { return state; },
    subscribe: function (fn) { listeners.push(fn); return function () { listeners = listeners.filter(function (f) { return f !== fn; }); }; },
    emit: emit,
    uid: uid,
    task: task,
    category: cat,
    column: column,
    timerElapsed: timerElapsed,

    reset: function () {
      clearSaved();
      state = L.seed();
      state.flags.lastOpenedOn = D.today();
      emit('reset');
    },

    // Import d'une sauvegarde .json (même format que l'export)
    replace: function (data) {
      if (!data || data.version !== 1 || !Array.isArray(data.tasks) || !Array.isArray(data.categories)) return false;
      state = data;
      state.flags = state.flags || {};
      state.settings.ui = Object.assign(L.seed().settings.ui, state.settings.ui || {});
      emit('reset');
      return true;
    },

    setFlag: function (k, v) { state.flags[k] = v; save(); },
    setUI: function (patch) { Object.assign(state.settings.ui, patch); emit('ui', patch); },
    setSettings: function (patch) { Object.assign(state.settings, patch); emit('settings', patch); },
    setSchedule: function (group, patch) { Object.assign(state.settings.schedules[group], patch); emit('settings'); },

    /* Tâches */
    createTask: function (data) {
      var status = data.status || 'todo';
      column(status).forEach(function (t) { t.order += 1; });
      var t = {
        id: uid('t'), title: data.title.trim(), description: data.description || '',
        categoryId: data.categoryId || state.categories[0].id, client: data.client || '',
        status: status, progress: status === 'done' ? 100 : 0, priority: data.priority || 'normal',
        tags: data.tags || [], startDate: data.startDate || (data.endDate ? D.today() : null), endDate: data.endDate || null,
        checklist: [], timeEntries: [], reminder: null,
        createdAt: D.today(), updatedAt: D.today(), completedAt: status === 'done' ? D.today() : null, order: 0
      };
      if (t.startDate && t.endDate && t.startDate > t.endDate) t.startDate = t.endDate;
      state.tasks.push(t);
      emit('task:create', { id: t.id });
      return t;
    },

    updateTask: function (id, patch, opts) {
      var t = task(id);
      if (!t) return null;
      var prevStatus = t.status;
      Object.assign(t, patch);
      if (patch.status && patch.status !== prevStatus) {
        t.completedAt = patch.status === 'done' ? D.today() : null;
        column(patch.status).forEach(function (x) { if (x !== t) x.order += 1; });
        t.order = -1;
        renumber(patch.status); renumber(prevStatus);
      }
      touch(t);
      if (!(opts && opts.silent)) emit('task:update', { id: id, patch: patch, prevStatus: prevStatus });
      return t;
    },

    // Glisser-déposer et « Déplacer vers… » : statut + position dans la colonne
    moveTask: function (id, status, index) {
      var t = task(id);
      if (!t) return null;
      var prevStatus = t.status;
      var list = column(status).filter(function (x) { return x !== t; });
      index = Math.max(0, Math.min(index == null ? list.length : index, list.length));
      list.splice(index, 0, t);
      list.forEach(function (x, i) { x.order = i; });
      t.status = status;
      if (status !== prevStatus) {
        t.completedAt = status === 'done' ? D.today() : null;
        renumber(prevStatus);
      }
      touch(t);
      emit('task:move', { id: id, status: status, prevStatus: prevStatus, index: index });
      return t;
    },

    deleteTask: function (id) {
      var i = state.tasks.indexOf(task(id));
      if (i < 0) return null;
      var removed = state.tasks.splice(i, 1)[0];
      var wasTimer = state.timer && state.timer.taskId === id ? state.timer : null;
      if (wasTimer) state.timer = null;
      renumber(removed.status);
      emit('task:delete', { id: id });
      return { task: removed, index: i, timer: wasTimer };
    },

    restoreTask: function (snap) {
      state.tasks.splice(Math.min(snap.index, state.tasks.length), 0, snap.task);
      column(snap.task.status).forEach(function (x) { if (x !== snap.task && x.order >= snap.task.order) x.order += 1; });
      renumber(snap.task.status);
      if (snap.timer && !state.timer) state.timer = snap.timer;
      emit('task:create', { id: snap.task.id });
    },

    /* Checklist */
    addCheck: function (id, label) {
      var t = task(id); if (!t || !label.trim()) return;
      t.checklist.push({ id: uid('c'), label: label.trim(), done: false }); touch(t);
      emit('task:update', { id: id, part: 'checklist' });
    },
    toggleCheck: function (id, cid, done) {
      var t = task(id); if (!t) return;
      t.checklist.forEach(function (c) { if (c.id === cid) c.done = done; }); touch(t);
      emit('task:update', { id: id, part: 'checklist' });
    },
    removeCheck: function (id, cid) {
      var t = task(id); if (!t) return;
      t.checklist = t.checklist.filter(function (c) { return c.id !== cid; }); touch(t);
      emit('task:update', { id: id, part: 'checklist' });
    },
    moveCheck: function (id, cid, delta) {
      var t = task(id); if (!t) return;
      var i = t.checklist.findIndex(function (c) { return c.id === cid; });
      var j = i + delta;
      if (i < 0 || j < 0 || j >= t.checklist.length) return;
      var item = t.checklist.splice(i, 1)[0];
      t.checklist.splice(j, 0, item); touch(t);
      emit('task:update', { id: id, part: 'checklist' });
    },

    /* Heures */
    addEntry: function (id, entry) {
      var t = task(id); if (!t) return null;
      var e = { id: uid('e'), date: entry.date || D.today(), minutes: Math.round(entry.minutes), note: entry.note || '', source: entry.source || 'manual' };
      t.timeEntries.push(e); touch(t);
      emit('task:update', { id: id, part: 'hours' });
      return e;
    },
    updateEntry: function (id, eid, patch) {
      var t = task(id); if (!t) return;
      t.timeEntries.forEach(function (e) { if (e.id === eid) Object.assign(e, patch); }); touch(t);
      emit('task:update', { id: id, part: 'hours' });
    },
    removeEntry: function (id, eid) {
      var t = task(id); if (!t) return null;
      var i = t.timeEntries.findIndex(function (e) { return e.id === eid; });
      var e = i >= 0 ? t.timeEntries.splice(i, 1)[0] : null; touch(t);
      emit('task:update', { id: id, part: 'hours' });
      return e ? { entry: e, index: i } : null;
    },
    restoreEntry: function (id, snap) {
      var t = task(id); if (!t || !snap) return;
      t.timeEntries.splice(snap.index, 0, snap.entry);
      emit('task:update', { id: id, part: 'hours' });
    },

    /* Chrono : un seul actif ; il survit à la fermeture (persisté) */
    startTimer: function (id) {
      var stopped = null;
      if (state.timer && state.timer.taskId === id) {
        if (state.timer.pausedAt) store.resumeTimer();
        return { stopped: null };
      }
      if (state.timer) stopped = store.stopTimer({ silent: true });
      state.timer = { taskId: id, startedAt: Date.now(), accumulatedMs: 0, pausedAt: null };
      state.lastTimerTaskId = id;
      var t = task(id);
      if (t && t.status === 'todo') store.moveTask(id, 'doing', 0);
      emit('timer', { action: 'start', id: id, stopped: stopped });
      return { stopped: stopped };
    },
    pauseTimer: function () {
      var tm = state.timer; if (!tm || tm.pausedAt) return;
      tm.accumulatedMs += Date.now() - tm.startedAt;
      tm.pausedAt = Date.now();
      emit('timer', { action: 'pause' });
    },
    resumeTimer: function () {
      var tm = state.timer; if (!tm || !tm.pausedAt) return;
      tm.startedAt = Date.now();
      tm.pausedAt = null;
      emit('timer', { action: 'resume' });
    },
    // Arrête et enregistre une entrée « chrono ». minutesOverride : correction (> 10 h)
    stopTimer: function (opts) {
      var tm = state.timer; if (!tm) return null;
      var minutes = opts && opts.minutes != null ? opts.minutes : Math.max(1, Math.round(timerElapsed(tm) / 60000));
      state.timer = null;
      var entry = null;
      var t = task(tm.taskId);
      if (t && minutes > 0) {
        entry = { id: uid('e'), date: D.today(), minutes: minutes, note: '', source: 'timer' };
        t.timeEntries.push(entry); touch(t);
      }
      var res = { taskId: tm.taskId, minutes: minutes, entry: entry };
      if (!(opts && opts.silent)) emit('timer', { action: 'stop', result: res });
      return res;
    },

    /* Humeur */
    setMood: function (date, level, note) {
      var m = state.moods.filter(function (x) { return x.date === date; })[0];
      if (!m) { m = { date: date, level: level, note: note || '' }; state.moods.push(m); }
      else { m.level = level; if (note != null) m.note = note; }
      state.moods.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
      emit('mood', { date: date, level: level });
    },
    setMoodNote: function (date, note) {
      var m = state.moods.filter(function (x) { return x.date === date; })[0];
      if (m) { m.note = note; emit('mood', { date: date, note: true }); }
    },

    /* Catégories */
    addCategory: function (data) {
      var c = { id: uid('cat'), name: data.name || 'Nouvelle catégorie', color: data.color || 'blue', group: data.group || 'auto-entreprise' };
      state.categories.push(c);
      emit('category', { id: c.id });
      return c;
    },
    updateCategory: function (id, patch) {
      Object.assign(cat(id), patch);
      emit('category', { id: id });
    },
    removeCategory: function (id, reassignTo) {
      state.tasks.forEach(function (t) { if (t.categoryId === id) t.categoryId = reassignTo; });
      state.categories = state.categories.filter(function (c) { return c.id !== id; });
      emit('category', { id: id, removed: true });
    }
  };

  /* --- Requêtes ---------------------------------------------------------- */
  var PRIO_RANK = { urgent: 0, high: 1, normal: 2, low: 3 };
  var STATUS = [
    { id: 'todo', label: 'Pas commencé' },
    { id: 'doing', label: 'En cours' },
    { id: 'review', label: 'En validation' },
    { id: 'done', label: 'Terminé' }
  ];
  var PRIORITIES = [
    { id: 'low', label: 'Basse' }, { id: 'normal', label: 'Normale' },
    { id: 'high', label: 'Haute' }, { id: 'urgent', label: 'Urgente' }
  ];

  function label(list, id) { var x = list.filter(function (i) { return i.id === id; })[0]; return x ? x.label : id; }

  function isDone(t) { return t.status === 'done'; }
  function isOverdue(t, ref) { return !isDone(t) && !!t.endDate && t.endDate < (ref || D.today()); }

  // Minutes d'une tâche sur une plage (chrono en cours inclus si demandé)
  function taskMinutes(t, a, b, withTimer) {
    var m = 0;
    t.timeEntries.forEach(function (e) { if ((!a || e.date >= a) && (!b || e.date <= b)) m += e.minutes; });
    if (withTimer && state.timer && state.timer.taskId === t.id && (!a || D.today() >= a) && (!b || D.today() <= b)) {
      m += Math.floor(timerElapsed() / 60000);
    }
    return m;
  }

  // Heures par catégorie, SÉPARÉES (jamais de total général)
  function minutesByCategory(a, b, withTimer) {
    var out = {};
    state.categories.forEach(function (c) { out[c.id] = 0; });
    state.tasks.forEach(function (t) { if (out[t.categoryId] != null) out[t.categoryId] += taskMinutes(t, a, b, withTimer); });
    return out;
  }

  // Minutes par jour pour une catégorie : { 'YYYY-MM-DD': minutes }
  function dailyMinutes(catId, a, b, withTimer) {
    var out = {};
    D.eachDay(a, b).forEach(function (d) { out[d] = 0; });
    state.tasks.forEach(function (t) {
      if (t.categoryId !== catId) return;
      t.timeEntries.forEach(function (e) { if (out[e.date] != null) out[e.date] += e.minutes; });
      if (withTimer && state.timer && state.timer.taskId === t.id && out[D.today()] != null) out[D.today()] += Math.floor(timerElapsed() / 60000);
    });
    return out;
  }

  function goalFor(category) {
    var sch = state.settings.schedules[category.group];
    if (!sch || !sch.weeklyHours) return null;
    var days = sch.days.length || 5;
    return { weekly: sch.weeklyHours * 60, daily: Math.round(sch.weeklyHours * 60 / days), days: sch.days };
  }

  function mood(date) { return state.moods.filter(function (m) { return m.date === date; })[0] || null; }

  function overdue() {
    return state.tasks.filter(function (t) { return isOverdue(t); }).sort(function (a, b) { return a.endDate < b.endDate ? -1 : 1; });
  }

  function dueBetween(a, b) {
    return state.tasks.filter(function (t) { return !isDone(t) && t.endDate && t.endDate >= a && t.endDate <= b; })
      .sort(function (x, y) { return x.endDate < y.endDate ? -1 : x.endDate > y.endDate ? 1 : PRIO_RANK[x.priority] - PRIO_RANK[y.priority]; });
  }

  // Récap d'une période (jour / semaine / mois)
  function summary(p) {
    var today = D.today();
    var tasks = state.tasks;
    var created = tasks.filter(function (t) { return D.between(t.createdAt, p.start, p.end); });
    var done = tasks.filter(function (t) { return t.completedAt && D.between(t.completedAt, p.start, p.end); });
    // En cours : tâches « En cours » ou « En validation » déjà commencées à la fin de la période
    var ongoing = tasks.filter(function (t) {
      return (t.status === 'doing' || t.status === 'review') && (!t.startDate || t.startDate <= p.end);
    });
    var upcomingFrom = p.start > today ? p.start : today;
    var upcoming = p.end >= today ? dueBetween(upcomingFrom, p.end) : [];
    var replan = tasks.filter(function (t) { return isOverdue(t) && t.endDate <= p.end && t.endDate >= p.start; });
    // Taux de complétion : seulement les échéances déjà arrivées (on ne compte pas demain contre toi)
    var dueInPeriod = tasks.filter(function (t) { return t.endDate && D.between(t.endDate, p.start, p.end) && t.endDate <= today; });
    var dueDone = dueInPeriod.filter(isDone);
    return {
      created: created, done: done, ongoing: ongoing, upcoming: upcoming, replan: replan,
      allReplan: overdue(),
      due: dueInPeriod, dueDone: dueDone,
      rate: dueInPeriod.length ? Math.round(dueDone.length / dueInPeriod.length * 100) : null
    };
  }

  // Contexte pour LamiaVoice.pick (cahier des charges §8)
  function voiceContext() {
    var today = D.today();
    var w0 = D.startOfWeek(today), w1 = D.endOfWeek(today);
    var flow = state.categories.filter(function (c) { return c.group === 'flowline'; });
    var mins = minutesByCategory(w0, w1, true);
    var flowMin = 0;
    flow.forEach(function (c) { flowMin += mins[c.id] || 0; });   // groupe Flow Line uniquement
    var my = mood(D.addDays(today, -1)), mt = mood(today);
    return {
      date: D.now(),
      dueThisWeek: dueBetween(today, w1).length,
      overdue: overdue().length,
      doneToday: state.tasks.filter(function (t) { return t.completedAt === today; }).length,
      doneThisWeek: state.tasks.filter(function (t) { return t.completedAt && D.between(t.completedAt, w0, w1); }).length,
      hoursFlowlineWeek: Math.round(flowMin / 6) / 10,
      moodYesterday: my ? my.level : undefined,
      moodToday: mt ? mt.level : undefined,
      firstLoginToday: !!L.firstLoginToday,
      daysAway: 0
    };
  }

  function allTags() {
    var set = {};
    state.tasks.forEach(function (t) { t.tags.forEach(function (g) { set[g] = (set[g] || 0) + 1; }); });
    return Object.keys(set).sort(function (a, b) { return a.localeCompare(b, 'fr'); });
  }

  function allClients() {
    var set = {};
    state.tasks.forEach(function (t) { if (t.client) set[t.client] = 1; });
    return Object.keys(set).sort(function (a, b) { return a.localeCompare(b, 'fr'); });
  }

  // Filtres partagés Kanban / liste
  function filtered(f) {
    f = f || state.settings.ui.filters;
    var q = (f.q || '').trim().toLowerCase();
    var today = D.today();
    return state.tasks.filter(function (t) {
      if (f.categories && f.categories.length && f.categories.indexOf(t.categoryId) < 0) return false;
      if (f.priority && t.priority !== f.priority) return false;
      if (f.tag && t.tags.indexOf(f.tag) < 0) return false;
      if (f.client && t.client !== f.client) return false;
      if (f.status && t.status !== f.status) return false;
      if (f.due === 'week' && !(t.endDate && t.endDate >= today && t.endDate <= D.endOfWeek(today))) return false;
      if (f.due === 'month' && !(t.endDate && t.endDate >= today && t.endDate <= D.endOfMonth(today))) return false;
      if (f.due === 'late' && !isOverdue(t)) return false;
      if (f.due === 'none' && t.endDate) return false;
      if (q) {
        var hay = (t.title + ' ' + t.client + ' ' + t.description + ' ' + t.tags.join(' ') + ' ' + cat(t.categoryId).name).toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });
  }

  function activeFilterCount(f) {
    f = f || state.settings.ui.filters;
    return (f.q ? 1 : 0) + (f.categories && f.categories.length ? 1 : 0) + ['priority', 'tag', 'client', 'status', 'due'].filter(function (k) { return f[k]; }).length;
  }

  L.store = store;
  L.q = {
    STATUS: STATUS, PRIORITIES: PRIORITIES, PRIO_RANK: PRIO_RANK,
    statusLabel: function (id) { return label(STATUS, id); },
    prioLabel: function (id) { return label(PRIORITIES, id); },
    isDone: isDone, isOverdue: isOverdue, taskMinutes: taskMinutes, minutesByCategory: minutesByCategory,
    dailyMinutes: dailyMinutes, goalFor: goalFor, mood: mood, overdue: overdue, dueBetween: dueBetween,
    summary: summary, voiceContext: voiceContext, allTags: allTags, allClients: allClients,
    filtered: filtered, activeFilterCount: activeFilterCount
  };
})(window.Lamia = window.Lamia || {});

  <script  data-source="js/ui-common.js">

   - couches : modales et tiroir (focus piégé puis restitué, Échap, inert) ;

    });
  }

  function icon(name, opts) {
    return window.LamiaIcons ? window.LamiaIcons.svg(name, opts || {}) : '';

  function $(sel, root) { return (root || document).querySelector(sel); }

  /* --- Couleurs de catégories (tokens uniquement, cf. app.css .hue--*) --- */

    { id: 'flowline', label: 'Bleu Flow Line' },
    { id: 'carnet', label: 'Violet Carnet' },
    { id: 'auto', label: 'Aqua' },
    { id: 'blue', label: 'Bleu soutenu' },
    { id: 'violet', label: 'Violet soutenu' },
    { id: 'periwinkle', label: 'Pervenche' },
    { id: 'lilac', label: 'Lilas' },
    { id: 'mint', label: 'Menthe' },
    { id: 'lavender', label: 'Lavande grise' }
  ];
  var DA_CHIPS = { flowline: 'chip--flowline', carnet: 'chip--carnet', auto: 'chip--auto' };

  function hue(c) { return 'hue--' + (c ? c.color : 'flowline'); }

  function catChip(c, extra) {
    if (!c) return '';

  function prio(p, opts) {

  }

  // Échéance : ton doux, jamais alarmant (« à replanifier »)
  function due(t) {

    if (n <= 2) return { tone: 'soon', text: D.relative(t.endDate), long: 'Échéance ' + D.dayMonthLong(t.endDate) };
    if (n < 7) return { tone: 'week', text: D.relative(t.endDate), long: 'Échéance ' + D.dayMonthLong(t.endDate) };
    return { tone: 'normal', text: D.dayMonth(t.endDate), long: 'Échéance ' + D.dayMonthLong(t.endDate) };
  }

  function dueBadge(t) {
    var d = due(t);
    if (!d) return '';
    return '<span class="due due--' + d.tone + '" title="' + esc(d.long) + '">' + icon(d.tone === 'late' ? 'refresh' : 'calendar') +
      '<span>' + esc(d.text) + '</span><span class="sr-only">, ' + esc(d.long) + '</span></span>';
  }

  /* --- Icônes pixel (PixelCast) ------------------------------------------ */
  var pixelCache = {};
  var FALLBACK = { 'mood-1': 'mood', 'mood-2': 'mood', 'mood-3': 'mood', 'mood-4': 'mood', 'mood-5': 'mood', heart: 'heart', fish: 'sparkle', zzz: 'moon', kibble: 'coffee', star: 'sparkle', note: 'note' };

  }

  // <img> pixel net (les icônes font 16 × 16 « pixels art »)
  function pixelImg(name, scale, cls, alt) {
    var url = pixelURL(name, scale);
    var size = 16 * scale;
    if (!url) return '<span class="pixel-fallback ' + (cls || '') + '" style="--size:' + size + 'px" aria-hidden="' + (alt ? 'false' : 'true') + '">' + icon(FALLBACK[name] || 'sparkle', { title: alt || '' }) + '</span>';
    return '<img class="pixelated ' + (cls || '') + '" src="' + url + '" width="' + size + '" height="' + size + '" alt="' + esc(alt || '') + '">';
  }

  /* --- Humeur ------------------------------------------------------------ */
  var MOODS = [
    { level: 1, label: 'Au plus bas' },
    { level: 2, label: 'Bof' },
    { level: 3, label: 'Ça va' },
    { level: 4, label: 'Bien' },
    { level: 5, label: 'Au top' }
  ];
  function moodLabel(level) { return (MOODS[level - 1] || {}).label || ''; }

  /* --- Annonces (lecteur d'écran) ----------------------------------------- */
  function announce(text) {
    var el = document.getElementById('sr-live');
    if (!el) return;
    el.textContent = '';
    setTimeout(function () { el.textContent = text; }, 30);
  }

  /* --- Toasts ------------------------------------------------------------- */
  function toast(o) {
    var region = document.getElementById('toasts');
    if (!region) return null;
    var el = document.createElement('div');
    el.className = 'toast' + (o.kind ? ' toast--' + o.kind : '');
    el.setAttribute('role', o.kind === 'warning' ? 'alert' : 'status');
    var actions = (o.actions || []).map(function (a, i) {
      return '<button type="button" class="btn btn--soft btn--sm" data-toast-action="' + i + '">' + esc(a.label) + '</button>';
    }).join('');
    el.innerHTML = '<span class="toast__icon">' + icon(o.icon || (o.kind === 'success' ? 'check' : 'info')) + '</span>' +
      '<div class="toast__body"><div class="toast__title">' + esc(o.title) + '</div>' +
      (o.text ? '<div class="toast__text">' + esc(o.text) + '</div>' : '') +
      (actions ? '<div class="toast__actions">' + actions + '</div>' : '') + '</div>' +
      '<button type="button" class="btn btn--ghost btn--icon btn--sm" data-toast-close aria-label="Fermer la notification">' + icon('close') + '</button>';
    typo(el);

      el.classList.add('is-leaving');
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 180);
    }
    el.addEventListener('click', function (e) {
      var a = e.target.closest('[data-toast-action]');
      if (a) { var act = o.actions[+a.getAttribute('data-toast-action')]; close(); if (act && act.fn) act.fn(); return; }
      if (e.target.closest('[data-toast-close]')) close();
    });

    el.addEventListener('mouseenter', function () { clearTimeout(timer); });
    el.addEventListener('mouseleave', arm);
    el.addEventListener('focusin', function () { clearTimeout(timer); });
    region.appendChild(el);
    while (region.children.length > 4) region.removeChild(region.firstChild);
    arm();
    return { close: close, el: el };
  }

  /* --- Couches : modales et tiroir --------------------------------------- */
  var stack = [];
  var FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';

  function visible(el) { return !!(el.offsetWidth || el.offsetHeight || el.getClientRects().length); }
  function focusables(root) { return $$(FOCUSABLE, root).filter(visible); }

  function setInert() {

    $$('[data-inert-root]').forEach(function (el) { el.inert = stack.length > 0; });
    stack.forEach(function (layer) { layer.el.inert = layer !== top; });
  }

  function openLayer(overlay, opts) {
    opts = opts || {};

    var layer = { el: overlay, returnTo: opts.returnTo || document.activeElement, onClose: opts.onClose };
    stack.push(layer);
    overlay.hidden = false;
    document.documentElement.classList.add('has-layer');

    var i = -1;
    stack.forEach(function (l, k) { if (l.el === overlay) i = k; });
    if (i < 0) return;
    var layer = stack.splice(i, 1)[0];
    overlay.hidden = true;
    if (!stack.length) document.documentElement.classList.remove('has-layer');
    setInert();
    if (layer.onClose) layer.onClose(reason);
    var back = layer.returnTo;
    if (!back || back === document.body || back === document.documentElement) {
      // Ouverte au chargement (humeur du matin) : on rend le focus au titre de l'onglet
      var h = document.querySelector('.view:not([hidden]) h1');
      if (h) h.focus({ preventScroll: true });
    } else if (document.contains(back) && visible(back)) back.focus();
    else if (back && back.getAttribute && back.getAttribute('data-focus-key')) {

  document.addEventListener('keydown', function (e) {

    var top = topLayer();
    if (top && e.target === top.el) top.pendingBackdrop = true;
  });
  document.addEventListener('click', function (e) {
    var top = topLayer();
    if (top && e.target === top.el && top.pendingBackdrop) closeLayer(top.el, 'backdrop');
    if (top) top.pendingBackdrop = false;
  });

  /* --- Fenêtre de confirmation / saisie générique -------------------------- */
  function dialog(o) {
    var ov = document.getElementById('overlay-dialog');
    var body = o.body || (o.text ? '<p class="text-muted">' + esc(o.text) + '</p>' : '');
    ov.innerHTML =
      '<div class="modal modal--sm" role="dialog" aria-modal="true" aria-labelledby="dlg-title"' + (o.text ? ' aria-describedby="dlg-desc"' : '') + '>' +
        '<form class="dialog-form" novalidate>' +
          '<div class="modal__header"><div><h2 class="modal__title" id="dlg-title">' + esc(o.title) + '</h2>' +
            (o.desc ? '<p class="modal__desc">' + esc(o.desc) + '</p>' : '') + '</div>' +
            '<button type="button" class="btn btn--ghost btn--icon" data-dlg-cancel aria-label="Fermer">' + icon('close') + '</button></div>' +
          '<div class="modal__body" id="dlg-desc">' + body + '</div>' +
          '<div class="modal__footer">' +
            '<button type="button" class="btn btn--ghost" data-dlg-cancel>' + esc(o.cancelLabel || 'Annuler') + '</button>' +
            '<button type="submit" class="btn ' + (o.danger ? 'btn--danger' : 'btn--primary') + '">' + esc(o.confirmLabel || 'Valider') + '</button>' +
          '</div>' +
        '</form>' +
      '</div>';
    var form = ov.querySelector('form');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (o.onConfirm && o.onConfirm(form) === false) return;
      closeLayer(ov, 'confirm');

  <script  data-source="js/ui-charts.js">
/* ==========================================================================
   Plateforme de suivi - Lamia — Maquette · graphiques SVG faits main

   4 px côté donnée, carré côté base), ligne de 2 px, points ≥ 8 px cerclés

   couleurs de texte (jamais la couleur de la série), une infobulle au

  function tipRow(value, label, key) {

  /* --- Outils ------------------------------------------------------------- */
  function niceStep(maxMin) {

    });

    var cross = svg.querySelector('.chart__cross');
    var idx = n - 1;

    svg.addEventListener('blur', function () { cross.setAttribute('hidden', ''); hideTip(); });

      else if (e.key === 'ArrowRight') { e.preventDefault(); show(idx + 1); }

  <script  data-source="js/ui-chrono.js">
/* ==========================================================================
   Plateforme de suivi - Lamia — Maquette · chrono
   Widget toujours visible (barre latérale ; pastille au-dessus des onglets
   sur mobile). Un seul chrono actif : en lancer un autre arrête le premier,
   avec un message. Au-delà de 10 h, on propose de corriger la durée.
   ========================================================================== */
(function (L) {
  'use strict';

  var D = L.dates, S = L.store, U = L.ui;
  var esc = U.esc, icon = U.icon;
  var TEN_HOURS = 10 * 3600 * 1000;

  function elapsed() { return S.timerElapsed(); }

  function widgetHTML() {
    var st = S.get();
    var tm = st.timer;
    if (!tm || !S.task(tm.taskId)) {
      var last = st.lastTimerTaskId && S.task(st.lastTimerTaskId);
      return '<div class="chrono__head"><span class="chrono__icon">' + icon('timer') + '</span><span class="chrono__eyebrow">Chrono</span></div>' +
        '<p class="chrono__idle">Aucun chrono en cours. Une pause bien méritée ?</p>' +
        (last && last.status !== 'done'
          ? '<button type="button" class="btn btn--soft btn--sm btn--block chrono__resume" data-chrono="start" data-task="' + last.id + '">' + icon('play') + '<span class="chrono__resume-label">Reprendre « ' + esc(last.title) + ' »</span></button>'
          : '<a class="btn btn--soft btn--sm btn--block" href="#dashboard">' + icon('play') + 'Choisir une tâche</a>');
    }
    var t = S.task(tm.taskId);
    var c = S.category(t.categoryId);
    var paused = !!tm.pausedAt;
    return '<div class="chrono__head"><span class="chrono__live' + (paused ? ' is-paused' : '') + '" aria-hidden="true"></span>' +
        '<span class="chrono__eyebrow">' + (paused ? 'Chrono en pause' : 'Chrono en cours') + '</span></div>' +
      '<button type="button" class="chrono__task" data-open-task="' + t.id + '" title="Ouvrir le détail de la tâche">' + esc(t.title) + '</button>' +
      '<div class="chrono__meta">' + U.catDot(c) + '<span>' + esc(c.name) + (t.client ? ' · ' + esc(t.client) : '') + '</span></div>' +
      '<div class="chrono__time num" role="timer" aria-label="Temps écoulé" data-timer-elapsed>' + D.clock(elapsed()) + '</div>' +
      '<div class="chrono__actions">' +
        (paused
          ? '<button type="button" class="btn btn--soft btn--sm" data-chrono="resume">' + icon('play') + 'Reprendre</button>'
          : '<button type="button" class="btn btn--soft btn--sm" data-chrono="pause">' + icon('pause') + 'Pause</button>') +
        '<button type="button" class="btn btn--secondary btn--sm" data-chrono="stop">' + icon('stop') + 'Stop</button>' +
      '</div>';
  }

  function pillHTML() {
    var tm = S.get().timer;
    var t = tm && S.task(tm.taskId);
    if (!t) return '';
    var paused = !!tm.pausedAt;
    return '<span class="chrono__live' + (paused ? ' is-paused' : '') + '" aria-hidden="true"></span>' +
      '<button type="button" class="chrono-pill__task" data-open-task="' + t.id + '"><span class="sr-only">' + (paused ? 'Chrono en pause sur ' : 'Chrono en cours sur ') + '</span>' + esc(t.title) + '</button>' +
      '<span class="chrono-pill__time num" role="timer" aria-label="Temps écoulé" data-timer-elapsed>' + D.clock(elapsed()) + '</span>' +
      (paused
        ? '<button type="button" class="btn btn--soft btn--icon btn--sm" data-chrono="resume" aria-label="Reprendre le chrono">' + icon('play') + '</button>'
        : '<button type="button" class="btn btn--soft btn--icon btn--sm" data-chrono="pause" aria-label="Mettre le chrono en pause">' + icon('pause') + '</button>') +
      '<button type="button" class="btn btn--secondary btn--icon btn--sm" data-chrono="stop" aria-label="Arrêter le chrono et enregistrer">' + icon('stop') + '</button>';
  }

  function render() {
    U.$$('[data-chrono-widget]').forEach(function (el) {
      U.keepFocus(el, function () { el.innerHTML = widgetHTML(); });
    });
    var pill = U.$('[data-chrono-pill]');
    if (pill) {
      var html = pillHTML();
      pill.hidden = !html;
      document.documentElement.classList.toggle('has-chrono', !!html);
      U.keepFocus(pill, function () { pill.innerHTML = html; });
    }
  }

  // Met à jour le temps qui défile partout, sans re-rendu
  function tick() {
    var tm = S.get().timer;
    if (!tm) return;
    var txt = D.clock(elapsed());
    U.$$('[data-timer-elapsed]').forEach(function (el) { if (el.textContent !== txt) el.textContent = txt; });
  }

  function start(id) {
    var t = S.task(id);
    if (!t) return;
    var tm = S.get().timer;
    if (tm && tm.taskId === id) {
      if (tm.pausedAt) resume();
      return;
    }
    if (tm && elapsed() > TEN_HOURS) {
      // le chrono précédent a tourné trop longtemps : correction d'abord
      return confirmLong(function () { start(id); });
    }
    var res = S.startTimer(id);
    if (res.stopped) {
      var prev = S.task(res.stopped.taskId);
      U.toast({
        kind: 'success', icon: 'timer', title: 'Chrono basculé sur « ' + t.title + ' »',
        text: (prev ? 'Temps enregistré sur « ' + prev.title + ' » : ' : 'Temps enregistré : ') + D.duration(res.stopped.minutes) + '. Un seul chrono à la fois.'
      });
    } else {
      U.toast({ icon: 'play', title: 'Chrono lancé', text: '« ' + t.title + ' ». Bon courage !', duration: 3500 });
    }
    U.announce('Chrono lancé sur ' + t.title);
  }

  function pause() { S.pauseTimer(); U.announce('Chrono en pause'); }
  function resume() { S.resumeTimer(); U.announce('Chrono relancé'); }

  function confirmLong(after) {
    var tm = S.get().timer;
    var t = tm && S.task(tm.taskId);
    var min = Math.round(elapsed() / 60000);
    U.dialog({
      title: 'Ce chrono tourne depuis ' + D.duration(min),
      desc: t ? '« ' + t.title + ' »' : '',
      body: '<p class="text-muted text-sm">Un oubli, ça arrive à tout le monde. Quelle durée veux-tu garder ?</p>' +
        '<div class="field"><label class="label" for="dlg-duration">Durée à enregistrer</label>' +
        '<input class="input" id="dlg-duration" name="duration" value="7h" autocomplete="off" inputmode="text">' +
        '<p class="hint" data-duration-hint>= 7' + D.NBSP + 'h</p></div>',
      confirmLabel: 'Enregistrer cette durée',
      onMount: function (form) {
        var input = form.querySelector('input');
        input.addEventListener('input', function () {
          var m = D.parseDuration(input.value);
          form.querySelector('[data-duration-hint]').textContent = m ? '= ' + D.duration(m) : 'Exemples : 1h30, 90, 1,5';
        });
      },
      onConfirm: function (form) {
        var m = D.parseDuration(form.querySelector('input').value);
        if (!m) { form.querySelector('.field').classList.add('field--error'); form.querySelector('[data-duration-hint]').textContent = 'Indique une durée, par exemple 1h30, 90 ou 1,5.'; return false; }
        doStop(m);
        if (after) setTimeout(after, 50);
      }
    });
  }

  function doStop(minutes) {
    var res = S.stopTimer(minutes != null ? { minutes: minutes } : null);
    if (!res) return;
    var t = S.task(res.taskId);
    U.toast({
      kind: 'success', icon: 'check',
      title: 'Temps enregistré : ' + D.duration(res.minutes),
      text: t ? 'Sur « ' + t.title + ' ». Tu peux corriger l’entrée dans le détail.' : '',
      actions: t ? [{ label: 'Voir la tâche', fn: function () { L.drawer.open(t.id, { section: 'hours' }); } }] : []
    });
    U.announce('Chrono arrêté. Temps enregistré : ' + D.duration(res.minutes));
  }

  function stop() {
    if (!S.get().timer) return;
    if (elapsed() > TEN_HOURS) return confirmLong();
    doStop();
  }

  // Délégation : boutons [data-chrono] partout dans l'interface
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-chrono]');
    if (b && b.tagName === 'BUTTON') {
      var a = b.getAttribute('data-chrono');
      if (a === 'start') start(b.getAttribute('data-task'));
      else if (a === 'pause') pause();
      else if (a === 'resume') resume();
      else if (a === 'stop') stop();
      return;
    }
    var o = e.target.closest('[data-open-task]');
    if (o && !o.closest('.kanban')) { e.preventDefault(); L.drawer.open(o.getAttribute('data-open-task')); }
  });

  L.chrono = { render: render, tick: tick, start: start, pause: pause, resume: resume, stop: stop, elapsed: elapsed };
})(window.Lamia = window.Lamia || {});

</script>
  <script  data-source="js/ui-mood.js">
/* ==========================================================================
   Plateforme de suivi - Lamia — Maquette · humeur du jour
   Proposée à la première ouverture de la journée. Un clic suffit à
   enregistrer ; la note est facultative ; « Plus tard » ne bloque rien.
   ========================================================================== */
(function (L) {
  'use strict';

  var D = L.dates, S = L.store, U = L.ui;
  var esc = U.esc, icon = U.icon;
  var ov = null;

  function optionsHTML(current, name) {
    return U.MOODS.map(function (m) {
      return '<button type="button" class="mood-option" data-mood="' + m.level + '" aria-pressed="' + (current === m.level) + '"' + (name ? ' data-mood-scope="' + name + '"' : '') + '>' +
        '<span class="mood-option__art">' + U.pixelImg('mood-' + m.level, 3, '', '') + '</span>' +
        '<span class="mood-option__label">' + esc(m.label) + '</span></button>';
    }).join('');
  }

  function open(opts) {
    opts = opts || {};
    ov = ov || document.getElementById('overlay-mood');
    var today = D.today();
    var m = L.q.mood(today);
    ov.innerHTML =
      '<div class="modal mood-modal" role="dialog" aria-modal="true" aria-labelledby="mood-title" aria-describedby="mood-desc">' +
        '<div class="modal__header"><div>' +
          '<p class="eyebrow">' + esc(D.cap(D.long(today))) + '</p>' +
          '<h2 class="modal__title" id="mood-title">Comment te sens-tu aujourd’hui ?</h2>' +
          '<p class="modal__desc" id="mood-desc">Un clic suffit. Tu pourras changer d’avis dans la journée.</p></div>' +
          '<button type="button" class="btn btn--ghost btn--icon" data-mood-close aria-label="Fermer">' + icon('close') + '</button></div>' +
        '<div class="modal__body">' +
          '<div class="mood-picker" role="group" aria-label="Humeur du jour">' + optionsHTML(m ? m.level : null) + '</div>' +
          '<p class="mood-status" data-mood-status aria-live="polite">' + (m ? 'C’est noté : ' + esc(U.moodLabel(m.level)) + '.' : '') + '</p>' +
          '<div class="field"><label class="label" for="mood-note">Un mot sur ta journée <span class="label__optional">facultatif</span></label>' +
            '<input class="input" id="mood-note" maxlength="140" placeholder="Une victoire, une envie, un nuage…" value="' + esc(m ? m.note : '') + '"></div>' +
        '</div>' +
        '<div class="modal__footer">' +
          '<button type="button" class="btn btn--ghost" data-mood-close>' + (m ? 'Fermer' : 'Plus tard') + '</button>' +
          '<button type="button" class="btn btn--primary" data-mood-done' + (m ? '' : ' disabled') + '>' + icon('check') + 'C’est noté</button>' +
        '</div>' +
      '</div>';

    var picker = ov.querySelector('.mood-picker');
    var status = ov.querySelector('[data-mood-status]');
    var note = ov.querySelector('#mood-note');
    var done = ov.querySelector('[data-mood-done]');

    picker.addEventListener('click', function (e) {
      var b = e.target.closest('[data-mood]');
      if (!b) return;
      var lv = +b.getAttribute('data-mood');
      U.$$('[data-mood]', picker).forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      S.setMood(today, lv, note.value.trim());
      status.textContent = 'C’est noté : ' + U.moodLabel(lv) + '. Merci de prendre ce petit temps pour toi.';
      done.disabled = false;
      ov.querySelector('[data-mood-close]:not(.btn--icon)').textContent = 'Fermer';
    });
    // Flèches gauche / droite dans le sélecteur
    picker.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;

  // À la première connexion du jour
  function maybePrompt(onClose) {

  <script  data-source="js/ui-task-form.js">
/* ==========================================================================
   Plateforme de suivi - Lamia — Maquette · création rapide d'une tâche
   Seul le titre est obligatoire ; Entrée valide. La catégorie est proposée
   selon le jour (Flow Line du lundi au vendredi, Auto-entreprise le week-end).
   ========================================================================== */
(function (L) {
  'use strict';

  var D = L.dates, S = L.store, U = L.ui, Q = L.q;
  var esc = U.esc, icon = U.icon;

        '<form class="new-task" novalidate>' +
          '<div class="modal__header"><div><p class="eyebrow">Suivi des tâches</p><h2 class="modal__title" id="new-title">Nouvelle tâche</h2>' +

            '<button type="button" class="btn btn--ghost btn--icon" data-new-cancel aria-label="Fermer">' + icon('close') + '</button></div>' +
          '<div class="modal__body">' +
            '<div class="field" data-field="title"><label class="label" for="new-t">Titre</label>' +

              '<p class="hint" id="new-t-hint" hidden>Donne un petit nom à ta tâche, même provisoire.</p></div>' +
            '<div class="field"><span class="label" id="new-cat-l">Catégorie</span>' +
              '<div class="chip-picker" role="group" aria-labelledby="new-cat-l" data-pick="cat">' +

            '<div class="form-grid">' +
              '<div class="field"><label class="label" for="new-status">Statut</label><select class="select" id="new-status" name="status">' +
                Q.STATUS.map(function (s) { return '<option value="' + s.id + '"' + (s.id === status ? ' selected' : '') + '>' + esc(s.label) + '</option>'; }).join('') + '</select></div>' +

                '<input class="input" type="date" id="new-end" name="endDate" min="2026-01-01"></div>' +
            '</div>' +
            '<div class="field"><span class="label" id="new-prio-l">Priorité</span>' +

    var form = ov.querySelector('form');

  }

  <script  data-source="js/ui-drawer.js">
/* ==========================================================================
   Plateforme de suivi - Lamia — Maquette · tiroir de détail / édition
   Tous les champs d'une tâche, enregistrés au fil de l'eau (pas de bouton
   « Enregistrer »). Heures : chrono start/stop + saisie manuelle
   (date + durée + note), entrées modifiables et supprimables.

(function (L) {

  var D = L.dates, S = L.store, U = L.ui, Q = L.q;
  var esc = U.esc, icon = U.icon;
  var ov = null, current = null, root = null, showAllEntries = false, editingEntry = null;

  function t() { return current && S.task(current); }

  /* --- Gabarits ----------------------------------------------------------- */
  function timerBlock(task) {
    var tm = S.get().timer;
    var mine = tm && tm.taskId === task.id;
    var total = Q.taskMinutes(task, null, null, false);
    var week = Q.taskMinutes(task, D.startOfWeek(D.today()), D.endOfWeek(D.today()), false);
    var head = '<div class="hours-hero__figures"><div><span class="hours-hero__value num">' + D.duration(total) + '</span><span class="hours-hero__label">au total</span></div>' +
      '<div><span class="hours-hero__value hours-hero__value--sm num">' + D.duration(week) + '</span><span class="hours-hero__label">cette semaine</span></div></div>';
    var ctl;
    if (mine) {
      var paused = !!tm.pausedAt;
      ctl = '<div class="hours-hero__live"><span class="chrono__live' + (paused ? ' is-paused' : '') + '" aria-hidden="true"></span>' +
        '<span class="hours-hero__clock num" role="timer" aria-label="Temps écoulé" data-timer-elapsed>' + D.clock(L.chrono.elapsed()) + '</span></div>' +
        '<div class="hours-hero__actions">' + (paused
          ? '<button type="button" class="btn btn--soft btn--sm" data-chrono="resume">' + icon('play') + 'Reprendre</button>'
          : '<button type="button" class="btn btn--soft btn--sm" data-chrono="pause">' + icon('pause') + 'Pause</button>') +
        '<button type="button" class="btn btn--primary btn--sm" data-chrono="stop">' + icon('stop') + 'Stop et enregistrer</button></div>';
    } else {
      ctl = '<div class="hours-hero__actions"><button type="button" class="btn btn--primary" data-chrono="start" data-task="' + task.id + '"' + (task.status === 'done' ? ' disabled' : '') + '>' + icon('play') + 'Démarrer le chrono</button></div>' +
        (tm ? '<p class="hint">Le chrono en cours sur une autre tâche sera arrêté et enregistré.</p>' : '');
    }
    return '<div class="glass glass--nested hours-hero">' + head + ctl + '</div>';
  }

  function checklistHTML(task) {
    var done = task.checklist.filter(function (c) { return c.done; }).length;
    var n = task.checklist.length;
    var items = task.checklist.map(function (c, i) {
      return '<li class="checklist__item" data-cid="' + c.id + '">' +
        '<label class="checkbox checkbox--strike"><input class="checkbox__input" type="checkbox" data-check-toggle data-focus-key="ck-' + c.id + '"' + (c.done ? ' checked' : '') + '>' +
          '<span class="checkbox__box" aria-hidden="true"></span><span class="checkbox__label">' + esc(c.label) + '</span></label>' +
        '<span class="checklist__tools">' +
          '<button type="button" class="btn btn--ghost btn--icon btn--sm" data-check-move="-1" data-focus-key="up-' + c.id + '" aria-label="Monter « ' + esc(c.label) + ' »"' + (i === 0 ? ' disabled' : '') + '>' + icon('chevron-up') + '</button>' +
          '<button type="button" class="btn btn--ghost btn--icon btn--sm" data-check-move="1" data-focus-key="down-' + c.id + '" aria-label="Descendre « ' + esc(c.label) + ' »"' + (i === n - 1 ? ' disabled' : '') + '>' + icon('chevron-down') + '</button>' +
          '<button type="button" class="btn btn--ghost btn--icon btn--sm" data-check-remove aria-label="Supprimer « ' + esc(c.label) + ' »">' + icon('trash') + '</button>' +
        '</span></li>';
    }).join('');
    return '<div class="section-head"><h3 class="section-title">' + icon('checklist') + 'Checklist</h3>' +
        (n ? '<span class="section-meta num">' + done + ' sur ' + n + '</span>' : '') + '</div>' +
      (n ? '<span class="progress progress--sm progress--success" style="--value:' + Math.round(done / n * 100) + '" aria-hidden="true"></span>' : '') +
      (n ? '<ul class="checklist" role="list">' + items + '</ul>' : '<p class="empty-line">Pas encore de sous-tâches. Découper, c’est déjà avancer.</p>') +
      '<form class="inline-add" data-check-add><label class="sr-only" for="dr-check-new">Nouvelle sous-tâche</label>' +
        '<input class="input" id="dr-check-new" data-focus-key="check-new" placeholder="Ajouter une sous-tâche…" autocomplete="off">' +
        '<button type="submit" class="btn btn--soft btn--icon" aria-label="Ajouter la sous-tâche">' + icon('plus') + '</button></form>';
  }

  function entryRow(task, e) {
    if (editingEntry === e.id) {
      return '<li class="entry entry--edit" data-eid="' + e.id + '"><form class="entry-form" data-entry-save>' +
        '<div class="field"><label class="label" for="ee-date">Date</label><input class="input" type="date" id="ee-date" name="date" value="' + e.date + '"></div>' +
        '<div class="field"><label class="label" for="ee-dur">Durée</label><input class="input" id="ee-dur" name="dur" value="' + esc(D.duration(e.minutes).replace(/ /g, '')) + '" autocomplete="off"></div>' +
        '<div class="field entry-form__note"><label class="label" for="ee-note">Note</label><input class="input" id="ee-note" name="note" value="' + esc(e.note) + '"></div>' +
        '<div class="entry-form__actions"><button type="button" class="btn btn--ghost btn--sm" data-entry-cancel>Annuler</button><button type="submit" class="btn btn--primary btn--sm">Enregistrer</button></div>' +
        '</form></li>';
    }
    return '<li class="entry" data-eid="' + e.id + '">' +
      '<span class="entry__src" title="' + (e.source === 'timer' ? 'Chrono' : 'Saisie manuelle') + '">' + icon(e.source === 'timer' ? 'timer' : 'edit') + '<span class="sr-only">' + (e.source === 'timer' ? 'Chrono' : 'Saisie manuelle') + '</span></span>' +
      '<span class="entry__date">' + esc(D.cap(D.short(e.date))) + '</span>' +
      '<span class="entry__note">' + esc(e.note || (e.source === 'timer' ? 'Chrono' : '—')) + '</span>' +
      '<span class="entry__dur num">' + D.duration(e.minutes) + '</span>' +
      '<span class="entry__tools">' +
        '<button type="button" class="btn btn--ghost btn--icon btn--sm" data-entry-edit data-focus-key="ee-' + e.id + '" aria-label="Modifier l’entrée du ' + esc(D.short(e.date)) + '">' + icon('edit') + '</button>' +
        '<button type="button" class="btn btn--ghost btn--icon btn--sm" data-entry-remove aria-label="Supprimer l’entrée du ' + esc(D.short(e.date)) + '">' + icon('trash') + '</button>' +
      '</span></li>';
  }

  function hoursHTML(task) {
    var entries = task.timeEntries.slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    var shown = showAllEntries ? entries : entries.slice(0, 5);
    return '<div class="section-head"><h3 class="section-title" id="dr-hours">' + icon('clock') + 'Heures</h3>' +
        '<span class="section-meta">' + U.plural(entries.length, 'entrée') + '</span></div>' +
      timerBlock(task) +
      '<form class="manual-entry" data-entry-add>' +
        '<p class="manual-entry__title">Ajouter du temps à la main</p>' +
        '<div class="manual-entry__grid">' +
          '<div class="field"><label class="label" for="me-date">Date</label><input class="input" type="date" id="me-date" name="date" value="' + D.today() + '"></div>' +
          '<div class="field" data-me-dur><label class="label" for="me-dur">Durée</label><input class="input" id="me-dur" name="dur" placeholder="1h30" autocomplete="off" aria-describedby="me-dur-hint"></div>' +
          '<div class="field manual-entry__note"><label class="label" for="me-note">Note <span class="label__optional">facultatif</span></label><input class="input" id="me-note" name="note" placeholder="Ex. Retours client" autocomplete="off"></div>' +
          '<button type="submit" class="btn btn--secondary manual-entry__btn">' + icon('plus') + 'Ajouter</button>' +
        '</div>' +
        '<p class="hint" id="me-dur-hint" data-me-hint>« 1h30 », « 90 » ou « 1,5 » : comme tu préfères.</p>' +
      '</form>' +
      (entries.length ? '<ul class="entries" role="list">' + shown.map(function (e) { return entryRow(task, e); }).join('') + '</ul>' : '<p class="empty-line">Aucune heure pour l’instant : un clic sur le chrono et c’est parti.</p>') +
      (entries.length > 5 ? '<button type="button" class="btn btn--ghost btn--sm" data-entries-toggle>' + icon(showAllEntries ? 'chevron-up' : 'chevron-down') + (showAllEntries ? 'Afficher moins' : 'Voir les ' + (entries.length - 5) + ' autres entrées') + '</button>' : '');
  }

  function tagsHTML(task) {
    return '<div class="tag-editor">' + task.tags.map(function (g) {
      return '<span class="tag">' + esc(g) + '<button type="button" class="tag__remove" data-tag-remove="' + esc(g) + '" aria-label="Retirer l’étiquette ' + esc(g) + '">' + icon('close') + '</button></span>';
    }).join('') +
      '<form class="tag-editor__add" data-tag-add><label class="sr-only" for="dr-tag">Ajouter une étiquette</label>' +
      '<input class="input input--sm" id="dr-tag" data-focus-key="tag-new" list="dl-tags" placeholder="+ étiquette" autocomplete="off"></form>' +
      '<datalist id="dl-tags">' + Q.allTags().filter(function (g) { return task.tags.indexOf(g) < 0; }).map(function (g) { return '<option value="' + esc(g) + '">'; }).join('') + '</datalist></div>';
  }

  function reminderHTML(task) {
    var r = task.reminder;
    var on = !!r;
    var days = r ? r.daysBefore : 1;
    var date = task.endDate ? D.addDays(task.endDate, -days) : null;
    return '<div class="reminder">' +
      '<label class="switch"><input class="switch__input" type="checkbox" role="switch" data-reminder-on' + (on ? ' checked' : '') + (task.endDate ? '' : ' disabled') + '>' +
        '<span class="switch__track" aria-hidden="true"></span><span class="switch__label">Me rappeler l’échéance</span></label>' +
      '<select class="select select--sm" data-reminder-days aria-label="Délai du rappel"' + (on ? '' : ' disabled') + '>' +
        [1, 2, 3, 7].map(function (n) { return '<option value="' + n + '"' + (n === days ? ' selected' : '') + '>' + (n === 7 ? '1 semaine avant' : n + ' jour' + (n > 1 ? 's' : '') + ' avant') + '</option>'; }).join('') +
      '</select></div>' +
      '<p class="hint" data-reminder-hint>' + (task.endDate
        ? (on ? 'Rappel le ' + esc(D.dayMonthLong(date)) + ', à l’ouverture de l’app (et en notification Windows si elle est ouverte).' : 'Aucun rappel programmé.')
        : 'Ajoute une date de fin pour programmer un rappel.') + '</p>';
  }

  function render(task) {
    var st = S.get();
    var c = S.category(task.categoryId);
    return '<aside class="drawer task-drawer" role="dialog" aria-modal="true" aria-labelledby="dr-title" tabindex="-1">' +
      '<div class="drawer__header">' +
        '<div class="drawer__heading"><div class="drawer__chips" data-dr-chips>' + U.catChip(c) + U.statusChip(task.status) + '</div>' +
        '<h2 class="sr-only" id="dr-title">' + esc(task.title) + '</h2>' +
        '<label class="sr-only" for="dr-t">Titre de la tâche</label>' +
        '<textarea class="title-input" id="dr-t" data-f="title" rows="1" spellcheck="true" autocomplete="off">' + esc(task.title) + '</textarea></div>' +
        '<button type="button" class="btn btn--ghost btn--icon" data-dr-close aria-label="Fermer le détail">' + icon('close') + '</button>' +
      '</div>' +
      '<div class="drawer__body">' +
        '<div class="field"><label class="label" for="dr-desc">Description <span class="label__optional">facultatif</span></label>' +
          '<textarea class="textarea" id="dr-desc" data-f="description" rows="3" placeholder="Le brief, les contraintes, un lien vers les fichiers…">' + esc(task.description) + '</textarea></div>' +
        '<div class="form-grid">' +
          '<div class="field"><label class="label" for="dr-cat">Catégorie</label><select class="select" id="dr-cat" data-f="categoryId">' +
            st.categories.map(function (x) { return '<option value="' + x.id + '"' + (x.id === task.categoryId ? ' selected' : '') + '>' + esc(x.name) + '</option>'; }).join('') + '</select></div>' +
          '<div class="field"><label class="label" for="dr-client">Client / projet <span class="label__optional">facultatif</span></label>' +
            '<input class="input" id="dr-client" data-f="client" list="dl-clients-dr" value="' + esc(task.client) + '" autocomplete="off">' +
            '<datalist id="dl-clients-dr">' + Q.allClients().map(function (x) { return '<option value="' + esc(x) + '">'; }).join('') + '</datalist></div>' +
          '<div class="field"><label class="label" for="dr-status">Statut</label><select class="select" id="dr-status" data-f="status">' +
            Q.STATUS.map(function (s) { return '<option value="' + s.id + '"' + (s.id === task.status ? ' selected' : '') + '>' + esc(s.label) + '</option>'; }).join('') + '</select></div>' +
          '<div class="field"><label class="label" for="dr-prio">Priorité</label><select class="select" id="dr-prio" data-f="priority">' +
            Q.PRIORITIES.map(function (p) { return '<option value="' + p.id + '"' + (p.id === task.priority ? ' selected' : '') + '>' + esc(p.label) + '</option>'; }).join('') + '</select></div>' +
        '</div>' +
        '<div class="field"><span class="label">Étiquettes</span><div data-dr-tags>' + tagsHTML(task) + '</div></div>' +
        '<div class="form-grid" data-dr-dates>' +
          '<div class="field"><label class="label" for="dr-start">Début</label><input class="input" type="date" id="dr-start" data-f="startDate" value="' + (task.startDate || '') + '"></div>' +
          '<div class="field" data-end-field><label class="label" for="dr-end">Fin</label><input class="input" type="date" id="dr-end" data-f="endDate" value="' + (task.endDate || '') + '" aria-describedby="dr-end-hint"></div>' +
          '<p class="hint form-grid__full" id="dr-end-hint" data-end-hint hidden></p>' +
        '</div>' +
        '<div data-dr-reminder>' + reminderHTML(task) + '</div>' +
        '<div class="range-field"><div class="range-field__head"><label class="label" for="dr-progress">Avancement <span class="label__optional">réglé à la main</span></label>' +
          '<output class="range-field__value" for="dr-progress" data-progress-out>' + task.progress + D.NBSP + '%</output></div>' +
          '<input type="range" class="range" id="dr-progress" min="0" max="100" step="5" value="' + task.progress + '" style="--value:' + task.progress + '" data-f="progress">' +
          '<div class="range-field__scale" aria-hidden="true"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div></div>' +
        '<section class="drawer-section" data-dr-checklist aria-label="Checklist">' + checklistHTML(task) + '</section>' +
        '<section class="drawer-section" data-dr-hours aria-labelledby="dr-hours">' + hoursHTML(task) + '</section>' +
      '</div>' +
      '<div class="drawer__footer">' +
        '<button type="button" class="btn btn--ghost btn--danger-text" data-dr-delete>' + icon('trash') + 'Supprimer</button>' +
        '<span class="saved-note">' + icon('check') + 'Enregistré automatiquement</span>' +
        '<button type="button" class="btn btn--secondary" data-dr-close>Fermer</button>' +
      '</div>' +
    '</aside>';
  }

  // Le titre éditable grandit avec son texte (pas de barre de défilement)
  function fitTitle() {
    var ta = root && root.querySelector('#dr-t');
    if (!ta) return;
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 'px';
  }

  function refresh(part) {
    var task = t();
    if (!task || !root) return;
    if (part === 'checklist' || !part) {
      var cl = root.querySelector('[data-dr-checklist]');
      U.keepFocus(cl, function () { cl.innerHTML = checklistHTML(task); });
    }
    if (part === 'hours' || part === 'timer' || !part) {
      var h = root.querySelector('[data-dr-hours]');
      U.keepFocus(h, function () {
        var keep = h.querySelector('[data-entry-add]');
        var vals = keep ? { date: keep.date.value, dur: keep.dur.value, note: keep.note.value } : null;
        h.innerHTML = hoursHTML(task);
        if (vals && part === 'timer') { var f = h.querySelector('[data-entry-add]'); f.date.value = vals.date; f.dur.value = vals.dur; f.note.value = vals.note; }
      });
    }
    if (part === 'tags' || !part) {
      var tg = root.querySelector('[data-dr-tags]');
      U.keepFocus(tg, function () { tg.innerHTML = tagsHTML(task); });
    }
    if (part === 'reminder' || part === 'dates' || !part) {
      var rm = root.querySelector('[data-dr-reminder]');
      U.keepFocus(rm, function () { rm.innerHTML = reminderHTML(task); });
    }
    if (part === 'meta' || !part) {
      root.querySelector('[data-dr-chips]').innerHTML = U.catChip(S.category(task.categoryId)) + U.statusChip(task.status);
      var sel = root.querySelector('#dr-status'); if (sel && sel.value !== task.status) sel.value = task.status;
      var pr = root.querySelector('#dr-progress');
      if (pr && +pr.value !== task.progress) { pr.value = task.progress; pr.style.setProperty('--value', task.progress); root.querySelector('[data-progress-out]').textContent = task.progress + D.NBSP + '%'; }
    }
    U.typo(root);
  }

  /* --- Comportements ----------------------------------------------------- */
  function afterStatus(task, prev) {
    if (task.status === 'done' && prev !== 'done') {
      var acts = [];
      if (task.progress < 100) acts.push({ label: 'Mettre à 100 %', fn: function () { S.updateTask(task.id, { progress: 100 }); } });
      if (S.get().timer && S.get().timer.taskId === task.id) L.chrono.stop();
      U.toast({ kind: 'success', icon: 'sparkle', title: 'Bravo, c’est terminé !', text: '« ' + task.title + ' »' + (task.progress < 100 ? ' est à ' + task.progress + ' %. Tu veux la passer à 100 % ?' : ' rejoint la colonne Terminé.'), actions: acts, duration: 7000 });
    }
  }

  function bind() {
    root.addEventListener('input', function (e) {
      var f = e.target.getAttribute('data-f');
      var task = t();
      if (!f || !task) return;
      if (f === 'title') {
        var v = e.target.value;
        fitTitle();
        root.querySelector('#dr-title').textContent = v.trim() || 'Sans titre';
        if (v.trim()) S.updateTask(task.id, { title: v.trim() });
      } else if (f === 'description' || f === 'client') {
        S.updateTask(task.id, (function () { var p = {}; p[f] = e.target.value; return p; })());
      } else if (f === 'progress') {
        var n = +e.target.value;
        e.target.style.setProperty('--value', n);
        root.querySelector('[data-progress-out]').textContent = n + D.NBSP + '%';
        S.updateTask(task.id, { progress: n });
      }
    });

    root.addEventListener('change', function (e) {
      var task = t();
      if (!task) return;
      var f = e.target.getAttribute('data-f');
      if (f === 'categoryId' || f === 'priority') {
        var p = {}; p[f] = e.target.value; S.updateTask(task.id, p); refresh('meta');
      } else if (f === 'status') {
        var prev = task.status;
        S.updateTask(task.id, { status: e.target.value });
        refresh('meta');
        afterStatus(task, prev);
      } else if (f === 'startDate' || f === 'endDate') {
        var s = root.querySelector('#dr-start').value || null;
        var en = root.querySelector('#dr-end').value || null;
        var bad = s && en && en < s;
        var field = root.querySelector('[data-end-field]');
        var hint = root.querySelector('[data-end-hint]');
        field.classList.toggle('field--error', !!bad);
        root.querySelector('[data-dr-dates]').classList.toggle('field--error', !!bad);
        hint.hidden = !bad;
        hint.textContent = bad ? 'La fin doit tomber le même jour que le début, ou après. Ajuste l’une des deux dates.' : '';
        if (bad) { root.querySelector('#dr-end').setAttribute('aria-invalid', 'true'); return; }
        root.querySelector('#dr-end').removeAttribute('aria-invalid');
        S.updateTask(task.id, { startDate: s, endDate: en, reminder: en ? task.reminder : null });
        refresh('dates');
      } else if (e.target.hasAttribute('data-check-toggle')) {
        S.toggleCheck(task.id, e.target.closest('[data-cid]').getAttribute('data-cid'), e.target.checked);
      } else if (e.target.hasAttribute('data-reminder-on')) {
        var days = +root.querySelector('[data-reminder-days]').value || 1;
        S.updateTask(task.id, { reminder: e.target.checked ? { daysBefore: days } : null });
        refresh('reminder');
        if (e.target.checked) U.announce('Rappel programmé');
      } else if (e.target.hasAttribute('data-reminder-days')) {
        S.updateTask(task.id, { reminder: { daysBefore: +e.target.value } });
        refresh('reminder');
      }
    });

    root.addEventListener('submit', function (e) {
      e.preventDefault();
      var task = t();
      var form = e.target;
      if (!task) return;
      if (form.hasAttribute('data-check-add')) {
        var inp = form.querySelector('input');
        if (inp.value.trim()) { S.addCheck(task.id, inp.value); setTimeout(function () { var x = root.querySelector('#dr-check-new'); if (x) x.focus(); }, 0); }
      } else if (form.hasAttribute('data-tag-add')) {
        var tg = form.querySelector('input').value.trim().replace(/^#/, '');
        if (tg && task.tags.indexOf(tg) < 0) { S.updateTask(task.id, { tags: task.tags.concat([tg]) }); refresh('tags'); U.announce('Étiquette ' + tg + ' ajoutée'); }
        setTimeout(function () { var x = root.querySelector('#dr-tag'); if (x) { x.value = ''; x.focus(); } }, 0);
      } else if (form.hasAttribute('data-entry-add')) {
        var m = D.parseDuration(form.dur.value);
        var fd = form.querySelector('[data-me-dur]');
        if (!m) {
          fd.classList.add('field--error');
          form.querySelector('[data-me-hint]').textContent = 'Indique une durée, par exemple 1h30, 90 ou 1,5.';
          form.dur.focus();
          return;
        }
        S.addEntry(task.id, { date: form.date.value || D.today(), minutes: m, note: form.note.value.trim(), source: 'manual' });
        U.toast({ kind: 'success', icon: 'clock', title: 'Temps ajouté : ' + D.duration(m), text: '« ' + task.title + ' », ' + D.short(form.date.value || D.today()) + '.', duration: 3500 });
        setTimeout(function () { var x = root.querySelector('#me-dur'); if (x) x.focus(); }, 0);
      } else if (form.hasAttribute('data-entry-save')) {
        var eid = form.closest('[data-eid]').getAttribute('data-eid');
        var mm = D.parseDuration(form.dur.value);
        if (!mm) { form.dur.closest('.field').classList.add('field--error'); form.dur.focus(); return; }
        editingEntry = null;
        S.updateEntry(task.id, eid, { date: form.date.value || D.today(), minutes: mm, note: form.note.value.trim() });
        setTimeout(function () { var x = root.querySelector('[data-focus-key="ee-' + eid + '"]'); if (x) x.focus(); }, 0);
        U.announce('Entrée modifiée');
      }
    });

    root.addEventListener('input', function (e) {
      if (e.target.id === 'me-dur') {
        var m = D.parseDuration(e.target.value);
        e.target.closest('.field').classList.remove('field--error');
        root.querySelector('[data-me-hint]').textContent = e.target.value.trim() ? (m ? '= ' + D.duration(m) : 'Hum, je ne lis pas cette durée. Essaie 1h30, 90 ou 1,5.') : '« 1h30 », « 90 » ou « 1,5 » : comme tu préfères.';
        U.typo(root.querySelector('[data-me-hint]'));
      }
    });

    root.addEventListener('keydown', function (e) {
      // Alt + ↑ / ↓ sur une case : réordonner la checklist
      if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown') && e.target.hasAttribute('data-check-toggle')) {
        e.preventDefault();
        S.moveCheck(current, e.target.closest('[data-cid]').getAttribute('data-cid'), e.key === 'ArrowUp' ? -1 : 1);
      }
      if (e.key === 'Escape' && editingEntry) { e.stopPropagation(); editingEntry = null; refresh('hours'); }
      if (e.key === 'Enter' && e.target.id === 'dr-t') { e.preventDefault(); var d = root.querySelector('#dr-desc'); if (d) d.focus(); }
    }, true);

    root.addEventListener('click', function (e) {
      var task = t();
      if (!task) return;
      var b;
      if (e.target.closest('[data-dr-close]')) { close(); return; }
      if (e.target.closest('[data-dr-delete]')) { remove(task.id); return; }
      if ((b = e.target.closest('[data-tag-remove]'))) {
        var g = b.getAttribute('data-tag-remove');
        S.updateTask(task.id, { tags: task.tags.filter(function (x) { return x !== g; }) });
        refresh('tags');
        setTimeout(function () { var x = root.querySelector('#dr-tag'); if (x) x.focus(); }, 0);
        U.announce('Étiquette ' + g + ' retirée');
        return;
      }
      if ((b = e.target.closest('[data-check-move]'))) {
        S.moveCheck(task.id, b.closest('[data-cid]').getAttribute('data-cid'), +b.getAttribute('data-check-move'));
        return;
      }
      if ((b = e.target.closest('[data-check-remove]'))) {
        var li = b.closest('[data-cid]');
        var next = li.nextElementSibling || li.previousElementSibling;
        var label = li.querySelector('.checkbox__label').textContent;
        S.removeCheck(task.id, li.getAttribute('data-cid'));
        var target = next && root.querySelector('[data-cid="' + next.getAttribute('data-cid') + '"] input');
        (target || root.querySelector('#dr-check-new')).focus();
        U.announce('Sous-tâche « ' + label + ' » supprimée');
        return;
      }
      if (e.target.closest('[data-entries-toggle]')) { showAllEntries = !showAllEntries; refresh('hours'); return; }
      if ((b = e.target.closest('[data-entry-edit]'))) {
        editingEntry = b.closest('[data-eid]').getAttribute('data-eid');
        refresh('hours');
        setTimeout(function () { var x = root.querySelector('#ee-dur'); if (x) { x.focus(); x.select(); } }, 0);
        return;
      }
      if (e.target.closest('[data-entry-cancel]')) {
        var id = editingEntry; editingEntry = null; refresh('hours');
        setTimeout(function () { var x = root.querySelector('[data-focus-key="ee-' + id + '"]'); if (x) x.focus(); }, 0);
        return;
      }
      if ((b = e.target.closest('[data-entry-remove]'))) {
        var eid = b.closest('[data-eid]').getAttribute('data-eid');
        var snap = S.removeEntry(task.id, eid);
        var tid = task.id;
        U.toast({ icon: 'trash', title: 'Entrée supprimée', text: snap ? D.duration(snap.entry.minutes) + ' du ' + D.short(snap.entry.date) + '.' : '', duration: 10000,
          actions: [{ label: 'Annuler', fn: function () { S.restoreEntry(tid, snap); } }] });
        var add = root.querySelector('#me-dur'); if (add) add.focus();
      }
    });
  }

  function remove(id) {
    var task = S.task(id);
    if (!task) return;
    var snap = S.deleteTask(id);
    close(true);
    U.toast({
      icon: 'trash', title: 'Tâche supprimée', text: '« ' + task.title + ' ». Tu as 10 secondes pour changer d’avis.', duration: 10000,
      actions: [{ label: 'Annuler', fn: function () { S.restoreTask(snap); U.toast({ kind: 'success', icon: 'refresh', title: 'Tâche restaurée', text: '« ' + task.title + ' » est de retour.', duration: 3000 }); } }]
    });
  }

  function open(id, opts) {
    opts = opts || {};
    var task = S.task(id);
    if (!task) return;
    ov = ov || document.getElementById('overlay-task');
    var reopening = current && !ov.hidden;
    current = id; showAllEntries = false; editingEntry = null;
    ov.innerHTML = render(task);
    root = ov.querySelector('.task-drawer');
    bind();
    U.typo(root);
    if (!reopening) U.openLayer(ov, { initialFocus: root, returnTo: opts.returnTo, onClose: function () { current = null; root = null; } });
    requestAnimationFrame(fitTitle);
    if (opts.section === 'hours') {
      setTimeout(function () {
        var h = root && root.querySelector('[data-dr-hours]');
        if (h) { h.scrollIntoView({ block: 'start', behavior: U.reducedMotion() ? 'auto' : 'smooth' }); var b = h.querySelector('[data-chrono], #me-dur'); if (b) b.focus(); }
      }, 60);
    }
  }

  function close(deleted) {
    if (!ov || ov.hidden) return;
    U.closeLayer(ov, deleted ? 'deleted' : 'close');
  }

  S.subscribe(function (type, d) {
    if (!current || !root) return;
    if (type === 'task:delete' && d.id === current) { close(true); return; }
    if (type === 'timer') { refresh('timer'); return; }
    if (type === 'task:move' && d.id === current) { refresh('meta'); return; }
    if (type === 'task:update' && d.id === current) {
      if (d.part) refresh(d.part);
      else if (d.patch && ('progress' in d.patch) && document.activeElement && document.activeElement.id !== 'dr-progress') refresh('meta');
    }
    if (type === 'reset') close();
  });

  L.drawer = { open: open, close: close, remove: remove, afterStatus: afterStatus, current: function () { return current; } };
})(window.Lamia = window.Lamia || {});

</script>
  <script  data-source="js/ui-dashboard.js">
/* ==========================================================================
   Plateforme de suivi - Lamia — Maquette · Dashboard
   Accueil, scène pixel (Lamia & Memeow + bulles LamiaVoice), heures de la
   semaine par catégorie (jamais additionnées), humeur, tâches en cours avec
   ▶ (chrono en 2 clics), échéances et « à replanifier », récap express.
   ========================================================================== */
(function (L) {
  'use strict';

  var D = L.dates, S = L.store, U = L.ui, Q = L.q;
  var esc = U.esc, icon = U.icon, NB = D.NBSP;
  var el = null, cast = { lamia: null, memeow: null }, voice = null, narrowMQ = null;

  /* --- Voix --------------------------------------------------------------- */
  function pickVoice() {
    try { voice = window.LamiaVoice.pick(Q.voiceContext()); }
    catch (e) { voice = { lamia: 'Belle journée à toi, Lamia.', memeow: { text: 'Meew !', icon: 'heart' }, lamiaAnimation: 'wave', memeowAnimation: 'idle' }; }
    return voice;
  }

  function memeowSays(text, ic) {
    return esc(text) + U.pixelImg(ic, 2, 'pixel-bubble__icon', iconAlt(ic));
  }

  function iconAlt(ic) {
    return { heart: 'un cœur', fish: 'un poisson', zzz: 'zZz', kibble: 'des croquettes', star: 'une étoile', note: 'une note de musique' }[ic] || '';
  }

  function sceneHTML() {
    var narrow = narrowMQ && narrowMQ.matches;
    return '<div class="pixel-stage scene">' +
      '<div class="scene__say scene__say--lamia"><p class="pixel-bubble ' + (narrow ? 'pixel-bubble--tail-bottom' : 'pixel-bubble--tail-left') + ' pixel-bubble--pop" data-bubble="lamia" aria-live="polite">' +
        '<span class="sr-only">Lamia dit : </span><span data-say>' + esc(voice.lamia) + '</span></p></div>' +
      '<canvas class="scene__sprite scene__sprite--lamia" data-sprite="lamia" aria-label="Lamia, en pixel art"></canvas>' +
      '<div class="scene__memeow">' +
        '<div class="scene__say scene__say--memeow"><p class="pixel-bubble pixel-bubble--tail-bottom pixel-bubble--pop" data-bubble="memeow" aria-live="polite">' +
          '<span class="sr-only">Memeow répond : </span><span data-say>' + memeowSays(voice.memeow.text, voice.memeow.icon) + '</span></p></div>' +
        '<button type="button" class="scene__cat" data-memeow aria-label="Memeow, la chatte de Lamia. Clique pour qu’elle réagisse">' +
          '<canvas class="scene__sprite scene__sprite--memeow" data-sprite="memeow" aria-hidden="true"></canvas></button>' +
      '</div>' +
    '</div>';
  }

  function mountCast() {
    var narrow = narrowMQ && narrowMQ.matches;
    var cl = el.querySelector('[data-sprite="lamia"]');
    var cm = el.querySelector('[data-sprite="memeow"]');
    try {
      if (cast.lamia) cast.lamia.destroy();
      if (cast.memeow) cast.memeow.destroy();
      cast.lamia = window.PixelCast.mount(cl, 'lamia', { scale: narrow ? 3 : 4, animation: 'idle' });
      cast.memeow = window.PixelCast.mount(cm, 'memeow', { scale: narrow ? 3 : 4, animation: 'idle' });
      cm.setAttribute('aria-hidden', 'true');
      setTimeout(function () {
        if (cast.lamia) cast.lamia.play(voice.lamiaAnimation || 'idle');
        if (cast.memeow) cast.memeow.play(voice.memeowAnimation || 'idle');
      }, 500);
    } catch (e) { if (window.console) console.error(e); }
  }

  function bubblePop(which, html) {
    var b = el.querySelector('[data-bubble="' + which + '"]');
    if (!b) return;
    b.querySelector('[data-say]').innerHTML = html;
    U.typo(b);
    b.classList.remove('pixel-bubble--pop');
    void b.offsetWidth;
    b.classList.add('pixel-bubble--pop');
  }

  function anotherPhrase() {
    pickVoice();
    bubblePop('lamia', esc(voice.lamia));
    bubblePop('memeow', memeowSays(voice.memeow.text, voice.memeow.icon));
    if (cast.lamia) cast.lamia.play(voice.lamiaAnimation || 'idle');
    if (cast.memeow) cast.memeow.play(voice.memeowAnimation || 'idle');
  }

  var lastMeew = null;
  function petMemeow() {
    var anims = ['lick', 'hungry', 'meow'];
    var anim = anims[Math.floor(Math.random() * anims.length)];
    var pool = [];
    try {
      var all = window.LamiaVoice.phrases.memeow;
      Object.keys(all).forEach(function (k) { all[k].forEach(function (r) { if (r.animation === anim && r.text !== lastMeew) pool.push(r); }); });
    } catch (e) { pool = []; }
    var r = pool.length ? pool[Math.floor(Math.random() * pool.length)] : { text: 'Meew !', icon: anim === 'hungry' ? 'kibble' : 'heart' };
    lastMeew = r.text;
    bubblePop('memeow', memeowSays(U.typoString(r.text), r.icon));
    if (cast.memeow) cast.memeow.play(anim);
  }

  /* --- Cartes ------------------------------------------------------------- */
  function leadText(ctx) {
    var now = D.now();
    var late = now.getHours() >= 18 || D.dow(D.today()) === 0;
    if (late) return 'La journée est faite. Le reste attendra demain : profite de ta soirée.';
    var bits = [];
    if (ctx.dueThisWeek) bits.push(U.plural(ctx.dueThisWeek, 'échéance') + ' d’ici dimanche');
    if (ctx.doneToday) bits.push(U.plural(ctx.doneToday, 'tâche') + ' déjà bouclée' + (ctx.doneToday > 1 ? 's' : '') + ' aujourd’hui');
    var s = bits.length ? 'Cette semaine : ' + bits.join(' et ') + '.' : 'Rien d’urgent à l’horizon : belle journée pour avancer à ton rythme.';
    if (ctx.overdue) s += ' ' + (ctx.overdue > 1 ? ctx.overdue + ' tâches attendent' : '1 tâche attend') + ' juste une nouvelle date.';
    return s;
  }

  function hoursCard() {
    var st = S.get();
    var w0 = D.startOfWeek(D.today()), w1 = D.endOfWeek(D.today());
    var mins = Q.minutesByCategory(w0, w1, true);
    var tm = st.timer;
    var hasFree = false;
    var rows = st.categories.map(function (c) {
