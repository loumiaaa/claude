      var m = mins[c.id] || 0;
      var goal = Q.goalFor(c);
      var running = tm && !tm.pausedAt && S.task(tm.taskId) && S.task(tm.taskId).categoryId === c.id;
      var note, value, bar = '';
      if (goal) {
        var left = goal.weekly - m;
        value = '<strong class="num">' + D.duration(m) + '</strong><span class="hours-row__goal"> / ' + D.duration(goal.weekly) + '</span>';
        bar = '<span class="progress progress--lg ' + progressCls(c) + '" style="--value:' + Math.min(100, Math.round(m / goal.weekly * 100)) + '" role="progressbar" aria-valuemin="0" aria-valuemax="' + goal.weekly + '" aria-valuenow="' + m + '" aria-label="' + esc(c.name) + ' : ' + D.duration(m) + ' sur ' + D.duration(goal.weekly) + '"></span>';
        note = left > 0 ? 'Encore ' + D.duration(left) + ' d’ici vendredi (objectif : ' + D.duration(goal.daily) + ' par jour).' : (left === 0 ? 'Objectif atteint, pile poil.' : 'Objectif atteint : +' + NB + D.duration(-left) + ', tout en douceur.');
      } else {
        value = '<strong class="num">' + D.duration(m) + '</strong>';
        var daily = Q.dailyMinutes(c.id, w0, w1, true);
        var days = Object.keys(daily).filter(function (d) { return daily[d] > 0; });
        note = days.length
          ? days.map(function (d) { return D.cap(D.DAYS[D.dow(d)]) + ' : ' + D.duration(daily[d]); }).join(' · ')
          : 'Pas encore d’heures cette semaine. Samedi, c’est ton jour.';
        hasFree = true;
      }
      if (running) note += ' Chrono en cours inclus.';
      return '<div class="hours-row">' +
        '<div class="hours-row__head">' + U.catChip(c) + '<span class="hours-row__value">' + value + '</span></div>' + bar +
        '<p class="hours-row__note">' + esc(note) + '</p></div>';
    }).join('');
    return '<section class="glass card hours-card" aria-labelledby="dh-hours">' +
      '<div class="card__header"><div><h2 class="card__title" id="dh-hours">Heures de la semaine</h2>' +
      '<p class="card__subtitle">Chaque catégorie a son compteur, jamais mélangé.</p></div>' +
      '<div class="card__actions"><a class="btn btn--ghost btn--sm" href="#recap">Détail' + icon('chevron-right') + '</a></div></div>' +
      '<div class="hours-rows">' + rows + '</div>' +
      (hasFree ? '<p class="hours-card__foot">' + icon('heart') + 'Pas d’objectif pour le perso : le samedi reste un plaisir.</p>' : '') + '</section>';
  }

  function progressCls(c) {
    return { flowline: 'progress--flowline', carnet: 'progress--carnet', auto: 'progress--auto' }[c.color] || 'progress--hue ' + U.hue(c);
  }

  function moodCard() {
    var today = D.today();
    var m = Q.mood(today);
    var week = D.eachDay(D.addDays(today, -6), today).map(function (d) {
      var mm = Q.mood(d);
      return '<li class="mood-week__day' + (d === today ? ' is-today' : '') + '"><span class="mood-week__art">' +
        (mm ? U.pixelImg('mood-' + mm.level, 2, '', U.moodLabel(mm.level)) : '<span class="mood-week__empty" aria-hidden="true"></span>') +
        '</span><span class="mood-week__label" aria-hidden="true">' + D.DAYS_LETTER[D.dow(d)] + '</span>' +
        '<span class="sr-only">' + esc(D.dayMonthLong(d)) + ' : ' + (mm ? esc(U.moodLabel(mm.level)) : 'pas notée') + '</span></li>';
    }).join('');
    var body;
    if (m) {
      body = '<div class="mood-now">' + U.pixelImg('mood-' + m.level, 3, 'mood-now__art', '') +
        '<div class="mood-now__text"><p class="mood-now__level">' + esc(U.moodLabel(m.level)) + '</p>' +
        (m.note ? '<p class="mood-now__note">« ' + esc(m.note) + ' »</p>' : '<p class="mood-now__note text-muted">Aucune note, et c’est très bien aussi.</p>') + '</div>' +
        '<button type="button" class="btn btn--secondary btn--sm" data-mood-edit>' + icon('edit') + 'Modifier</button></div>';
    } else {
      body = '<p class="mood-ask">Comment te sens-tu aujourd’hui ? Un clic suffit.</p>' +
        '<div class="mood-picker mood-picker--inline" role="group" aria-label="Humeur du jour">' + L.mood.optionsHTML(null, 'dash') + '</div>';
    }
    return '<section class="glass glass--tint-violet card mood-card" aria-labelledby="dh-mood">' +
      '<div class="card__header"><div><h2 class="card__title" id="dh-mood">Humeur du jour</h2><p class="card__subtitle">Pour toi, et pour la courbe du récap.</p></div></div>' +
      body + '<div class="mood-week-wrap"><p class="mood-week__caption" id="dh-week">Tes 7 derniers jours</p>' +
      '<ol class="mood-week" aria-labelledby="dh-week">' + week + '</ol></div></section>';
  }

  function taskRow(t) {
    var c = S.category(t.categoryId);
    var tm = S.get().timer;
    var mine = tm && tm.taskId === t.id;
    var play = mine
      ? (tm.pausedAt
        ? '<button type="button" class="btn btn--soft btn--icon task-row__play is-paused" data-chrono="resume" aria-label="Reprendre le chrono sur « ' + esc(t.title) + ' »">' + icon('play') + '</button>'
        : '<button type="button" class="btn btn--primary btn--icon task-row__play is-running" data-chrono="pause" aria-label="Mettre en pause le chrono de « ' + esc(t.title) + ' »">' + icon('pause') + '</button>')
      : '<button type="button" class="btn btn--soft btn--icon task-row__play" data-chrono="start" data-task="' + t.id + '" aria-label="Démarrer le chrono sur « ' + esc(t.title) + ' »">' + icon('play') + '</button>';
    return '<li class="task-row' + (mine ? ' is-timing' : '') + '">' + play +
      '<button type="button" class="task-row__main" data-open-task="' + t.id + '">' +
        '<span class="task-row__title">' + esc(t.title) + '</span>' +
        '<span class="task-row__meta">' + U.catDot(c) + '<span class="task-row__meta-text">' + esc(c.name) + (t.client ? ' · ' + esc(t.client) : '') + '</span></span></button>' +
      (mine ? '<span class="task-row__clock num" data-timer-elapsed role="timer" aria-label="Temps écoulé">' + D.clock(L.chrono.elapsed()) + '</span>'
            : '<span class="task-row__progress"><span class="task-row__pct num">' + t.progress + NB + '%</span>' + U.progress(t.progress, 'progress--sm') + '</span>') +
      '<span class="task-row__due">' + U.dueBadge(t) + '</span></li>';
  }

  function doingCard() {
    var doing = S.column('doing');
    var review = S.column('review');
    return '<section class="glass card doing-card" aria-labelledby="dh-doing">' +
      '<div class="card__header"><div><h2 class="card__title" id="dh-doing">Tes tâches en cours</h2>' +
      '<p class="card__subtitle">▶ lance le chrono : deux clics, pas de formulaire.</p></div>' +
      '<div class="card__actions"><a class="btn btn--ghost btn--sm" href="#taches">Kanban' + icon('chevron-right') + '</a></div></div>' +
      (doing.length ? '<ul class="task-rows" role="list">' + doing.map(taskRow).join('') + '</ul>' +
        (review.length ? '<h3 class="subsection-title">' + icon('eye') + 'En validation, chez le client <span class="badge badge--neutral">' + review.length + '</span></h3>' +
          '<ul class="task-rows" role="list">' + review.map(taskRow).join('') + '</ul>' : '')
        : '<div class="empty-state"><div class="empty-state__art">' + icon('coffee') + '</div><p class="empty-state__title">Rien en cours</p>' +
          '<p class="empty-state__text">Choisis une tâche dans « Pas commencé » ou crée-en une nouvelle.</p>' +
          '<div class="empty-state__actions"><button type="button" class="btn btn--primary btn--sm" data-action="new-task">' + icon('plus') + 'Nouvelle tâche</button></div></div>') +
      '</section>';
  }

  function dueCard() {
    var today = D.today();
    var late = Q.overdue();
    var soon = Q.dueBetween(today, D.addDays(today, 7));
    var lateHTML = late.length ? '<div class="replan" aria-labelledby="dh-replan">' +
      '<h3 class="replan__title" id="dh-replan">' + icon('refresh') + 'À replanifier <span class="badge badge--neutral">' + late.length + '</span></h3>' +
      '<p class="replan__hint">Pas de panique : choisis simplement une nouvelle date.</p>' +
      '<ul class="replan__list" role="list">' + late.map(function (t) {
        var c = S.category(t.categoryId);
        return '<li class="replan-row"><button type="button" class="replan-row__main" data-open-task="' + t.id + '">' +
          '<span class="replan-row__title">' + esc(t.title) + '</span>' +
          '<span class="replan-row__meta">' + U.catDot(c) + esc(c.name) + ' · prévue le ' + esc(D.dayMonth(t.endDate)) + '</span></button>' +
          '<div class="replan-row__actions" role="group" aria-label="Replanifier « ' + esc(t.title) + ' »">' +
            '<button type="button" class="btn btn--secondary btn--sm" data-replan="tomorrow" data-task="' + t.id + '">Demain</button>' +
            '<button type="button" class="btn btn--secondary btn--sm" data-replan="monday" data-task="' + t.id + '">Lundi prochain</button>' +
            '<button type="button" class="btn btn--ghost btn--sm" data-replan="pick" data-task="' + t.id + '">' + icon('calendar') + 'Choisir</button>' +
          '</div></li>';
      }).join('') + '</ul></div>' : '';
    var soonHTML = soon.length ? '<ul class="due-list" role="list">' + soon.map(function (t) {
      var c = S.category(t.categoryId);
      var d = D.parse(t.endDate);
      var n = D.diff(today, t.endDate);
      return '<li><button type="button" class="due-row" data-open-task="' + t.id + '">' +
        '<span class="date-tile' + (n <= 1 ? ' date-tile--soon' : '') + '"><span class="date-tile__dow">' + D.DAYS_SHORT[d.getDay()].replace('.', '') + '</span><span class="date-tile__day num">' + d.getDate() + '</span></span>' +
        '<span class="due-row__text"><span class="due-row__title">' + esc(t.title) + '</span>' +
        '<span class="due-row__meta">' + U.catDot(c) + esc(c.name) + ' · ' + esc(D.relative(t.endDate)) + '</span></span>' +
        (t.priority === 'high' || t.priority === 'urgent' ? U.prio(t.priority) : '<span></span>') +
        '</button></li>';
    }).join('') + '</ul>' : '<p class="empty-line">Aucune échéance dans les 7 prochains jours. Le calme avant… le calme.</p>';
    return '<section class="glass card due-card" aria-labelledby="dh-due">' +
      '<div class="card__header"><div><h2 class="card__title" id="dh-due">Échéances</h2><p class="card__subtitle">Les 7 prochains jours</p></div>' +
      '<div class="card__actions"><a class="btn btn--ghost btn--sm" href="#planning">Planning' + icon('chevron-right') + '</a></div></div>' +
      lateHTML + soonHTML + '</section>';
  }

  function shortLabel(p) {
    if (p.kind === 'day') return D.cap(D.dayMonthLong(p.start));
    if (p.kind === 'month') return D.cap(D.monthYear(p.start));
    var a = D.parse(p.start), b = D.parse(p.end);
    return 'Du ' + a.getDate() + (a.getMonth() !== b.getMonth() ? NB + D.MONTHS[a.getMonth()] : '') + ' au ' + b.getDate() + NB + D.MONTHS[b.getMonth()];
  }

  function recapCard() {
    var kind = S.get().settings.ui.dashPeriod || 'week';
    var p = D.period(kind, D.today());
    var s = Q.summary(p);
    var periodWord = { day: 'aujourd’hui', week: 'cette semaine', month: 'ce mois-ci' }[kind];
    function tile(ic, label, value, sub, cls) {
      return '<li class="mini-stat ' + (cls || '') + '"><span class="stat__icon">' + icon(ic) + '</span>' +
        '<span class="mini-stat__text"><span class="mini-stat__label">' + esc(label) + '</span><span class="mini-stat__sub">' + esc(sub) + '</span></span>' +
        '<span class="mini-stat__value num">' + value + '</span></li>';
    }
    var review = s.ongoing.filter(function (t) { return t.status === 'review'; }).length;
    return '<section class="glass card recap-card" aria-labelledby="dh-recap">' +
      '<div class="card__header"><div><h2 class="card__title" id="dh-recap">Récap express</h2><p class="card__subtitle">' + esc(shortLabel(p)) + '</p></div>' +
      '<div class="card__actions"><a class="btn btn--ghost btn--sm" href="#recap">Récap' + icon('chevron-right') + '</a></div></div>' +
        '<div class="segmented segmented--block" role="group" aria-label="Période du récap express">' +
          [['day', 'Jour'], ['week', 'Semaine'], ['month', 'Mois']].map(function (o) {
            return '<button type="button" class="segmented__item" data-dash-period="' + o[0] + '" data-focus-key="dp-' + o[0] + '" aria-pressed="' + (kind === o[0]) + '">' + o[1] + '</button>';
          }).join('') + '</div>' +
      '<ul class="mini-stats" role="list">' +
        tile('tasks', 'En cours', '<span>' + s.ongoing.length + '</span>', review ? 'dont ' + review + ' en validation' : 'Une à la fois, c’est parfait') +
        tile('check', 'Terminées', '<span>' + s.done.length + '</span>', s.done.length ? 'Bravo, ' + periodWord : 'Ça viendra, ' + periodWord, 'stat--done') +
        tile('calendar', 'À venir', '<span>' + s.upcoming.length + '</span>', kind === 'day' ? 'Échéance aujourd’hui' : 'Échéance ' + periodWord) +
        tile('refresh', 'À replanifier', '<span>' + s.allReplan.length + '</span>', s.allReplan.length ? 'Une nouvelle date, et on repart' : 'Tout est à jour', 'stat--replan') +
      '</ul></section>';
  }

  /* --- Rendu -------------------------------------------------------------- */
  function render() {
    if (!el) return;
    var ctx = Q.voiceContext();
    var today = D.today();
    if (!voice) pickVoice();
    var hadScene = !!el.querySelector('.scene');
    var html =
      '<div class="dash-grid">' +
        '<section class="glass card hero" aria-labelledby="h-dashboard">' +
          '<div class="hero__text"><p class="eyebrow">' + esc(D.cap(D.long(today))) + ' · semaine ' + D.isoWeek(today) + '</p>' +
            '<h1 class="display" id="h-dashboard" tabindex="-1">Bonjour Lamia</h1>' +
            '<p class="hero__lead" data-lead>' + esc(leadText(ctx)) + '</p>' +
            '<div class="hero__actions"><button type="button" class="btn btn--secondary btn--sm" data-another>' + icon('refresh') + 'Une autre phrase</button>' +
            '<span class="hero__hint">Clique sur Memeow, elle adore ça.</span></div></div>' +
          '<div class="hero__stage" data-scene-slot></div>' +
        '</section>' +
        '<div data-dash-hours class="dash-hours">' + hoursCard() + '</div>' +
        '<div data-dash-mood class="dash-mood">' + moodCard() + '</div>' +
        '<div data-dash-recap class="dash-recap">' + recapCard() + '</div>' +
        '<div data-dash-doing class="dash-doing">' + doingCard() + '</div>' +
        '<div data-dash-due class="dash-due">' + dueCard() + '</div>' +
      '</div>';
    var scene = hadScene ? el.querySelector('.scene') : null;
    U.keepFocus(el, function () {
      el.innerHTML = html;
      var slot = el.querySelector('[data-scene-slot]');
      if (scene) slot.appendChild(scene);
      else { slot.innerHTML = sceneHTML(); mountCast(); }
    });
    U.typo(el);
  }

  // Re-rendu ciblé (la scène pixel n'est jamais reconstruite inutilement)
  function update(part) {
    if (!el || !el.querySelector('.dash-grid')) return render();
    if (part === 'side') part = null;
    var map = { hours: ['[data-dash-hours]', hoursCard], mood: ['[data-dash-mood]', moodCard], doing: ['[data-dash-doing]', doingCard], due: ['[data-dash-due]', dueCard], recap: ['[data-dash-recap]', recapCard] };
    (part ? [part] : Object.keys(map)).forEach(function (k) {
      var box = el.querySelector(map[k][0]);
      U.keepFocus(box, function () { box.innerHTML = map[k][1](); });
      U.typo(box);
    });
    var lead = el.querySelector('[data-lead]');
    if (lead) { lead.textContent = leadText(Q.voiceContext()); U.typo(lead); }
  }

  function replan(id, how, anchor) {
    var t = S.task(id);
    if (!t) return;
    var today = D.today();
    function apply(date) {
      var prev = { endDate: t.endDate, startDate: t.startDate };
      var patch = { endDate: date };
      if (t.startDate && t.startDate > date) patch.startDate = date;
      S.updateTask(id, patch);
      U.toast({ kind: 'success', icon: 'calendar', title: 'Replanifiée au ' + D.dayMonthLong(date), text: '« ' + t.title + ' ». Nouvelle date, nouvel élan.', duration: 7000,
        actions: [{ label: 'Annuler', fn: function () { S.updateTask(id, prev); } }] });
      U.announce('Tâche replanifiée au ' + D.dayMonthLong(date));
    }
    if (how === 'tomorrow') return apply(D.addDays(today, 1));
    if (how === 'monday') return apply(D.addDays(D.startOfWeek(today), 7));
    U.dialog({
      title: 'Choisir une nouvelle date', desc: '« ' + t.title + ' »', returnTo: anchor,
      body: '<div class="field"><label class="label" for="dlg-date">Nouvelle échéance</label><input class="input" type="date" id="dlg-date" name="date" value="' + D.addDays(today, 2) + '" min="' + today + '">' +
        '<p class="hint">Prends la marge qu’il te faut.</p></div>',
      confirmLabel: 'Replanifier',
      onConfirm: function (form) {
        var v = form.date.value;
        if (!D.valid(v)) { form.querySelector('.field').classList.add('field--error'); return false; }
        apply(v);
      }
    });
  }

  function mount(node) {
    el = node;
    narrowMQ = window.matchMedia('(max-width: 640px)');
    var wasNarrow = narrowMQ.matches;
    var onNarrow = function () {
      if (narrowMQ.matches === wasNarrow) return;
      wasNarrow = narrowMQ.matches;
      var s = el.querySelector('.scene');
      if (s) { s.outerHTML = sceneHTML(); mountCast(); }
    };
    if (narrowMQ.addEventListener) narrowMQ.addEventListener('change', onNarrow);

    el.addEventListener('click', function (e) {
      var b;
      if (e.target.closest('[data-another]')) { anotherPhrase(); return; }
      if (e.target.closest('[data-memeow]')) { petMemeow(); return; }
      if ((b = e.target.closest('[data-dash-period]'))) { S.setUI({ dashPeriod: b.getAttribute('data-dash-period') }); return; }
      if ((b = e.target.closest('[data-replan]'))) { replan(b.getAttribute('data-task'), b.getAttribute('data-replan'), b); return; }
      if (e.target.closest('[data-mood-edit]')) { L.mood.open({ returnTo: e.target.closest('button') }); return; }
      if ((b = e.target.closest('[data-mood][data-mood-scope="dash"]'))) {
        S.setMood(D.today(), +b.getAttribute('data-mood'), '');
        U.toast({ kind: 'success', icon: 'heart', title: 'Humeur notée : ' + U.moodLabel(+b.getAttribute('data-mood')), text: 'Merci de prendre ce petit temps pour toi.', duration: 3500 });
        setTimeout(function () { var x = el.querySelector('[data-mood-edit]'); if (x) x.focus(); }, 0);
      }
    });

    S.subscribe(function (type, d) {
      if (L.app.view() !== 'dashboard') { el.dataset.stale = '1'; if (type === 'mood') voice = null; return; }
      if (type === 'reset') { voice = null; el.innerHTML = ''; render(); return; }
      if (type === 'mood') { update('mood'); if (d.level) { anotherPhrase(); } return; }
      if (type === 'ui') { if (d.dashPeriod) update('recap'); return; }
      if (type === 'timer') { update('hours'); update('doing'); return; }
      if (type === 'settings' || type === 'category') { update(); return; }
      if (type.indexOf('task') === 0) {
        if (d.part === 'checklist') return;
        update();
      }
    });
    // Les heures (chrono en cours inclus) se rafraîchissent chaque minute
    setInterval(function () { if (L.app.view() === 'dashboard' && S.get().timer && !document.querySelector('.has-layer')) update('hours'); }, 60000);
  }

  function show() {
    if (!el.querySelector('.dash-grid') || el.dataset.stale) {
      delete el.dataset.stale;
      if (!voice) { pickVoice(); if (el.querySelector('.scene')) { bubblePop('lamia', esc(voice.lamia)); bubblePop('memeow', memeowSays(voice.memeow.text, voice.memeow.icon)); } }
      if (el.querySelector('.dash-grid')) update(); else render();
    }
  }

  L.views = L.views || {};
  L.views.dashboard = { mount: mount, render: render, show: show, anotherPhrase: anotherPhrase, petMemeow: petMemeow, title: 'Dashboard' };
})(window.Lamia = window.Lamia || {});

</script>
  <script  data-source="js/ui-tasks.js">
/* ==========================================================================
   Plateforme de suivi - Lamia — Maquette · Suivi des tâches
   Kanban 4 colonnes (glisser-déposer HTML5 à la souris, au pointeur sur la
   poignée pour le tactile, et alternatives clavier : menu « Déplacer vers… »
   ou Alt + flèches), vue liste triable, filtres partagés et mémorisés.
   ========================================================================== */
(function (L) {
  'use strict';

  var D = L.dates, S = L.store, U = L.ui, Q = L.q;
  var esc = U.esc, icon = U.icon, NB = D.NBSP;
  var el = null, drag = null;

  /* --- Filtres ------------------------------------------------------------ */
  function filters() { return S.get().settings.ui.filters; }

  function setFilter(patch) {
    S.setUI({ filters: Object.assign({}, filters(), patch) });
  }

  function toolbarHTML(mode) {
    var f = filters();
    var st = S.get();
    function opt(v, label, cur) { return '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(label) + '</option>'; }
    var n = Q.activeFilterCount();
    return '<div class="glass filters" role="search" aria-label="Filtrer les tâches">' +
      '<div class="filters__row">' +
        '<div class="input-wrap filters__search">' + icon('search') +
          '<input type="search" class="input" data-filter="q" data-focus-key="f-q" value="' + esc(f.q) + '" placeholder="Rechercher une tâche, un client, une étiquette…" aria-label="Rechercher une tâche"></div>' +
        '<div class="filters__cats" role="group" aria-label="Catégories">' +
          st.categories.map(function (c) {
            return '<button type="button" class="chip chip--cat ' + U.hue(c) + '" data-filter-cat="' + c.id + '" data-focus-key="fc-' + c.id + '" aria-pressed="' + (f.categories.indexOf(c.id) >= 0) + '">' + esc(c.name) + '</button>';
          }).join('') + '</div>' +
      '</div>' +
      '<div class="filters__row filters__row--selects">' +
        '<label class="filters__select"><span class="filters__label">Priorité</span><select class="select select--sm" data-filter="priority" data-focus-key="f-prio">' +
          opt('', 'Toutes', f.priority) + Q.PRIORITIES.slice().reverse().map(function (p) { return opt(p.id, p.label, f.priority); }).join('') + '</select></label>' +
        '<label class="filters__select"><span class="filters__label">Étiquette</span><select class="select select--sm" data-filter="tag" data-focus-key="f-tag">' +
          opt('', 'Toutes', f.tag) + Q.allTags().map(function (g) { return opt(g, '# ' + g, f.tag); }).join('') + '</select></label>' +
        '<label class="filters__select"><span class="filters__label">Client</span><select class="select select--sm" data-filter="client" data-focus-key="f-client">' +
          opt('', 'Tous', f.client) + Q.allClients().map(function (c) { return opt(c, c, f.client); }).join('') + '</select></label>' +
        '<label class="filters__select"><span class="filters__label">Échéance</span><select class="select select--sm" data-filter="due" data-focus-key="f-due">' +
          opt('', 'Toutes', f.due) + opt('week', 'Cette semaine', f.due) + opt('month', 'Ce mois-ci', f.due) + opt('late', 'À replanifier', f.due) + opt('none', 'Sans date', f.due) + '</select></label>' +
        (mode === 'list' ? '<label class="filters__select"><span class="filters__label">Statut</span><select class="select select--sm" data-filter="status" data-focus-key="f-status">' +
          opt('', 'Tous', f.status) + Q.STATUS.map(function (s) { return opt(s.id, s.label, f.status); }).join('') + '</select></label>' : '') +
        (mode === 'list' ? '<label class="filters__select filters__select--sort"><span class="filters__label">Trier par</span><select class="select select--sm" data-sort-select data-focus-key="f-sort">' +
          SORTS.map(function (s) { return opt(s[0], s[1], st.settings.ui.sort.key); }).join('') + '</select></label>' : '') +
        '<button type="button" class="btn btn--ghost btn--sm filters__clear" data-filter-clear' + (n ? '' : ' hidden') + '>' + icon('close') + 'Effacer les filtres</button>' +
      '</div></div>';
  }

  /* --- Carte du kanban ----------------------------------------------------- */
  function cardHTML(t) {
    var c = S.category(t.categoryId);
    var done = t.checklist.filter(function (x) { return x.done; }).length;
    var mins = Q.taskMinutes(t, null, null, true);
    var tm = S.get().timer;
    var timing = tm && tm.taskId === t.id;
    var d = U.due(t);
    var label = t.title + ', ' + c.name + ', priorité ' + Q.prioLabel(t.priority).toLowerCase() + (d ? ', ' + d.long : '') + ', avancement ' + t.progress + ' %';
    return '<article class="glass glass--nested glass--interactive task-card' + (t.status === 'done' ? ' task-card--done' : '') + (timing ? ' is-timing' : '') + '" ' +
      'role="listitem" tabindex="0" draggable="true" data-id="' + t.id + '" data-focus-key="card-' + t.id + '" aria-label="' + esc(label) + '" aria-describedby="kanban-help">' +
      '<span class="task-card__grip" data-grip aria-hidden="true" title="Glisser pour déplacer">' + icon('grip') + '</span>' +
      '<div class="task-card__top">' + U.catChip(c) + (t.priority !== 'normal' ? U.prio(t.priority) : '') +
        '<button type="button" class="btn btn--ghost btn--icon btn--sm task-card__menu" data-card-menu data-focus-key="menu-' + t.id + '" aria-haspopup="menu" aria-expanded="false" aria-label="Actions pour « ' + esc(t.title) + ' » : ouvrir, déplacer vers…">' + icon('more') + '</button>' +
      '</div>' +
      '<h3 class="task-card__title">' + esc(t.title) + '</h3>' +
      (t.client ? '<p class="task-card__client">' + icon('briefcase') + '<span>' + esc(t.client) + '</span></p>' : '') +
      (t.tags.length ? '<div class="task-card__tags">' + U.tags(t.tags, 3) + '</div>' : '') +
      (t.status !== 'done' && (t.status !== 'todo' || t.progress > 0) ? '<div class="task-card__progress"><span class="task-card__pct num">' + t.progress + NB + '%</span>' + U.progress(t.progress, 'progress--sm') + '</div>' : '') +
      '<div class="task-card__foot">' +
        (t.checklist.length ? '<span class="task-card__meta" title="Checklist">' + icon('checklist') + '<span class="num">' + done + '/' + t.checklist.length + '</span><span class="sr-only"> sous-tâches faites</span></span>' : '') +
        (mins || timing ? '<span class="task-card__meta" title="Heures passées">' + icon('clock') + '<span class="num">' + D.duration(mins, { compact: true }) + '</span><span class="sr-only"> passées</span></span>' : '') +
        (timing ? '<span class="task-card__live"><span class="chrono__live' + (tm.pausedAt ? ' is-paused' : '') + '" aria-hidden="true"></span><span class="num" data-timer-elapsed>' + D.clock(L.chrono.elapsed()) + '</span></span>' : '') +
        (t.status === 'done'
          ? '<span class="task-card__due task-card__done">' + icon('check') + (t.completedAt ? 'Terminée le ' + esc(D.dayMonth(t.completedAt)) : 'Terminée') + '</span>'
          : '<span class="task-card__due">' + U.dueBadge(t) + '</span>') +
      '</div></article>';
  }

  function columnEmpty(status, filtered) {
    if (filtered) return '<p class="kanban__empty">Aucune tâche ne correspond aux filtres ici.</p>';
    return '<p class="kanban__empty">' + {
      todo: 'Rien en attente. Une idée ? Le bouton + est là pour ça.',
      doing: 'Glisse ici la tâche du moment.',
      review: 'Rien chez le client pour l’instant.',
      done: 'Les victoires du jour arriveront ici.'
    }[status] + '</p>';
  }

  function kanbanHTML() {
    var visible = Q.filtered();
    var ids = {};
    visible.forEach(function (t) { ids[t.id] = 1; });
    var anyFilter = Q.activeFilterCount() > 0;
    return '<div class="kanban" data-kanban>' + Q.STATUS.map(function (s) {
      var all = S.column(s.id);
      var list = all.filter(function (t) { return ids[t.id]; });
      return '<section class="glass kanban__col kanban__col--' + s.id + '" data-status="' + s.id + '" aria-labelledby="col-' + s.id + '">' +
        '<header class="kanban__head"><h2 class="kanban__title" id="col-' + s.id + '"><span class="chip chip--' + s.id + '">' + esc(s.label) + '</span></h2>' +
          '<span class="kanban__count num" aria-label="' + list.length + ' tâche' + (list.length > 1 ? 's' : '') + '">' + list.length + (anyFilter && list.length !== all.length ? '<span class="text-subtle">/' + all.length + '</span>' : '') + '</span>' +
          '<button type="button" class="btn btn--ghost btn--icon btn--sm kanban__add" data-add-in="' + s.id + '" aria-label="Nouvelle tâche dans « ' + esc(s.label) + ' »">' + icon('plus') + '</button></header>' +
        '<div class="kanban__list" data-drop="' + s.id + '" role="list" aria-labelledby="col-' + s.id + '">' +
          (list.length ? list.map(cardHTML).join('') : columnEmpty(s.id, anyFilter)) + '</div>' +
      '</section>';
    }).join('') + '</div>' +
    '<p class="kbd-help kbd-help--touch">Astuce : maintiens la poignée en haut d’une carte pour la glisser, ou touche ⋯ puis « Déplacer vers… ».</p>' +
    '<p class="kbd-help kbd-help--desk" id="kanban-help">Astuce : glisse une carte d’une colonne à l’autre, ou au clavier : <span class="kbd">Entrée</span> ouvre le détail, <span class="kbd">Alt</span> + <span class="kbd">←</span> <span class="kbd">→</span> change de colonne, <span class="kbd">Alt</span> + <span class="kbd">↑</span> <span class="kbd">↓</span> change l’ordre. Le menu ⋯ propose aussi « Déplacer vers… ».</p>';
  }

  /* --- Vue liste ----------------------------------------------------------- */
  var SORTS = [['title', 'Titre'], ['category', 'Catégorie'], ['status', 'Statut'], ['priority', 'Priorité'], ['endDate', 'Échéance'], ['progress', 'Avancement'], ['hours', 'Heures']];
  var STATUS_RANK = { todo: 0, doing: 1, review: 2, done: 3 };

  function sortTasks(list) {
    var s = S.get().settings.ui.sort;
    var dir = s.dir === 'desc' ? -1 : 1;
    var val = {
      title: function (t) { return t.title.toLowerCase(); },
      category: function (t) { return S.category(t.categoryId).name.toLowerCase(); },
      status: function (t) { return STATUS_RANK[t.status]; },
      priority: function (t) { return Q.PRIO_RANK[t.priority]; },
      endDate: function (t) { return t.endDate || '9999'; },
      progress: function (t) { return t.progress; },
      hours: function (t) { return Q.taskMinutes(t, null, null, true); }
    }[s.key] || function (t) { return t.title; };
    return list.slice().sort(function (a, b) {
      // Par échéance, les tâches terminées passent après celles qui restent à faire
      if (s.key === 'endDate' && (a.status === 'done') !== (b.status === 'done')) return a.status === 'done' ? 1 : -1;
      var x = val(a), y = val(b);
      if (typeof x === 'string') { var c = x.localeCompare(y, 'fr'); if (c) return c * dir; }
      else if (x !== y) return (x < y ? -1 : 1) * dir;
      return a.title.localeCompare(b.title, 'fr');
    });
  }

  function listHTML() {
    var rows = sortTasks(Q.filtered());
    var s = S.get().settings.ui.sort;
    function th(key, label, cls) {
      var sorted = s.key === key;
      return '<th scope="col" class="' + (cls || '') + '" aria-sort="' + (sorted ? (s.dir === 'desc' ? 'descending' : 'ascending') : 'none') + '">' +
        '<button type="button" class="th-sort' + (sorted ? ' is-sorted' : '') + '" data-sort="' + key + '" data-focus-key="sort-' + key + '">' + esc(label) +
        '<span class="th-sort__icon">' + icon(sorted ? (s.dir === 'desc' ? 'arrow-down' : 'arrow-up') : 'sort') + '</span></button></th>';
    }
    if (!rows.length) return emptyFiltered();
    return '<section class="glass card list-card" aria-label="Liste des tâches"><div class="table-scroll"><table class="task-table">' +
      '<caption class="sr-only">Tâches, triées par ' + esc((SORTS.filter(function (x) { return x[0] === s.key; })[0] || [])[1] || '') + '. Les en-têtes de colonnes permettent de trier.</caption>' +
      '<thead><tr>' + th('title', 'Tâche', 'col-title') + th('category', 'Catégorie') + th('status', 'Statut') + th('priority', 'Priorité') +
        th('endDate', 'Échéance') + th('progress', 'Avancement', 'col-progress') + th('hours', 'Heures', 'col-num') + '</tr></thead><tbody>' +
      rows.map(function (t) {
        var c = S.category(t.categoryId);
        var mins = Q.taskMinutes(t, null, null, true);
        return '<tr data-row="' + t.id + '"' + (t.status === 'done' ? ' class="is-done"' : '') + '>' +
          '<td class="col-title"><button type="button" class="row-title" data-open-task="' + t.id + '" data-focus-key="row-' + t.id + '">' + esc(t.title) + '</button>' +
            '<span class="row-sub">' + (t.client ? esc(t.client) : '') + (t.tags.length ? (t.client ? ' · ' : '') + t.tags.map(function (g) { return '#' + esc(g); }).join(' ') : '') + '</span></td>' +
          '<td data-label="Catégorie">' + U.catChip(c) + '</td>' +
          '<td data-label="Statut">' + U.statusChip(t.status) + '</td>' +
          '<td data-label="Priorité">' + U.prio(t.priority) + '</td>' +
          '<td data-label="Échéance">' + (t.endDate ? U.dueBadge(t) : '<span class="text-subtle text-sm">Sans date</span>') + '</td>' +
          '<td data-label="Avancement" class="col-progress"><span class="cell-progress"><span class="num">' + t.progress + NB + '%</span>' + U.progress(t.progress, 'progress--sm' + (t.status === 'done' ? ' progress--success' : '')) + '</span></td>' +
          '<td data-label="Heures" class="col-num num">' + (mins ? D.duration(mins, { compact: true }) : '<span class="text-subtle">—</span>') + '</td>' +
        '</tr>';
      }).join('') + '</tbody></table></div></section>';
  }

  function emptyFiltered() {
    return '<section class="glass card"><div class="empty-state"><div class="empty-state__art">' + icon('search') + '</div>' +
      '<p class="empty-state__title">Aucune tâche ne correspond</p><p class="empty-state__text">Les filtres sont peut-être un peu trop exigeants. On les relâche ?</p>' +
      '<div class="empty-state__actions"><button type="button" class="btn btn--secondary btn--sm" data-filter-clear>' + icon('close') + 'Effacer les filtres</button>' +
      '<button type="button" class="btn btn--primary btn--sm" data-action="new-task">' + icon('plus') + 'Nouvelle tâche</button></div></div></section>';
  }

  /* --- Rendu --------------------------------------------------------------- */
  function render() {
    if (!el) return;
    var st = S.get();
    var mode = st.settings.ui.tasksView || 'kanban';
    var total = st.tasks.length;
    var visible = Q.filtered().length;
    var doing = S.column('doing').length;
    var html =
      '<header class="page-head"><div class="page-head__text"><p class="eyebrow">' + U.plural(total, 'tâche') + ' · ' + doing + ' en cours</p>' +
        '<h1 class="h1" id="h-tasks" tabindex="-1">Suivi des tâches</h1></div>' +
        '<div class="page-head__actions">' +
          '<div class="segmented" role="group" aria-label="Affichage des tâches">' +
            '<button type="button" class="segmented__item" data-mode="kanban" data-focus-key="mode-k" aria-pressed="' + (mode === 'kanban') + '">' + icon('kanban') + 'Kanban</button>' +
            '<button type="button" class="segmented__item" data-mode="list" data-focus-key="mode-l" aria-pressed="' + (mode === 'list') + '">' + icon('list') + 'Liste</button></div>' +
          '<button type="button" class="btn btn--primary" data-action="new-task">' + icon('plus') + 'Nouvelle tâche</button></div></header>' +
      toolbarHTML(mode) +
      '<p class="filters__count" aria-live="polite">' + (visible === total ? 'Toutes les tâches sont affichées.' : U.plural(visible, 'tâche') + ' sur ' + total + ' correspond' + (visible > 1 ? 'ent' : '') + ' aux filtres.') + '</p>' +
      (mode === 'list' ? listHTML() : kanbanHTML());
    var scrollers = U.$$('.kanban__list', el).map(function (x) { return x.scrollTop; });
    var hscroll = el.querySelector('.kanban') ? el.querySelector('.kanban').scrollLeft : 0;
    U.keepFocus(el, function () { el.innerHTML = html; });
    U.$$('.kanban__list', el).forEach(function (x, i) { x.scrollTop = scrollers[i] || 0; });
    if (el.querySelector('.kanban')) el.querySelector('.kanban').scrollLeft = hscroll;
    U.typo(el);
  }

  /* --- Déplacements -------------------------------------------------------- */
  function moveTo(id, status, index, how) {
    var t = S.task(id);
    if (!t) return;
    var prev = t.status;
    S.moveTask(id, status, index);
    var pos = S.column(status).indexOf(t) + 1;
    U.announce('« ' + t.title + ' » déplacée vers ' + Q.statusLabel(status) + ', position ' + pos + ' sur ' + S.column(status).length + '.');
    if (status !== prev) {
      L.drawer.afterStatus(t, prev);
      if (how !== 'drag' && status !== 'done') U.toast({ icon: 'arrow-right', title: 'Déplacée vers ' + Q.statusLabel(status), text: '« ' + t.title + ' »', duration: 3000 });
    }
    setTimeout(function () { var c = el.querySelector('[data-focus-key="card-' + id + '"]'); if (c && how === 'key') c.focus(); }, 0);
  }

  function cardMenu(btn) {
    var id = btn.closest('[data-id]').getAttribute('data-id');
    var t = S.task(id);
    var tm = S.get().timer;
    var col = S.column(t.status);
    var i = col.indexOf(t);
    var items = [
      { label: 'Ouvrir le détail', icon: 'eye', onSelect: function () { L.drawer.open(id, { returnTo: btn }); } },
      { separator: true }, { heading: 'Déplacer vers…' }
    ];
    Q.STATUS.forEach(function (s) {
      items.push({ label: s.label, checked: s.id === t.status, disabled: s.id === t.status, onSelect: function () { moveTo(id, s.id, 0, 'menu'); focusCardSoon(id); } });
    });
    items.push({ separator: true });
    items.push({ label: 'Monter d’un cran', icon: 'arrow-up', disabled: i === 0, onSelect: function () { moveTo(id, t.status, i - 1, 'menu'); focusCardSoon(id); } });
    items.push({ label: 'Descendre d’un cran', icon: 'arrow-down', disabled: i === col.length - 1, onSelect: function () { moveTo(id, t.status, i + 1, 'menu'); focusCardSoon(id); } });
    items.push({ separator: true });
    if (t.status !== 'done') {
      items.push(tm && tm.taskId === id
        ? { label: 'Arrêter le chrono', icon: 'stop', onSelect: function () { L.chrono.stop(); } }
        : { label: 'Démarrer le chrono', icon: 'play', onSelect: function () { L.chrono.start(id); } });
    }
    items.push({ label: 'Supprimer', icon: 'trash', danger: true, onSelect: function () { L.drawer.remove(id); } });
    U.openMenu(btn, items, { label: 'Actions pour « ' + t.title + ' »' });
  }

  function focusCardSoon(id) {
    setTimeout(function () { var c = el.querySelector('[data-focus-key="card-' + id + '"]'); if (c) { c.focus(); c.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } }, 30);
  }

  function keyMove(card, e) {
    var id = card.getAttribute('data-id');
    var t = S.task(id);
    var order = Q.STATUS.map(function (s) { return s.id; });
    var ci = order.indexOf(t.status);
    var col = S.column(t.status);
    var i = col.indexOf(t);
    if (e.key === 'ArrowRight' && ci < 3) moveTo(id, order[ci + 1], 0, 'key');
    else if (e.key === 'ArrowLeft' && ci > 0) moveTo(id, order[ci - 1], 0, 'key');
    else if (e.key === 'ArrowUp' && i > 0) moveTo(id, t.status, i - 1, 'key');
    else if (e.key === 'ArrowDown' && i < col.length - 1) moveTo(id, t.status, i + 1, 'key');
    else return;
    focusCardSoon(id);
  }

  /* --- Glisser-déposer : souris (HTML5) ------------------------------------ */
  function marker() {
    var m = el.querySelector('.drop-marker');
    if (!m) { m = document.createElement('div'); m.className = 'drop-marker'; m.setAttribute('aria-hidden', 'true'); }
    return m;
  }

  function indexAt(list, y) {
    var cards = U.$$('.task-card', list).filter(function (c) { return !drag || c.getAttribute('data-id') !== drag.id; });
    for (var i = 0; i < cards.length; i++) {
      var r = cards[i].getBoundingClientRect();
      if (y < r.top + r.height / 2) return { index: i, before: cards[i] };
    }
    return { index: cards.length, before: null };
  }

  function placeMarker(list, y) {
    var at = indexAt(list, y);
    var m = marker();
    var empty = list.querySelector('.kanban__empty');
    if (empty) empty.hidden = true;
    if (at.before) list.insertBefore(m, at.before); else list.appendChild(m);
    U.$$('.kanban__col', el).forEach(function (c) { c.classList.toggle('is-drop-target', c.contains(list)); });
    drag.target = { status: list.getAttribute('data-drop'), index: at.index };
  }

  function clearDrag() {
    var m = el && el.querySelector('.drop-marker');
    if (m) m.remove();
    if (el) {
      U.$$('.kanban__empty', el).forEach(function (x) { x.hidden = false; });
      U.$$('.is-drop-target', el).forEach(function (x) { x.classList.remove('is-drop-target'); });
      U.$$('.is-dragging', el).forEach(function (x) { x.classList.remove('is-dragging'); });
    }
    document.documentElement.classList.remove('is-dragging-card');
  }

  function finishDrop() {
    var d = drag;
    clearDrag();
    drag = null;
    if (d && d.target) moveTo(d.id, d.target.status, d.target.index, 'drag');
  }

  function bindDnD() {
    el.addEventListener('dragstart', function (e) {
      var card = e.target.closest && e.target.closest('.task-card');
      if (!card) return;
      drag = { id: card.getAttribute('data-id'), target: null };
      try { e.dataTransfer.setData('text/plain', drag.id); e.dataTransfer.effectAllowed = 'move'; } catch (err) { /* rien */ }
      document.documentElement.classList.add('is-dragging-card');
      setTimeout(function () { card.classList.add('is-dragging'); }, 0);
      L.ui.closeMenu(false);
    });
    el.addEventListener('dragover', function (e) {
      if (!drag) return;
      var list = e.target.closest && (e.target.closest('.kanban__list') || (e.target.closest('.kanban__col') && e.target.closest('.kanban__col').querySelector('.kanban__list')));
      if (!list) return;
      e.preventDefault();
      try { e.dataTransfer.dropEffect = 'move'; } catch (err) { /* rien */ }
      placeMarker(list, e.clientY);
    });
    el.addEventListener('drop', function (e) {
      if (!drag) return;
      e.preventDefault();
      finishDrop();
    });
    el.addEventListener('dragend', function () { if (drag) { clearDrag(); drag = null; } });
  }

  /* --- Glisser-déposer : pointeur (tactile, stylet) sur la poignée --------- */
  function bindPointerDrag() {
    el.addEventListener('pointerdown', function (e) {
      var grip = e.target.closest('[data-grip]');
      if (!grip || e.pointerType === 'mouse') return;
      var card = grip.closest('.task-card');
      e.preventDefault();
      var r = card.getBoundingClientRect();
      var ghost = card.cloneNode(true);
      ghost.classList.add('drag-ghost');
      ghost.removeAttribute('data-focus-key');
      ghost.style.width = r.width + 'px';
      document.body.appendChild(ghost);
      drag = { id: card.getAttribute('data-id'), target: null, ghost: ghost, dx: e.clientX - r.left, dy: e.clientY - r.top, pointer: e.pointerId };
      card.classList.add('is-dragging');
      document.documentElement.classList.add('is-dragging-card');
      moveGhost(e);
      grip.setPointerCapture(e.pointerId);
      grip.addEventListener('pointermove', onMove);
      grip.addEventListener('pointerup', onUp);
      grip.addEventListener('pointercancel', onCancel);
      function onMove(ev) { moveGhost(ev); }
      function cleanup() {
        grip.removeEventListener('pointermove', onMove);
        grip.removeEventListener('pointerup', onUp);
        grip.removeEventListener('pointercancel', onCancel);
        if (drag && drag.ghost) drag.ghost.remove();
      }
      function onUp() { cleanup(); finishDrop(); }
      function onCancel() { cleanup(); clearDrag(); drag = null; }
    });
  }

  function moveGhost(e) {
    if (!drag || !drag.ghost) return;
    drag.ghost.style.transform = 'translate(' + (e.clientX - drag.dx) + 'px,' + (e.clientY - drag.dy) + 'px) rotate(-1.5deg)';
    var under = document.elementFromPoint(e.clientX, e.clientY);
    var col = under && under.closest && under.closest('.kanban__col');
    if (col) placeMarker(col.querySelector('.kanban__list'), e.clientY);
    // Défilement automatique du kanban (mobile) près des bords
    var k = el.querySelector('.kanban');
    if (k) {
      var kr = k.getBoundingClientRect();
      if (e.clientX > kr.right - 40) k.scrollLeft += 12;
      else if (e.clientX < kr.left + 40) k.scrollLeft -= 12;
    }
  }

  /* --- Montage ------------------------------------------------------------- */
  function mount(node) {
    el = node;
    bindDnD();
    bindPointerDrag();

    el.addEventListener('click', function (e) {
      var b;
      if ((b = e.target.closest('[data-card-menu]'))) { e.stopPropagation(); cardMenu(b); return; }
      if ((b = e.target.closest('[data-mode]'))) { S.setUI({ tasksView: b.getAttribute('data-mode') }); return; }
      if ((b = e.target.closest('[data-filter-cat]'))) {
        var id = b.getAttribute('data-filter-cat');
        var cats = filters().categories.slice();
        var k = cats.indexOf(id);
        if (k >= 0) cats.splice(k, 1); else cats.push(id);
        setFilter({ categories: cats });
        return;
      }
      if (e.target.closest('[data-filter-clear]')) {
        S.setUI({ filters: { q: '', categories: [], priority: '', tag: '', client: '', status: '', due: '' } });
        setTimeout(function () { var q = el.querySelector('[data-filter="q"]'); if (q) q.focus(); }, 0);
        return;
      }
      if ((b = e.target.closest('[data-sort]'))) {
        var key = b.getAttribute('data-sort');
        var s = S.get().settings.ui.sort;
        S.setUI({ sort: { key: key, dir: s.key === key && s.dir === 'asc' ? 'desc' : 'asc' } });
        return;
      }
      if ((b = e.target.closest('[data-add-in]'))) { L.taskForm.open({ status: b.getAttribute('data-add-in'), returnTo: b }); return; }
      var card = e.target.closest('.task-card');
      if (card && !e.target.closest('button, a')) { L.drawer.open(card.getAttribute('data-id'), { returnTo: card }); return; }
      var row = e.target.closest('[data-row]');
      if (row && !e.target.closest('button, a')) L.drawer.open(row.getAttribute('data-row'), { returnTo: row.querySelector('.row-title') });
    });

    el.addEventListener('keydown', function (e) {
      var card = e.target.classList && e.target.classList.contains('task-card') ? e.target : null;
      if (!card) return;
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); L.drawer.open(card.getAttribute('data-id'), { returnTo: card }); return; }
      if (e.altKey && /^Arrow/.test(e.key)) { e.preventDefault(); keyMove(card, e); return; }
      if (e.key === 'ContextMenu' || (e.shiftKey && e.key === 'F10')) { e.preventDefault(); cardMenu(card.querySelector('[data-card-menu]')); }
    });

    var onSearch = U.debounce(function (v) { setFilter({ q: v }); }, 180);
    el.addEventListener('input', function (e) {
      if (e.target.getAttribute('data-filter') === 'q') onSearch(e.target.value);
    });
    el.addEventListener('change', function (e) {
      var f = e.target.getAttribute('data-filter');
      if (f && f !== 'q') { var p = {}; p[f] = e.target.value; setFilter(p); }
      if (e.target.hasAttribute('data-sort-select')) S.setUI({ sort: { key: e.target.value, dir: 'asc' } });
    });

    S.subscribe(function (type, d) {
      if (L.app.view() !== 'tasks') { el.dataset.stale = '1'; return; }
      if (drag) return;
      if (type === 'ui' && !(d.filters || d.tasksView || d.sort)) return;
      if (type === 'mood') return;
      render();
    });
  }

  function show() { if (!el.firstChild || el.dataset.stale) { delete el.dataset.stale; render(); } }

  L.views = L.views || {};
  L.views.tasks = { mount: mount, render: render, show: show, moveTo: moveTo, title: 'Suivi des tâches' };
})(window.Lamia = window.Lamia || {});

</script>
  <script  data-source="js/ui-planning.js">
/* ==========================================================================
   Plateforme de suivi - Lamia — Maquette · Planning
   Timeline type Gantt : barres du début à la fin, regroupées par catégorie,
   avancement à l'intérieur, repère « aujourd'hui », zoom semaine / mois,
   navigation, week-ends teintés. Sur mobile : liste chronologique.
   Une tâche en retard se signale par un fil pointillé jusqu'à aujourd'hui
   et la mention « à replanifier », sans couleur alarmante.
   ========================================================================== */
(function (L) {
  'use strict';

  var D = L.dates, S = L.store, U = L.ui, Q = L.q;
  var esc = U.esc, icon = U.icon, NB = D.NBSP;
  var el = null;

  function span(t) {
    if (!t.startDate && !t.endDate) return null;
    var a = t.startDate || t.endDate, b = t.endDate || t.startDate;
    return a <= b ? [a, b] : [b, a];
  }

  function groups(p) {
    var st = S.get();
    return st.categories.map(function (c) {
      var list = st.tasks.filter(function (t) {
        var s = span(t);
        if (t.categoryId !== c.id || !s) return false;
        var lateEnd = Q.isOverdue(t) ? D.today() : s[1];
        return s[0] <= p.end && D.max(s[1], lateEnd) >= p.start;
      }).sort(function (x, y) { var a = span(x)[0], b = span(y)[0]; return a < b ? -1 : a > b ? 1 : x.title.localeCompare(y.title, 'fr'); });
      return { cat: c, tasks: list };
    }).filter(function (g) { return g.tasks.length; });
  }

  function pct(n, total) { return (n / total * 100).toFixed(4) + '%'; }

  function ganttHTML(p) {
    var days = p.days, n = days.length;
    var today = D.today();
    var ti = days.indexOf(today);
    var zoom = p.kind;
    // Week-ends teintés : un dégradé calculé pour la période (tokens uniquement)
    var weekendBg = 'linear-gradient(90deg,' + days.map(function (d, i) {
      return (D.isWeekend(d) ? 'var(--gantt-weekend)' : 'transparent') + ' ' + pct(i, n) + ' ' + pct(i + 1, n);
    }).join(',') + ')';

    var head = '<div class="gantt__row gantt__row--head" aria-hidden="true"><div class="gantt__label gantt__label--head">Tâches</div>' +
      '<div class="gantt__track gantt__days">' + days.map(function (d) {
        var dd = D.parse(d);
        return '<span class="gantt__day' + (D.isWeekend(d) ? ' is-weekend' : '') + (d === today ? ' is-today' : '') + '">' +
          '<span class="gantt__dow">' + (zoom === 'week' ? D.cap(D.DAYS_SHORT[dd.getDay()]) : D.DAYS_LETTER[dd.getDay()]) + '</span><span class="gantt__num num">' + dd.getDate() + '</span></span>';
      }).join('') + '</div></div>';

    var gs = groups(p);
    var body = gs.map(function (g) {
      var rows = g.tasks.map(function (t) {
        var s = span(t);
        var a = Math.max(0, D.diff(p.start, s[0]));
        var b = Math.min(n - 1, D.diff(p.start, s[1]));
        var clippedL = s[0] < p.start, clippedR = s[1] > p.end;
        var late = Q.isOverdue(t);
        var visible = s[1] >= p.start && s[0] <= p.end;
        var bar = '';
        var aria = t.title + ', du ' + D.dayMonthLong(s[0]) + ' au ' + D.dayMonthLong(s[1]) + ', ' + t.progress + ' %' + (late ? ', à replanifier' : '') + (t.status === 'done' ? ', terminée' : '');
        if (visible) {
          bar = '<button type="button" class="gantt__bar ' + U.hue(g.cat) + (t.status === 'done' ? ' is-done' : '') + (late ? ' is-late' : '') + (clippedL ? ' is-clip-l' : '') + (clippedR ? ' is-clip-r' : '') + '" ' +
            'style="--l:' + pct(a, n) + ';--w:' + pct(b - a + 1, n) + ';--value:' + t.progress + '" data-open-task="' + t.id + '" data-focus-key="bar-' + t.id + '" aria-label="' + esc(aria) + '">' +
            '<span class="gantt__bar-label">' + (t.status === 'done' ? icon('check') : '') + esc(t.title) + '</span><span class="gantt__bar-pct num">' + t.progress + NB + '%</span>' +
            '<span class="gantt__bar-fill" aria-hidden="true"></span></button>';
        }
        // Glissement : du lendemain de l'échéance jusqu'à aujourd'hui
        if (late) {
          var sa = Math.max(0, D.diff(p.start, D.addDays(s[1], 1)));
          var sb = Math.min(n - 1, D.diff(p.start, today));
          if (sb >= sa && sa <= n - 1 && sb >= 0) bar += '<span class="gantt__slip ' + U.hue(g.cat) + '" style="--l:' + pct(sa, n) + ';--w:' + pct(sb - sa + 1, n) + '" aria-hidden="true"></span>';
          if (!visible) bar += '<button type="button" class="gantt__ghost" style="--l:' + pct(Math.max(0, sb), n) + ';--w:' + pct(1, n) + '" data-open-task="' + t.id + '" aria-label="' + esc(aria) + '">' + icon('refresh') + '</button>';
        }
        return '<li class="gantt__row"><div class="gantt__label">' +
          '<button type="button" class="gantt__title" data-open-task="' + t.id + '" tabindex="-1">' + esc(t.title) + '</button>' +
          '<span class="gantt__meta">' + esc(D.dayMonth(s[0])) + ' → ' + esc(D.dayMonth(s[1])) + (late ? ' · <span class="gantt__late">' + icon('refresh') + 'à replanifier</span>' : '') + '</span></div>' +
          '<div class="gantt__track">' + bar + '</div></li>';
      }).join('');
      return '<section class="gantt__group" aria-label="' + esc(g.cat.name + ', ' + U.plural(g.tasks.length, 'tâche')) + '">' +
        '<div class="gantt__row gantt__row--group"><div class="gantt__label gantt__label--group">' + U.catChip(g.cat) + '<span class="gantt__count">' + U.plural(g.tasks.length, 'tâche') + '</span></div><div class="gantt__track" aria-hidden="true"></div></div>' +
        '<ul class="gantt__rows" role="list">' + rows + '</ul></section>';
    }).join('');

    var todayLine = ti >= 0 ? '<div class="gantt__today" style="--x:' + ((ti + 0.5) / n).toFixed(5) + '" aria-hidden="true"></div>' : '';

    return '<div class="gantt gantt--' + zoom + '" style="--days:' + n + ';--weekend-bg:' + weekendBg + '">' +
      '<div class="gantt__scroll"><div class="gantt__inner" aria-label="Planning, ' + esc(p.label) + '">' + head +
        '<div class="gantt__body">' + todayLine + (body || '<div class="gantt__empty">' + emptyHTML() + '</div>') + '</div>' +
      '</div></div></div>';
  }

  function emptyHTML() {
    return '<div class="empty-state"><div class="empty-state__art">' + icon('planning') + '</div><p class="empty-state__title">Rien de prévu sur cette période</p>' +
      '<p class="empty-state__text">Une page blanche, c’est aussi de la place pour respirer.</p></div>';
  }

  function listHTML(p) {
    var gs = groups(p);
    var items = [];
    gs.forEach(function (g) { g.tasks.forEach(function (t) { items.push({ t: t, c: g.cat, s: span(t) }); }); });
    items.sort(function (x, y) { return x.s[0] < y.s[0] ? -1 : x.s[0] > y.s[0] ? 1 : 0; });
    if (!items.length) return emptyHTML();
    var weeks = {};
    var order = [];
    items.forEach(function (it) {
      var w = it.s[0] < p.start ? 'before' : D.startOfWeek(it.s[0]);
      if (!weeks[w]) { weeks[w] = []; order.push(w); }
      weeks[w].push(it);
    });
    return order.map(function (w) {
      var label = w === 'before' ? 'Déjà en route' : w === D.startOfWeek(D.today()) ? 'Cette semaine' : 'Semaine du ' + D.dayMonth(w);
      return '<section class="plan-week"><h3 class="plan-week__title">' + esc(label) + '</h3><ul class="plan-list" role="list">' +
        weeks[w].map(function (it) {
          var t = it.t, late = Q.isOverdue(t);
          return '<li><button type="button" class="glass plan-item ' + U.hue(it.c) + (t.status === 'done' ? ' is-done' : '') + '" data-open-task="' + t.id + '">' +
            '<span class="plan-item__bar" aria-hidden="true"></span>' +
            '<span class="plan-item__body"><span class="plan-item__dates">' + esc(D.dayMonth(it.s[0])) + ' → ' + esc(D.dayMonth(it.s[1])) + (late ? ' · <span class="gantt__late">' + icon('refresh') + 'à replanifier</span>' : '') + '</span>' +
            '<span class="plan-item__title">' + esc(t.title) + '</span>' +
            '<span class="plan-item__meta">' + U.catChip(it.c) + '<span class="plan-item__pct num">' + t.progress + NB + '%</span></span>' +
            U.progress(t.progress, 'progress--sm progress--hue ' + U.hue(it.c)) + '</span></button></li>';
        }).join('') + '</ul></section>';
    }).join('');
  }

  function render() {
    if (!el) return;
    var ui = S.get().settings.ui;
    var zoom = ui.planningZoom || 'month';
    var p = D.period(zoom, ui.planningAnchor || D.today());
    var isNow = D.between(D.today(), p.start, p.end);
    var unplanned = S.get().tasks.filter(function (t) { return !span(t) && t.status !== 'done'; });
    var legend = S.get().categories.map(function (c) { return '<span class="legend__item">' + U.catDot(c) + esc(c.name) + '</span>'; }).join('');
    var html =
      '<header class="page-head"><div class="page-head__text"><p class="eyebrow">Du début à la fin, en un coup d’œil</p>' +
        '<h1 class="h1" id="h-planning" tabindex="-1">Planning</h1></div>' +
        '<div class="page-head__actions"><div class="segmented" role="group" aria-label="Zoom du planning">' +
          '<button type="button" class="segmented__item" data-zoom="week" data-focus-key="z-week" aria-pressed="' + (zoom === 'week') + '">Semaine</button>' +
          '<button type="button" class="segmented__item" data-zoom="month" data-focus-key="z-month" aria-pressed="' + (zoom === 'month') + '">Mois</button></div></div></header>' +
      '<div class="period-bar">' +
        '<div class="period-nav">' +
          '<button type="button" class="btn btn--secondary btn--icon btn--sm" data-plan-nav="-1" data-focus-key="pn-prev" aria-label="' + (zoom === 'week' ? 'Semaine précédente' : 'Mois précédent') + '">' + icon('chevron-left') + '</button>' +
          '<button type="button" class="btn btn--secondary btn--sm" data-plan-today data-focus-key="pn-today"' + (isNow ? ' aria-disabled="true"' : '') + '>Aujourd’hui</button>' +
          '<button type="button" class="btn btn--secondary btn--icon btn--sm" data-plan-nav="1" data-focus-key="pn-next" aria-label="' + (zoom === 'week' ? 'Semaine suivante' : 'Mois suivant') + '">' + icon('chevron-right') + '</button>' +
        '</div>' +
        '<h2 class="period-bar__label" aria-live="polite">' + esc(p.label) + '</h2>' +
        '<div class="legend" aria-label="Légende">' + legend + '<span class="legend__item legend__item--late"><span class="legend__slip" aria-hidden="true"></span>à replanifier</span></div>' +
      '</div>' +
      '<section class="glass card gantt-card" aria-label="Timeline">' + ganttHTML(p) + '</section>' +
      '<section class="plan-mobile" aria-label="Planning en liste">' + listHTML(p) + '</section>' +
      '<section class="glass card unplanned" aria-labelledby="h-unplanned"><div class="card__header"><div><h2 class="card__title" id="h-unplanned">Non planifiées</h2>' +
        '<p class="card__subtitle">Sans date de début ni de fin : elles attendent leur moment.</p></div></div>' +
        (unplanned.length ? '<ul class="unplanned__list" role="list">' + unplanned.map(function (t) {
          var c = S.category(t.categoryId);
          return '<li><button type="button" class="glass glass--nested glass--interactive unplanned__item" data-open-task="' + t.id + '">' + U.catDot(c) + '<span>' + esc(t.title) + '</span>' + icon('calendar') + '<span class="sr-only">Ajouter des dates</span></button></li>';
        }).join('') + '</ul>' : '<p class="empty-line">Tout est daté. Bel ordre !</p>') +
      '</section>';
    U.keepFocus(el, function () { el.innerHTML = html; });
    U.typo(el);
    // Centre « aujourd'hui » quand la timeline défile (mois sur petit écran)
    var sc = el.querySelector('.gantt__scroll');
    var line = el.querySelector('.gantt__today');
    if (sc && line && sc.scrollWidth > sc.clientWidth) sc.scrollLeft = Math.max(0, line.offsetLeft - sc.clientWidth / 2);
  }

  function mount(node) {
    el = node;
    el.addEventListener('click', function (e) {
      var b;
      if ((b = e.target.closest('[data-zoom]'))) { S.setUI({ planningZoom: b.getAttribute('data-zoom') }); return; }
      if ((b = e.target.closest('[data-plan-nav]'))) {
        var ui = S.get().settings.ui;
        S.setUI({ planningAnchor: D.shift(ui.planningZoom, ui.planningAnchor || D.today(), +b.getAttribute('data-plan-nav')) });
        return;
      }
      if (e.target.closest('[data-plan-today]')) { S.setUI({ planningAnchor: D.today() }); }
    });
    S.subscribe(function (type, d) {
      if (L.app.view() !== 'planning') { el.dataset.stale = '1'; return; }
      if (type === 'ui' && !('planningZoom' in d || 'planningAnchor' in d)) return;
      if (type === 'mood' || type === 'timer') return;
      render();
    });
  }

  function show() { if (!el.firstChild || el.dataset.stale) { delete el.dataset.stale; render(); } }

  L.views = L.views || {};
  L.views.planning = { mount: mount, render: render, show: show, title: 'Planning' };
})(window.Lamia = window.Lamia || {});

</script>
  <script  data-source="js/ui-recap.js">
/* ==========================================================================
   Plateforme de suivi - Lamia — Maquette · Récap
   Période jour / semaine / mois + navigation ; KPI ; heures par catégorie
   en petits multiples (jamais additionnées, objectif Flow Line) ; listes
   « à terminer » et « arrivent bientôt » ; répartition ; courbe d'humeur ;
   export CSV (fonctionnel) et PDF (impression A4).
   ========================================================================== */
(function (L) {
  'use strict';

  var D = L.dates, S = L.store, U = L.ui, Q = L.q, C = L.charts;
  var esc = U.esc, icon = U.icon, NB = D.NBSP;
  var el = null, charts = [];

  function period() {
    var ui = S.get().settings.ui;
    return D.period(ui.recapPeriod || 'week', ui.recapAnchor || D.today());
  }

  function prevPeriod(p) { return D.period(p.kind, D.shift(p.kind, p.start, -1)); }

  // Pour une période en cours, on compare « à date » : la période précédente tronquée
  // au même nombre de jours écoulés (comparer un mois entamé à un mois complet découragerait).
  function prevComparable(p) {
    var prev = prevPeriod(p);
    if (!isCurrent(p)) return prev;
    var elapsed = D.diff(p.start, D.today());
    var end = D.min(prev.end, D.addDays(prev.start, elapsed));
    return { kind: prev.kind, start: prev.start, end: end, days: D.eachDay(prev.start, end), label: prev.label, partial: true };
  }

  /* --- Heures ------------------------------------------------------------- */
  function goalDays(c) {
    var g = Q.goalFor(c);
    return g ? g.days : [];
  }

  function hoursSeries(c, p) {
    var g = Q.goalFor(c);
    var daily = Q.dailyMinutes(c.id, p.start, p.end, true);
    var today = D.today();
    if (p.kind === 'week') {
      return p.days.map(function (d) {
        var gd = g && goalDays(c).indexOf(D.dow(d)) >= 0 ? g.daily : null;
        return { key: d, label: D.cap(D.DAYS_SHORT[D.dow(d)]), short: D.DAYS_LETTER[D.dow(d)], sub: String(D.parse(d).getDate()), value: daily[d], goal: gd, future: d > today, current: d === today,
          title: D.cap(D.dayMonthLong(d)) + ' : ' + D.duration(daily[d]) + (gd ? ', objectif ' + D.duration(gd) : ''), tipTitle: D.cap(D.dayMonthLong(d)) };
      });
    }
    // Mois : une barre par semaine (portion du mois)
    var weeks = [];
    var w = D.startOfWeek(p.start);
    while (w <= p.end) {
      var a = D.max(w, p.start), b = D.min(D.addDays(w, 6), p.end);
      var v = 0, goal = 0;
      D.eachDay(a, b).forEach(function (d) {
        v += daily[d] || 0;
        if (g && goalDays(c).indexOf(D.dow(d)) >= 0) goal += g.daily;
      });
      weeks.push({ key: w, label: 'S' + D.isoWeek(w), sub: D.parse(a).getDate() + '–' + D.parse(b).getDate(), value: v, goal: g ? goal : null,
        future: a > today, current: D.between(today, a, b),
        title: 'Semaine ' + D.isoWeek(w) + ', du ' + D.dayMonth(a) + ' au ' + D.dayMonth(b) + ' : ' + D.duration(v) + (g ? ', objectif ' + D.duration(goal) : ''),
        tipTitle: 'Semaine ' + D.isoWeek(w) + ' · ' + D.dayMonth(a) + ' → ' + D.dayMonth(b) });
      w = D.addDays(w, 7);
    }
    return weeks;
  }

  function hoursCard(c, p) {
    var g = Q.goalFor(c);
    var mins = Q.minutesByCategory(p.start, p.end, true)[c.id] || 0;
    var goalTotal = 0;
    if (g) D.eachDay(p.start, p.end).forEach(function (d) { if (g.days.indexOf(D.dow(d)) >= 0) goalTotal += g.daily; });
    var prev = prevComparable(p);
    var prevMins = Q.minutesByCategory(prev.start, prev.end, false)[c.id] || 0;
    var prevName = { day: 'la veille', week: 'S' + D.isoWeek(prev.start), month: D.MONTHS_SHORT[D.parse(prev.start).getMonth()] }[p.kind];
    var deltaTxt = prevMins || mins ? (mins - prevMins >= 0 ? '+' : '−') + NB + D.duration(Math.abs(mins - prevMins)) + ' vs ' + prevName : '';
    var compare = g ? '<span class="hcard__goal">sur ' + D.duration(goalTotal) + '</span>' : '';
    var goalNote = '';
    if (g) {
      var left = goalTotal - mins;
      if (isCurrent(p) && p.kind !== 'day') {
        var toDate = 0;
        D.eachDay(p.start, D.today()).forEach(function (d) { if (g.days.indexOf(D.dow(d)) >= 0) toDate += g.daily; });
        goalNote = 'Objectif à ce jour : ' + D.duration(toDate) + (mins >= toDate ? ', c’est dans la poche.' : '. La période n’est pas finie, rien ne presse.');
      } else {
        goalNote = left > 0 ? 'Encore ' + D.duration(left) + ' pour l’objectif de la période.' : (left === 0 ? 'Objectif atteint, pile poil.' : 'Objectif atteint : +' + NB + D.duration(-left) + ', tout en douceur.');
      }
    } else {
      goalNote = c.group === 'auto-entreprise' ? 'Sans objectif : le perso se fait surtout le samedi.' : 'Sans objectif d’heures.';
    }
    var body;
    var id = 'hc-' + c.id;
    if (p.kind === 'day') {
      var entries = [];
      S.get().tasks.forEach(function (t) { if (t.categoryId === c.id) t.timeEntries.forEach(function (e) { if (e.date === p.start) entries.push({ t: t, e: e }); }); });
      body = (g ? '<span class="progress progress--lg ' + progressCls(c) + '" style="--value:' + (goalTotal ? Math.min(100, Math.round(mins / goalTotal * 100)) : 0) + '" aria-hidden="true"></span>' : '') +
        (entries.length ? '<ul class="day-entries" role="list">' + entries.map(function (x) {
          return '<li><span class="day-entries__title">' + esc(x.t.title) + '</span><span class="day-entries__dur num">' + D.duration(x.e.minutes) + '</span></li>';
        }).join('') + runningRow(c, p) + '</ul>' : '<p class="empty-line">Pas d’heures ce jour-là' + (D.isWeekend(p.start) && c.group === 'flowline' ? ' : c’était le week-end.' : '.') + '</p>');
    } else {
      body = '<div class="chart-host" data-chart="bars" data-chart-id="' + id + '"></div>' +
        (g ? '<p class="chart-legend"><span class="chart-legend__goal" aria-hidden="true"></span>Objectif ' + (p.kind === 'week' ? D.duration(g.daily) + ' par jour travaillé' : D.duration(g.weekly) + ' par semaine (au prorata en début et fin de mois)') + '</p>' : '');
      charts.push({ id: id, kind: 'bars', hue: U.hue(c), name: c.name, data: hoursSeries(c, p) });
    }
    return '<section class="glass card hcard ' + U.hue(c) + (g ? ' hcard--goal' : '') + '" aria-labelledby="' + id + '-t">' +
      '<div class="hcard__head"><h3 class="hcard__title" id="' + id + '-t">' + U.catChip(c) + '</h3>' +
        (deltaTxt ? '<span class="stat__delta" title="Comparaison avec la période précédente' + (isCurrent(p) ? ', au même stade (période en cours)' : '') + '">' + esc(deltaTxt) + '</span>' : '') + '</div>' +
      '<p class="hcard__value"><span class="hcard__num">' + D.duration(mins) + '</span>' + compare + '</p>' +
      (goalNote ? '<p class="hcard__note">' + esc(goalNote) + '</p>' : '') + body +
      (p.kind !== 'day' ? tableTwin(c, p) : '') +
    '</section>';
  }

  // Le chrono en cours compte dans le total du jour : on l'affiche aussi dans la liste
  function runningRow(c, p) {
    var tm = S.get().timer;
    var t = tm && S.task(tm.taskId);
    if (!t || t.categoryId !== c.id || p.start !== D.today()) return '';
    return '<li class="is-running"><span class="day-entries__title"><span class="chrono__live' + (tm.pausedAt ? ' is-paused' : '') + '" aria-hidden="true"></span>' + esc(t.title) + ' <span class="text-muted">(chrono en cours)</span></span>' +
      '<span class="day-entries__dur num">' + D.duration(Math.floor(L.chrono.elapsed() / 60000)) + '</span></li>';
  }

  function isCurrent(p) { return D.between(D.today(), p.start, p.end); }

  function progressCls(c) {
    return { flowline: 'progress--flowline', carnet: 'progress--carnet', auto: 'progress--auto' }[c.color] || 'progress--hue ' + U.hue(c);
  }

  function tableTwin(c, p) {
    var rows = hoursSeries(c, p);
    return '<details class="data-twin"><summary>Voir les données</summary><table class="mini-table"><thead><tr><th scope="col">' + (p.kind === 'week' ? 'Jour' : 'Semaine') + '</th><th scope="col">Heures</th>' +
      (Q.goalFor(c) ? '<th scope="col">Objectif</th>' : '') + '</tr></thead><tbody>' +
      rows.map(function (r) { return '<tr><th scope="row">' + esc(r.tipTitle) + '</th><td class="num">' + D.duration(r.value) + '</td>' + (Q.goalFor(c) ? '<td class="num">' + (r.goal ? D.duration(r.goal) : '—') + '</td>' : '') + '</tr>'; }).join('') +
      '</tbody></table></details>';
  }

  /* --- KPI ------------------------------------------------------------------ */
  function kpis(p) {
    var s = Q.summary(p);
    var pp = prevComparable(p);
    var ps = Q.summary(pp);
    var vs = 'vs ' + { day: 'la veille', week: 'S' + D.isoWeek(pp.start), month: D.MONTHS_SHORT[D.parse(pp.start).getMonth()] }[p.kind];
    function delta(a, b) {
      var d = a - b;
      return '<span class="stat__delta" title="Comparaison avec la période précédente' + (pp.partial ? ', au même stade' : '') + '">' + (d > 0 ? icon('arrow-up') : d < 0 ? icon('arrow-down') : '') + (d > 0 ? '+' : '') + (d === 0 ? '=' : d) + ' ' + vs + '</span>';
    }
    function tile(ic, label, value, extra, cls) {
      return '<article class="glass stat ' + (cls || '') + '"><div class="stat__head"><span class="stat__icon">' + icon(ic) + '</span><span class="stat__label">' + esc(label) + '</span></div>' +
        '<div class="stat__value">' + value + '</div>' + (extra || '') + '</article>';
    }
    var replanNow = s.replan.length;
    var rate = s.rate;
    return '<div class="kpi-row">' +
      tile('plus', 'Tâches créées', s.created.length, delta(s.created.length, ps.created.length)) +
      tile('check', 'Terminées', s.done.length, delta(s.done.length, ps.done.length), 'stat--done') +
      tile('tasks', 'En cours', s.ongoing.length, '<span class="stat__sub">dont ' + s.ongoing.filter(function (t) { return t.status === 'review'; }).length + ' en validation</span>') +
      tile('refresh', 'À replanifier', replanNow, '<span class="stat__sub">' + (replanNow ? 'Échéance passée sur la période' : 'Rien à replanifier') + '</span>', 'stat--replan') +
      '<article class="glass stat stat--ring"><div class="stat__head"><span class="stat__icon">' + icon('target') + '</span><span class="stat__label">Taux de complétion</span></div>' +
        '<div class="stat-ring">' +
          (rate == null ? '<p class="stat__sub">Aucune échéance passée sur la période.</p>'
            : '<div class="ring" style="--value:' + rate + ';--ring-size:72px;--ring-thickness:8px" role="img" aria-label="' + rate + ' % des échéances tenues"><span class="ring__value">' + rate + '<small>%</small></span></div>' +
              '<p class="stat__sub">' + s.dueDone.length + ' échéance' + (s.dueDone.length > 1 ? 's' : '') + ' tenue' + (s.dueDone.length > 1 ? 's' : '') + ' sur ' + s.due.length + (isCurrent(p) ? ', jusqu’à aujourd’hui' : '') + '</p>') +
        '</div></article>' +
    '</div>';
  }

  /* --- Listes --------------------------------------------------------------- */
  var expanded = {};
  function taskList(list, empty, key) {
    if (!list.length) return '<p class="empty-line">' + esc(empty) + '</p>';
    var MAX = 6;
    var more = list.length - MAX;
    var shown = more > 0 && !expanded[key] ? list.slice(0, MAX) : list;
    return '<ul class="recap-list" role="list">' + shown.map(function (t) {
      var c = S.category(t.categoryId);
      return '<li><button type="button" class="recap-item" data-open-task="' + t.id + '">' + U.catDot(c) +
        '<span class="recap-item__text"><span class="recap-item__title">' + esc(t.title) + '</span><span class="recap-item__meta">' + esc(c.name) + (t.client ? ' · ' + esc(t.client) : '') + ' · ' + t.progress + NB + '%</span></span>' +
        U.dueBadge(t) + '</button></li>';
    }).join('') + '</ul>' +
      (more > 0 ? '<button type="button" class="btn btn--ghost btn--sm recap-more" data-more="' + key + '" data-focus-key="more-' + key + '" aria-expanded="' + !!expanded[key] + '">' +
        icon(expanded[key] ? 'chevron-up' : 'chevron-down') + (expanded[key] ? 'Afficher moins' : 'Afficher les ' + more + ' autres') + '</button>' : '');
  }

  /* --- Humeur ------------------------------------------------------------- */
  function moodDays(p) {
    var end = p.end > D.today() ? D.today() : p.end;
    var start = D.addDays(end, -29);
    return D.eachDay(start, end).map(function (d) { var m = Q.mood(d); return { date: d, level: m ? m.level : null, note: m ? m.note : '' }; });
  }

  function moodInsight(days) {
    var flow = S.get().categories.filter(function (c) { return c.group === 'flowline'; });
    var heavy = [], light = [];
    days.forEach(function (d) {
      if (!d.level || D.isWeekend(d.date)) return;
      var m = 0;
      flow.forEach(function (c) { m += Q.dailyMinutes(c.id, d.date, d.date, false)[d.date]; });
      (m >= 450 ? heavy : light).push(d.level);
    });
    function avg(a) { return a.length ? a.reduce(function (x, y) { return x + y; }, 0) / a.length : null; }
    var noted = days.filter(function (d) { return d.level; });
    var mean = avg(noted.map(function (d) { return d.level; }));
    var ah = avg(heavy), al = avg(light);
    var msg;
    if (ah == null || al == null) msg = 'Pas encore assez de jours pour comparer. Ça viendra avec le temps.';
    else if (Math.abs(ah - al) < 0.3) msg = 'Ton humeur reste stable, quelle que soit la charge. Bel équilibre.';
    else if (al > ah) msg = 'Les journées plus légères te réussissent un peu mieux. À garder en tête quand tu planifies.';
    else msg = 'Les grosses journées ne te font pas peur, au contraire. Pense quand même aux pauses.';
    function fmt(v) { return v == null ? '—' : v.toFixed(1).replace('.', ','); }
    return '<div class="insight">' +
      '<div class="insight__fig"><span class="insight__num num">' + fmt(mean) + '</span><span class="insight__label">humeur moyenne sur ' + U.plural(noted.length, 'jour noté', 'jours notés') + '</span></div>' +
      '<div class="insight__split">' +
        '<div><span class="insight__num insight__num--sm num">' + fmt(ah) + '</span><span class="insight__label">jours à 7' + NB + 'h 30 ou plus de Flow Line</span></div>' +
        '<div><span class="insight__num insight__num--sm num">' + fmt(al) + '</span><span class="insight__label">journées plus légères</span></div>' +
      '</div><p class="insight__msg">' + esc(msg) + '</p></div>';
  }

  /* --- Répartition ------------------------------------------------------ */
  function activeTasks(p) {
    return S.get().tasks.filter(function (t) {
      if (t.timeEntries.some(function (e) { return D.between(e.date, p.start, p.end); })) return true;
      if (t.endDate && D.between(t.endDate, p.start, p.end)) return true;
      return D.between(t.createdAt, p.start, p.end);
    });
  }

  /* --- Export CSV : une ligne par entrée, sous-totaux par catégorie ------- */
  function csv(p) {
    var st = S.get();
    var lines = [['Date', 'Catégorie', 'Tâche', 'Client', 'Durée (h)', 'Note']];
    function cell(v) { v = String(v == null ? '' : v); return /[";\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
    st.categories.forEach(function (c) {
      var rows = [];
      st.tasks.forEach(function (t) {
        if (t.categoryId !== c.id) return;
        t.timeEntries.forEach(function (e) { if (D.between(e.date, p.start, p.end)) rows.push({ t: t, e: e }); });
      });
      if (!rows.length) return;
      rows.sort(function (a, b) { return a.e.date < b.e.date ? -1 : a.e.date > b.e.date ? 1 : a.t.title.localeCompare(b.t.title, 'fr'); });
      var sum = 0;
      rows.forEach(function (r) {
        sum += r.e.minutes;
        lines.push([D.numeric(r.e.date), c.name, r.t.title, r.t.client, D.decimalHours(r.e.minutes), r.e.note]);
      });
      lines.push(['', 'Sous-total ' + c.name, '', '', D.decimalHours(sum), '']);
      lines.push(['', '', '', '', '', '']);
    });
    return '﻿' + lines.map(function (l) { return l.map(cell).join(';'); }).join('\r\n') + '\r\n';
  }

  function exportCSV() {
    var p = period();
    var name = 'heures-lamia_' + p.start + (p.end !== p.start ? '_' + p.end : '') + '.csv';
    U.download(name, csv(p), 'text/csv;charset=utf-8');
    U.toast({ kind: 'success', icon: 'download', title: 'Export CSV prêt', text: name + ' : une ligne par entrée, sous-totaux par catégorie, sans total général.' });
  }

  function exportPDF() {
    U.toast({ icon: 'export', title: 'Export PDF', text: 'Choisis « Enregistrer au format PDF » dans la fenêtre d’impression (A4).', duration: 4000 });
    setTimeout(function () { window.print(); }, 300);
  }

  /* --- Rendu ---------------------------------------------------------------- */
  function render() {
    if (!el) return;
    charts = [];
    var p = period();
    var st = S.get();
    var s = Q.summary(p);
    var isNow = D.between(D.today(), p.start, p.end);
    var after = p.end >= D.today() ? p.end : D.today();
    var soon = Q.dueBetween(D.addDays(after, 1), D.addDays(after, 14));
    var toFinish = st.tasks.filter(function (t) { return !Q.isDone(t) && t.endDate && t.endDate <= p.end && (t.endDate >= p.start || Q.isOverdue(t)); })
      .sort(function (a, b) { return a.endDate < b.endDate ? -1 : 1; });
    var days = moodDays(p);
    var active = activeTasks(p);
    var catRows = st.categories.map(function (c) {
      var n = active.filter(function (t) { return t.categoryId === c.id; }).length;
      return { label: c.name, value: n, display: U.plural(n, 'tâche'), hue: U.hue(c) };
    });
    var tagCount = {};
    active.forEach(function (t) { t.tags.forEach(function (g) { tagCount[g] = (tagCount[g] || 0) + 1; }); });
    var tagRows = Object.keys(tagCount).sort(function (a, b) { return tagCount[b] - tagCount[a] || a.localeCompare(b, 'fr'); }).slice(0, 7)
      .map(function (g) { return { label: '#' + g, value: tagCount[g], display: U.plural(tagCount[g], 'tâche'), hue: 'hue--accent' }; });
    charts.push({ id: 'rc-cats', kind: 'hbars', rows: catRows, aria: 'Tâches actives par catégorie' });
    if (tagRows.length) charts.push({ id: 'rc-tags', kind: 'hbars', rows: tagRows, aria: 'Tâches actives par étiquette' });
    charts.push({ id: 'rc-mood', kind: 'mood', days: days, band: [p.start, p.end], aria: 'Courbe d’humeur des 30 derniers jours' });

    var html =
      '<header class="page-head"><div class="page-head__text"><p class="eyebrow">Statistiques et exports</p>' +
        '<h1 class="h1" id="h-recap" tabindex="-1">Récap</h1></div>' +
        '<div class="page-head__actions">' +
          '<button type="button" class="btn btn--secondary" data-export="csv">' + icon('download') + 'Export CSV</button>' +
          '<button type="button" class="btn btn--secondary" data-export="pdf">' + icon('export') + 'Export PDF</button>' +
        '</div></header>' +
      '<div class="print-head"><p class="print-head__brand">Plateforme de suivi - Lamia · Récap</p><p class="print-head__period">' + esc(p.label) + '</p>' +
        '<p class="print-head__meta">Exporté le ' + esc(D.long(D.today())) + '. Heures présentées par catégorie, sans total général.</p></div>' +
