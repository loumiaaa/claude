# Plateforme de suivi - Lamia : version web (PWA) publiée sur GitHub Pages.
# Prérequis (une fois) : dépôt public, et Settings → Pages → Source : « GitHub Actions ».
name: Publier l'app web

on:
  push:
    branches: ['claude/**', 'main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Construire l'app web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Télécharger General Sans (Fontshare, licence ITF FFL)
        run: |
          node scripts/fetch-general-sans.mjs || echo "::warning::General Sans non téléchargée : repli Poppins."

      - name: Construire
        run: node scripts/build-web.mjs

      - name: Vérifier Supabase (tables, connexion par e-mail)
        continue-on-error: true
        run: |
          node -e "
          const src = require('fs').readFileSync('web/config.js', 'utf8');
          const url = /supabaseUrl: '([^']*)'/.exec(src)[1], key = /supabaseAnonKey: '([^']*)'/.exec(src)[1];
          if (!url) { console.log('Synchro non configurée'); process.exit(0); }
          const h = { apikey: key, Authorization: 'Bearer ' + key };
          (async () => {
            const lines = [];
            for (const t of ['lamia_data', 'lamia_backups']) {
              const r = await fetch(url + '/rest/v1/' + t + '?select=*&limit=1', { headers: h });
              lines.push('Table ' + t + ' : ' + (r.ok ? 'OK (protégée, ' + (await r.json()).length + ' ligne visible sans connexion)' : 'ERREUR ' + r.status + ' ' + (await r.text()).slice(0, 160)));
            }
            const s = await (await fetch(url + '/auth/v1/settings', { headers: h })).json();
            lines.push('Connexion par e-mail : ' + (s.external && s.external.email ? 'activée' : 'DÉSACTIVÉE'));
            lines.push('Confirmation par e-mail désactivée : ' + (s.mailer_autoconfirm ? 'oui' : 'NON'));
            lines.push('Inscriptions fermées : ' + (s.disable_signup ? 'oui' : 'non'));
            console.log(lines.join('\n'));
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Supabase\n' + lines.map((l) => '- ' + l).join('\n') + '\n');
          })().catch((e) => { console.log('Supabase injoignable : ' + e.message); });
          "

      - name: Tests unitaires
        run: node --test "tests/unit/*.test.js"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/web-dist

  deploy:
    name: Publier
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
