# Plateforme de suivi - Lamia : publie le relais du Calendrier Apple sur Supabase.
# Prérequis (une fois) : un jeton d'accès Supabase dans les secrets du dépôt
# (Settings → Secrets and variables → Actions → SUPABASE_ACCESS_TOKEN).
# Sans ce secret, rien n'est publié (simple avertissement). Guide : docs/calendrier-apple.md
name: Publier le relais calendrier (Supabase)

on:
  push:
    branches: ['claude/**', 'main']
    paths: ['supabase/functions/**', '.github/workflows/supabase-functions.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Publier la fonction « calendar »
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier le jeton et le projet
        id: pre
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::Secret SUPABASE_ACCESS_TOKEN absent : relais non publié (voir docs/calendrier-apple.md)."
            echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          REF=$(grep -o "https://[a-z0-9]*\.supabase\.co" app/web/config.js | head -1 | sed -E 's#https://([a-z0-9]+)\.supabase\.co#\1#')
          if [ -z "$REF" ]; then echo "::error::Projet Supabase introuvable dans app/web/config.js"; exit 1; fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          cmp app/shared/ics.js supabase/functions/calendar/ics.js || { echo "::error::supabase/functions/calendar/ics.js n'est pas à jour (copier app/shared/ics.js)"; exit 1; }

      - uses: supabase/setup-cli@v1
        if: steps.pre.outputs.skip != '1'
        with:
          version: latest

      - name: Publier
        if: steps.pre.outputs.skip != '1'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy calendar --project-ref "${{ steps.pre.outputs.ref }}" --no-verify-jwt

      - name: Vérifier
        if: steps.pre.outputs.skip != '1'
        run: |
          sleep 5
          curl -fsS "https://${{ steps.pre.outputs.ref }}.supabase.co/functions/v1/calendar?ping=1" && echo " : relais en ligne"
